  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#09090f; --surface:#13131f; --surface2:#1a1a2e; --border:rgba(255,255,255,0.08); --text:#f0f0f8; --muted:rgba(255,255,255,0.45); --accent:#ff6b35; }
    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }

    /* NAV */
    .nav-wrap { border-bottom: 1px solid var(--border); background: rgba(9,9,15,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
    .nav { max-width: 1100px; margin: 0 auto; padding: 0.9rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 800; }
    .logo span { color: var(--accent); }
    .nav-right { display: flex; gap: 1rem; align-items: center; font-size: 14px; }
    .nav-link { color: var(--muted); }
    .nav-link:hover { color: var(--text); }
    .btn-nav { background: var(--accent); color: #fff; padding: 7px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; }

    /* LAYOUT */
    .page { max-width: 1000px; margin: 0 auto; padding: 2.5rem 2rem; display: grid; grid-template-columns: 240px 1fr; gap: 2rem; align-items: start; }

    /* SIDEBAR */
    .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: sticky; top: 70px; }
    .sidebar-top { padding: 1.75rem 1.5rem; text-align: center; border-bottom: 1px solid var(--border); }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #fff; margin: 0 auto 0.75rem; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sidebar-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 0.2rem; }
    .sidebar-email { font-size: 12px; color: var(--muted); margin-bottom: 0.75rem; }
    .plan-badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .plan-badge.free { background: rgba(255,255,255,0.07); color: var(--muted); }
    .plan-badge.pro { background: var(--accent); color: #fff; }
    .sidebar-usage { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border); }
    .usage-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem; }
    .usage-bar-wrap { background: rgba(255,255,255,0.06); border-radius: 4px; height: 5px; margin-bottom: 0.35rem; }
    .usage-bar { height: 5px; border-radius: 4px; background: var(--accent); transition: width 0.3s; }
    .usage-count { font-size: 12px; color: var(--muted); }
    .sidebar-nav { padding: 0.5rem 0; }
    .sidebar-nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1.5rem; font-size: 13px; color: var(--muted); cursor: pointer; }
    .sidebar-nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .sidebar-nav-item.active { color: var(--text); font-weight: 600; }

    /* MAIN */
    .main { display: flex; flex-direction: column; gap: 1.5rem; }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .section-title span { color: var(--accent); }

    /* FORM */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.35rem; }
    .form-input { width: 100%; padding: 9px 13px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); outline: none; }
    .form-input:focus { border-color: var(--accent); }
    .form-input[readonly] { color: var(--muted); cursor: not-allowed; }

    /* BUTTONS */
    .btn { padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #e55a25; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.3); }
    .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.08); }

    /* AI CONNECTIONS */
    .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-top: 0.5rem; }
    .ai-card { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 1rem; text-align: center; }
    .ai-card.connected { border-color: rgba(255,107,53,0.4); }
    .ai-name { font-size: 13px; font-weight: 600; margin-bottom: 0.35rem; }
    .ai-status { font-size: 11px; color: var(--muted); }
    .ai-status.ready { color: #22c55e; }

    /* PLAN CARD */
    .plan-card { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 1.25rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .plan-card-info h3 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 0.2rem; }
    .plan-card-info p { font-size: 12px; color: var(--muted); }
    .upgrade-card { background: rgba(255,107,53,0.05); border: 1px solid rgba(255,107,53,0.2); border-radius: 9px; padding: 1.25rem; text-align: center; }
    .upgrade-card h3 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 0.35rem; }
    .upgrade-card p { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; }
    .toast.show { opacity: 1; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; }
    .modal h3 { font-family: 'Syne', sans-serif; font-size: 18px; margin-bottom: 0.5rem; }
    .modal p { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }

    /* DANGER ZONE */
    .danger-zone { border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 1.25rem; margin-top: 1.25rem; }
    .danger-title { font-weight: 700; color: #ef4444; margin-bottom: 0.25rem; font-size: 13px; }
    .danger-sub { font-size: 12px; color: var(--muted); margin-bottom: 0.75rem; }

    @media (max-width: 768px) { .page { grid-template-columns: 1fr; } .sidebar { position: static; } .form-row { grid-template-columns: 1fr; } .ai-grid { grid-template-columns: repeat(2,1fr); } }
        .corp-alert-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 8, 20, 0.58);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1200;
        }
        .corp-alert-overlay.active {
            display: flex;
        }
        .corp-alert {
            width: min(360px, 88vw);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            padding: 1rem 1rem 0.9rem;
            text-align: center;
        }
        .corp-alert-icon {
            width: 42px;
            height: 42px;
            margin: 0 auto 0.45rem;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            background: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.38);
        }
        .corp-alert.error .corp-alert-icon {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.35);
        }
        .corp-alert.success .corp-alert-icon {
            background: rgba(16, 185, 129, 0.18);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.35);
        }
        .corp-alert-message {
            color: var(--text-primary);
            font-size: 0.92rem;
            line-height: 1.4;
            margin: 0 0 0.75rem;
            font-weight: 600;
        }
        .corp-alert-actions {
            display: flex;
            justify-content: center;
        }
        .corp-alert-ok {
            min-width: 96px;
            padding: 0.48rem 1.05rem;
            border-radius: 8px;
            border: none;
            background: #E8652A;
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem;
            background: var(--bg-darker);
            border: 2px solid var(--border-subtle);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-option:hover, .checkbox-option:hover {
            border-color: var(--accent-orange);
        }

        .radio-option.selected {
            border-color: var(--accent-orange);
            background: rgba(249, 115, 22, 0.05);
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-subtle);
            border-radius: 50%;
            position: relative;
            transition: all 0.3s ease;
        }

        .radio-option.selected .radio-circle {
            border-color: var(--accent-orange);
        }

        .radio-option.selected .radio-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--accent-orange);
            border-radius: 50%;
        }

        .checkbox-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-subtle);
            border-radius: 4px;
            position: relative;
            transition: all 0.3s ease;
        }

        .checkbox-option.checked {
            border-color: var(--accent-orange);
        }

        .checkbox-option.checked .checkbox-box {
            background: var(--accent-cyan);
            border-color: var(--accent-orange);
        }

        .checkbox-option.checked .checkbox-box::after {
            content: '\2713';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Prompt Settings modal density polish */
        #promptSettingsModal .modal-header {
            margin-bottom: 1.15rem;
        }
        #promptSettingsModal .setting-group + .setting-group {
            margin-top: 1.15rem;
        }
        #promptSettingsModal .setting-group h4 {
            margin: 0 0 0.55rem 0;
            font-size: 1rem;
            letter-spacing: 0.2px;
        }
        #promptSettingsModal .radio-group,
        #promptSettingsModal .checkbox-group {
            gap: 0.58rem;
        }
        #promptSettingsModal .radio-option,
        #promptSettingsModal .checkbox-option {
            padding: 0.78rem 0.85rem;
        }
        #promptSettingsModal .radio-option strong,
        #promptSettingsModal .checkbox-option strong {
            font-size: 0.92rem;
        }
        #promptSettingsModal .setting-desc {
            font-size: 0.79rem;
            color: var(--text-muted);
            line-height: 1.25;
            margin-top: 1px;
        }
        #promptSettingsModal .setting-helper {
            color: var(--text-secondary);
            margin-bottom: 0.7rem;
            font-size: 0.82rem;
        }
        #promptSettingsModal .setting-note {
            color: var(--text-secondary);
            margin-top: 0.7rem;
            font-size: 0.76rem;
            line-height: 1.3;
        }

        @media (max-width: 1024px) {
            .library-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .library-stats {
                grid-template-columns: 1fr;
            }

            .library-controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .filter-group {
                flex-wrap: wrap;
            }

            .prompt-actions {
                flex-direction: column;
            }
        }

        /* Softer upgrade button */
        .btn-upgrade {
            background: transparent;
            color: var(--accent-orange);
            border: 1px solid rgba(249, 115, 22, 0.3);
            font-size: 0.78rem;
            opacity: 0.85;
        }
        .btn-upgrade:hover {
            background: rgba(249, 115, 22, 0.08);
            opacity: 1;
        }

        /* Command Center */
        .command-center {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.06), rgba(0, 212, 255, 0.04));
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1rem 1.25rem;
            margin-bottom: 0;
        }
        .command-center-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .command-center-items {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .command-center-item {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Dashboard footer */
        .dashboard-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--border-subtle);
            background: rgba(6, 10, 20, 0.5);
            margin-top: 1rem;
        }

        /* Section hierarchy: secondary sections are softer */
        #accountSettingsSection,
        #notificationsSection {
            background: rgba(26, 35, 50, 0.6);
            border-color: rgba(255, 255, 255, 0.04);
        }

            if (normalized === 'NOT_CONNECTED' || normalizedState === 'not_connected') {

            if (normalized === 'BLOCKED' || normalizedState === 'blocked') {

        async function finalizeProviderConnection(providerId, attempts = 4, delayMs = 450) {
            const id = String(providerId || '').toLowerCase();
            if (!id) return false;
            let connected = false;
            for (let attempt = 0; attempt < attempts; attempt++) {
                let connectionResult = null;
                if (window.electronAPI?.checkProviderConnection) {
                    // eslint-disable-next-line no-await-in-loop
                    connectionResult = await window.electronAPI.checkProviderConnection(id);
                } else if (window.electronAPI?.checkProviderAuthV2) {
                    // eslint-disable-next-line no-await-in-loop
                    connectionResult = await window.electronAPI.checkProviderAuthV2(id);
                }
                const stateNow = String(connectionResult?.state || '').toLowerCase();
                const resultNow = String(connectionResult?.result || '').toUpperCase();
                connected = stateNow === 'connected' || resultNow === 'AUTHENTICATED';
                if (connected) break;
                if (attempt < attempts - 1) {
                    // eslint-disable-next-line no-await-in-loop
                    await new Promise((resolve) => setTimeout(resolve, delayMs));
                }
            }
            if (window.electronAPI?.closeProviderSignInV2) {
                await window.electronAPI.closeProviderSignInV2().catch(() => {});
            }
            await refreshConnectedAccounts();

            const refreshed = providerConnectionMap.get(id);
            const mapState = String(refreshed?.state || '').toLowerCase();
            const mapStatus = String(refreshed?.status || '').toUpperCase();
            return connected || mapState === 'connected' || mapStatus === 'CONNECTED';
        }

        function getSectionTopWithHeaderOffset(section, extraOffset = 14) {
            if (!section) return null;
            const headerHeight = Math.max(0, document.querySelector('.profile-header')?.offsetHeight || 0);
            const absoluteTop = window.scrollY + section.getBoundingClientRect().top;
            return Math.max(0, absoluteTop - headerHeight - extraOffset);
        }
        function getSectionTopAlignedToSidebar(section) {
            if (!section) return null;
            const sidebar = document.querySelector('.profile-sidebar');
            if (!sidebar) return getSectionTopWithHeaderOffset(section);
            const sectionRect = section.getBoundingClientRect();
            const sidebarRect = sidebar.getBoundingClientRect();
            const absoluteTop = window.scrollY + sectionRect.top;
            const target = absoluteTop - sidebarRect.top;
            return Math.max(0, target);

function scrollToSection(sectionId) {

                            showNotification('Avatar saved!');

                            showNotification('Failed to save avatar: ' + (r.data?.error || 'Unknown error'));

                        showNotification('Failed to save avatar.');
                    }

                reader.readAsDataURL(file);

                        promptId: promptId,
                        updates: { isFavorite: newFavoriteStatus }
                    });
                    if (result.success) {
                        prompt.isFavorite = newFavoriteStatus;
                        displayPromptLibrary();
                    }
                }
            } catch (error) {
                console.error('Error toggling favorite:', error);
            }
        }
        async function deletePrompt(promptId) {
            if (!confirm('Are you sure you want to delete this prompt? This action cannot be undone.')) {
                return;
            }
            try {
                if (window.electronAPI && window.electronAPI.deletePrompt) {
                    const result = await window.electronAPI.deletePrompt(promptId);
                    if (result.success) {
                        promptLibraryData.prompts = promptLibraryData.prompts.filter(p => p.id !== promptId);
                        displayPromptLibrary();
                    }
                }
            } catch (error) {
                console.error('Error deleting prompt:', error);
            }
        }
        function copyPrompt(promptId) {
            const prompt = promptLibraryData.prompts.find(p => p.id === promptId);
            if (prompt && navigator.clipboard) {
                navigator.clipboard.writeText(prompt.text).then(() => {
                    showCorporateAlert('Prompt copied to clipboard!', 'success');
                });
            }
        }
        async function getWorkspaceModeForProfile() {
            if (window.electronAPI && window.electronAPI.getWorkspaceConfig) {
                try {
                    const config = await window.electronAPI.getWorkspaceConfig();
                    if (config && config.mode) {
                        return config.mode;
                    }
                    if (config && Array.isArray(config.panes)) {
                        return config.panes.length === 1 ? 'quick' : 'compare';
                    }
                } catch (error) {
                    console.warn('⚠️ [Prompt Library] Could not determine workspace mode:', error);
                }
            }
            return 'quick';
        }
        async function dispatchPromptToWorkspace(promptText) {
            const normalizedPrompt = (promptText || '').trim();
            if (!normalizedPrompt) {
                return { success: false, error: 'Prompt text is empty' };
            }
            const workspaceMode = await getWorkspaceModeForProfile();
            const isQuickChatMode = workspaceMode === 'quick';
            let result = null;
            console.log(`📚 [Prompt Library] Dispatching prompt to ${isQuickChatMode ? 'Quick Chat' : 'Multi-Pane'} workspace`);
            try {
                if (isQuickChatMode && window.electronAPI && window.electronAPI.loadPromptQuickChat) {
                    result = await window.electronAPI.loadPromptQuickChat(normalizedPrompt);
                } else if (!isQuickChatMode) {
                    if (window.electronAPI && window.electronAPI.sendPromptToAll) {
                        result = await window.electronAPI.sendPromptToAll(normalizedPrompt);
                    } else if (window.electronAPI && window.electronAPI.loadPromptMultiPane) {
                        result = await window.electronAPI.loadPromptMultiPane(normalizedPrompt);
                    }
                }
                if ((!result || !result.success) && window.electronAPI && window.electronAPI.loadPromptIntoWorkspace) {
                    console.log('📚 [Prompt Library] Falling back to loadPromptIntoWorkspace');
                    result = await window.electronAPI.loadPromptIntoWorkspace(normalizedPrompt);
                }
                return result || { success: false, error: 'No prompt handler executed' };
            } catch (error) {
                console.error('❌ [Prompt Library] Error dispatching prompt:', error);
                if (window.electronAPI && window.electronAPI.loadPromptIntoWorkspace) {
                    return await window.electronAPI.loadPromptIntoWorkspace(normalizedPrompt);
                }
                return { success: false, error: error.message };
            }
        }
        async function usePromptAgain(promptId) {
            const prompt = promptLibraryData.prompts.find(p => p.id === promptId);
            if (!prompt) return;
            const text = prompt.text || prompt.prompt || '';
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center';
            overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
            const box = document.createElement('div');
            box.style.cssText = 'background:var(--bg-card,#111118);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:90%;max-width:400px;text-align:center';
            const preview = text.slice(0,80) + (text.length>80?'...':'');
            // Get last synthesis for this prompt if available
            const lastSynth = prompt.lastSynthesis || prompt.synthesis || null;
            box.innerHTML = '<div style="font-weight:700;font-size:15px;margin-bottom:8px;color:#f4f4fa">Use this prompt in:</div>' +
                '<div style="font-size:13px;color:#9494aa;margin-bottom:20px;word-break:break-word">' + preview + '</div>' +
                '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:8px">' +
                '<button id="ppPerspBtn" style="padding:10px 16px;border-radius:10px;background:#E8652A;color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;flex:1">Perspectives</button>' +
                '<button id="ppForgeBtn" style="padding:10px 16px;border-radius:10px;background:rgba(249,115,22,0.15);border:1px solid #E8652A;color:#E8652A;font-weight:700;font-size:13px;cursor:pointer;flex:1">Sweep</button>' +
                '</div>' +
                '<button id="ppContextBtn" style="padding:10px;width:100%;border-radius:10px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);color:#818cf8;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:8px">&#9655; Continue with context</button>' +
                '<button id="ppCancelBtn" style="padding:8px;width:100%;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.1);color:#9494aa;cursor:pointer;font-size:13px">Cancel</button>';
            overlay.appendChild(box); document.body.appendChild(overlay);
            box.querySelector('#ppPerspBtn').onclick = () => { overlay.remove(); window.location.href = '/perspectives.html?prompt=' + encodeURIComponent(text); };
            box.querySelector('#ppForgeBtn').onclick = () => { overlay.remove(); window.location.href = '/broadcast.html?prompt=' + encodeURIComponent(text); };
            box.querySelector('#ppCancelBtn').onclick = () => overlay.remove();
            box.querySelector('#ppContextBtn').onclick = () => {
                overlay.remove();
                // Build context-aware prompt
                const synthText = lastSynth ? lastSynth : '';
                if (synthText) {
                    const contextPrompt = 'Previous analysis:\n' + synthText.slice(0, 800) + '\n\nFollow-up question: ' + text;
                    window.location.href = '/perspectives.html?prompt=' + encodeURIComponent(contextPrompt) + '&context=1';
                } else {
                    // No synthesis available - show follow-up input
                    const followUp = window.prompt('Previous synthesis not found. Enter your follow-up question:');
                    if (followUp) {
                        const contextPrompt = 'Original question: ' + text + '\n\nFollow-up: ' + followUp;
                        window.location.href = '/perspectives.html?prompt=' + encodeURIComponent(contextPrompt) + '&context=1';
                    }
                }
            };
        }
        function openPromptSettings() {
            document.getElementById('promptSettingsModal').classList.add('active');
            loadPromptSettings();
        }
        function closePromptSettings() {
            document.getElementById('promptSettingsModal').classList.remove('active');
        }
        function loadPromptSettings() {
            const settings = promptLibraryData.settings || { enabled: true, autoDeleteDays: 60, notifications: {} };
            // Set enabled toggle (default to true if not set)
            const enabled = settings.enabled !== false; // Default to true
            document.getElementById('promptLibraryEnabled').classList.toggle('checked', enabled);
            // Set auto-delete radio
            document.querySelectorAll('.radio-option').forEach(option => {
                option.classList.remove('selected');
                const days = parseInt(option.dataset.days || '0');
                if ((settings.autoDeleteDays === 0 && days === 9999) || 
                    (settings.autoDeleteDays > 0 && days === settings.autoDeleteDays)) {
                    option.classList.add('selected');
                }
            });
            // Set notification checkboxes
            const notifications = settings.notifications || {};
            document.getElementById('notifEmailBeforeDelete').classList.toggle('checked', notifications.emailBeforeDelete !== false);
            document.getElementById('notifBannerBeforeDelete').classList.toggle('checked', notifications.bannerBeforeDelete !== false);
            document.getElementById('notifWeeklySummary').classList.toggle('checked', notifications.weeklySummary === true);
        }
        async function savePromptSettings() {
            try {
                const enabled = document.getElementById('promptLibraryEnabled').classList.contains('checked');
                const selectedDays = document.querySelector('.radio-option.selected')?.dataset.days || '60';
                const autoDeleteDays = selectedDays === '9999' ? 0 : parseInt(selectedDays);
                const notifications = {
                    emailBeforeDelete: document.getElementById('notifEmailBeforeDelete').classList.contains('checked'),
                    bannerBeforeDelete: document.getElementById('notifBannerBeforeDelete').classList.contains('checked'),
                    weeklySummary: document.getElementById('notifWeeklySummary').classList.contains('checked')
                };
                const settings = { enabled, autoDeleteDays, notifications };
                if (window.electronAPI && window.electronAPI.savePromptSettings) {
                    const result = await window.electronAPI.savePromptSettings(settings);
                    if (result.success) {
                        promptLibraryData.settings = settings;
                        showCorporateAlert('Settings saved successfully!', 'success');
                        closePromptSettings();

                        const promptLibrarySection = document.getElementById('promptLibrarySection');

        // Load profile on page load
        function initProfilePage() {
            updateProfileHeaderHeight();
            // Defensive cleanup on entry: never keep old provider auth overlays over Profile.
            if (window.electronAPI?.closeProviderSignInV2) {
                window.electronAPI.closeProviderSignInV2().catch(() => {});
            }
            const applyProfileConnectPayload = async (payload) => {
                const providerId = String(payload?.providerId || '').toLowerCase();
                if (!providerId || !AI_TOOLS[providerId]) return;
                const mode = String(payload?.mode || 'connect');
                const reason = String(payload?.reason || '');
                const payloadKey = `${providerId}:${mode}:${reason}`;
                const now = Date.now();
                if (
                    lastAppliedProfileConnectPayload.key === payloadKey &&
                    (now - Number(lastAppliedProfileConnectPayload.at || 0)) < 1500
                ) {
                    return;
                }
                lastAppliedProfileConnectPayload = { key: payloadKey, at: now };
                providerConnectState = {
                    providerId,
                    mode,
                    reason
                };
                shouldRefocusConnectedAccountsOnWindowFocus = false;
                if (window.electronAPI?.closeProviderSignInV2) {
                    await window.electronAPI.closeProviderSignInV2().catch(() => {});
                }
                openProviderConnectModal(providerId, providerConnectState.mode, providerConnectState.reason);
                focusConnectedAccountsSection(true);
            };
            if (!profileConnectRequestListenerBound && window.electronAPI?.on) {
                profileConnectRequestListenerBound = true;
                window.electronAPI.on('profile-connect-request', async (payload) => {
                    await applyProfileConnectPayload(payload);
                });
            }
            if (window.electronAPI?.getPendingProfileConnectRequest) {
                window.electronAPI.getPendingProfileConnectRequest()
                    .then(async (result) => {
                        if (result?.success && result?.payload) {
                            await applyProfileConnectPayload(result.payload);
                        }
                    })
                    .catch(() => {});
            }
            if (window.electronAPI?.onProviderConnectionUpdated && !unsubscribeProviderConnectionUpdates) {
                unsubscribeProviderConnectionUpdates = window.electronAPI.onProviderConnectionUpdated((payload) => {
                    const providerId = String(payload?.providerId || '').toLowerCase();
                    if (!providerId) return;
                    providerConnectionMap.set(providerId, {
                        providerId,
                        status: String(payload?.status || 'UNKNOWN').toUpperCase(),
                        state: String(payload?.state || '').toLowerCase(),
                        lastCheckedAt: Number(payload?.lastCheckedAt || 0) || null,
                        lastSeenUrl: String(payload?.lastSeenUrl || ''),
                        lastErrorReason: payload?.lastErrorReason || null
                    });
                    displayConnectedAccounts();
                });
            }
            if (window.electronAPI?.runProviderConnectionSweep) {
                window.electronAPI.runProviderConnectionSweep([], 'profile_mount').catch(() => {});
            }
            loadProfile();
        }
        async function refocusConnectedAccountsOnReturn() {
            if (!shouldRefocusConnectedAccountsOnWindowFocus) return;
            const providerId = String(providerConnectState?.providerId || '').toLowerCase();
            let connectedOnReturn = false;
            if (providerId && window.electronAPI?.checkProviderConnection) {
                try {
                    const result = await window.electronAPI.checkProviderConnection(providerId);
                    const stateNow = String(result?.state || '').toLowerCase();
                    const authNow = String(result?.result || '').toUpperCase();
                    connectedOnReturn = stateNow === 'connected' || authNow === 'AUTHENTICATED';
                } catch (_) {
                    // keep manual Done fallback when checks fail
                }
            }
            await refreshConnectedAccounts();
            focusConnectedAccountsSection(true);
            // Re-apply after async section/layout updates settle.
            setTimeout(() => focusConnectedAccountsSection(true), 220);
            setTimeout(() => focusConnectedAccountsSection(true), 700);
            const instruction = document.getElementById('providerConnectInstruction');
            if (connectedOnReturn) {
                closeProviderConnectModal({ skipFinalize: true });
                showCorporateAlert('Connection confirmed.', 'success');
            } else if (instruction) {
                instruction.innerHTML = '<li>You are back on Profile</li><li>Click "Done" to refresh and confirm this connection</li><li>If already connected, this window will close automatically</li>';
            }
            shouldRefocusConnectedAccountsOnWindowFocus = false;
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initProfilePage);
        } else {
            initProfilePage();
        }
        // Consistent modal dismissal behavior for profile popups.
        document.addEventListener('click', (event) => {
            const overlay = event.target.closest('.modal-overlay');
            if (!overlay || event.target !== overlay) return;
            const id = overlay.id;
            if (id === 'providerConnectModal') closeProviderConnectModal();
            if (id === 'promptSettingsModal') closePromptSettings();
            if (id === 'changePasswordModal') closeChangePasswordModal();
            if (id === 'twoFactorModal') closeTwoFactorModal();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            const corpAlert = document.getElementById('corpAlertOverlay');
            if (corpAlert?.classList.contains('active')) {
                closeCorporateAlert();
                return;
            }
            if (document.getElementById('providerConnectModal')?.classList.contains('active')) closeProviderConnectModal();
            if (document.getElementById('promptSettingsModal')?.classList.contains('active')) closePromptSettings();
            if (document.getElementById('changePasswordModal')?.classList.contains('active')) closeChangePasswordModal();
            if (document.getElementById('twoFactorModal')?.classList.contains('active')) closeTwoFactorModal();
        });
        window.addEventListener('resize', updateProfileHeaderHeight);
        window.addEventListener('focus', refocusConnectedAccountsOnReturn);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                refocusConnectedAccountsOnReturn();
            }
        });
        window.addEventListener('beforeunload', () => {
            if (typeof unsubscribeProviderConnectionUpdates === 'function') {
                try { unsubscribeProviderConnectionUpdates(); } catch (_) {}
                unsubscribeProviderConnectionUpdates = null;
            }
        });

  <script src="https://forge.projectcoachai.com/js/forge-api.js"></script>
  <script>
    Forge.requireAuth('/signin.html');

    function scrollToSection(id) {
      var el = document.getElementById(id);
      if (el) {
        var top = el.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
      document.querySelectorAll('.sidebar-nav-item').forEach(function(el) { el.classList.remove('active'); });
      event.currentTarget.classList.add('active');
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function loadProfile() {
      var user = Forge.getUser();
      if (!user) return;

      document.getElementById('sidebarName').textContent = user.name || 'Your Name';
      document.getElementById('sidebarEmail').textContent = user.email || '';
      var initials = (user.name || user.email || 'S').split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase() || 'S';
      var avatarEl = document.getElementById('sidebarAvatar');
      if (user.picture || user.avatar) {
        var img = document.createElement('img');
        img.src = user.picture || user.avatar;
        img.alt = initials;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
        img.onerror = function() { avatarEl.textContent = initials; };
        avatarEl.innerHTML = '';
        avatarEl.appendChild(img);
      } else {
        avatarEl.textContent = initials;
      }

      var tier = user.tier || 'starter';
      var isPro = tier && tier !== 'starter' && tier !== 'free' && tier !== '';
      document.getElementById('sidebarPlan').textContent = isPro ? 'Pro' : 'Free';
      document.getElementById('sidebarPlan').className = 'plan-badge ' + (isPro ? 'pro' : 'free');
      document.getElementById('planName').textContent = isPro ? 'Sweep Pro' : 'Sweep Free';
      document.getElementById('planBadge').textContent = isPro ? 'Pro' : 'Free';
      document.getElementById('planBadge').className = 'plan-badge ' + (isPro ? 'pro' : 'free');
      if (isPro) document.getElementById('upgradeCard').style.display = 'none';

      if (user.createdAt) {
        var d = new Date(user.createdAt);
        document.getElementById('memberSince').textContent = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      }

      document.getElementById('settingsEmail').value = user.email || '';
      document.getElementById('settingsName').value = user.name || '';

      // Usage — fetch from API
      try {
        var usageR = await Forge.request('GET', '/api/auth/usage');
        if (usageR && usageR.ok) {
          var ud = usageR.data.usage || usageR.data;
          var used = ud.used !== undefined ? ud.used : 0;
          var limit = isPro ? '∞' : '5';
          var pct = isPro ? 0 : Math.min(100, Math.round(used / 5 * 100));
          document.getElementById('usageBar').style.width = pct + '%';
          document.getElementById('usageCount').textContent = used + ' / ' + limit + ' sweeps';
        }
      } catch(_) {
        var limit = isPro ? '∞' : '5';
        document.getElementById('usageCount').textContent = '— / ' + limit + ' sweeps';
      }
    }

    async function saveAccountSettings() {
      var name = document.getElementById('settingsName').value.trim();
      if (!name) { showToast('Please enter a display name.'); return; }
      try {
        var r = await Forge.request('PATCH', '/api/auth/me', { name });
        if (r.ok) {
          var user = Forge.getUser();
          user.name = name;
          Forge.setUser(user);
          document.getElementById('sidebarName').textContent = name;
          showToast('Settings saved.');
        } else {
          showToast(r.data?.error || 'Failed to save.');
        }
      } catch(_) { showToast('Something went wrong.'); }
    }

    function openPasswordModal() { document.getElementById('passwordModal').classList.add('open'); }
    function closePasswordModal() { document.getElementById('passwordModal').classList.remove('open'); }
    function openDeleteModal() { document.getElementById('deleteModal').classList.add('open'); }
    function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('open'); }

    async function handleChangePassword() {
      var current = document.getElementById('currentPassword').value;
      var newPw = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;
      if (!current || !newPw || !confirm) { showToast('Please fill in all fields.'); return; }
      if (newPw !== confirm) { showToast('Passwords do not match.'); return; }
      if (newPw.length < 8) { showToast('Password must be at least 8 characters.'); return; }
      try {
        var r = await Forge.request('POST', '/api/auth/password-change', { currentPassword: current, newPassword: newPw });
        if (r.ok) { closePasswordModal(); showToast('Password updated.'); }
        else showToast(r.data?.error || 'Failed to change password.');
      } catch(_) { showToast('Something went wrong.'); }
    }

    async function handleDeleteAccount() {
      if (document.getElementById('deleteConfirm').value.trim() !== 'DELETE') { showToast('Type DELETE to confirm.'); return; }
      try {
        var r = await Forge.request('DELETE', '/api/auth/me');
        if (r.ok) { Forge.auth.signout(); }
        else showToast(r.data?.error || 'Failed to delete account.');
      } catch(_) { showToast('Something went wrong.'); }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closePasswordModal(); closeDeleteModal(); closePromptModal(); }
    });

    // Sign out
    async function handleSignOut() {
      if (!confirm('Are you sure you want to sign out?')) return;
      await Forge.auth.signout();
      window.location.href = '/signin.html';
    }

    // Prompt Library — Forge implementation
async function loadPromptLibrary() {
            try {
                console.log('📝 [Profile] Loading prompt library...');
                if (false) {
                    const result = await window.electronAPI.getPrompts();
                    console.log('📝 [Profile] getPrompts result:', result);
                    if (result.success) {
                        promptLibraryData.prompts = result.prompts || [];
                        promptLibraryData.settings = result.settings || { enabled: true, autoDeleteDays: 60, notifications: {} };
                        // Ensure enabled defaults to true if not set
                        if (promptLibraryData.settings.enabled === undefined) {
                            promptLibraryData.settings.enabled = true;
                        }
                        console.log('📝 [Profile] Loaded', promptLibraryData.prompts.length, 'prompts');
                        console.log('📝 [Profile] Prompt Library enabled:', promptLibraryData.settings.enabled);
                        displayPromptLibrary();
                    } else {
                        console.error('❌ [Profile] Failed to load prompts:', result.error);
                        showCorporateAlert('Failed to load prompt library: ' + (result.error || 'Unknown error'), 'error');
                    }
                } else {
                    // Web fallback — use Forge API
                    console.log('📝 [Profile] Using web API for prompts...');
                    try {
                        const r = await Forge.request('GET', '/api/prompts?limit=200');
                        if (r.ok && r.data) {
                            promptLibraryData.prompts = r.data.prompts || r.data || [];
                            promptLibraryData.settings = { enabled: true, autoDeleteDays: 60, notifications: {} };
                            console.log('📝 [Profile] Loaded', promptLibraryData.prompts.length, 'prompts via web API');
                            displayPromptLibrary();
                        } else {
                            promptLibraryData.prompts = [];
                            displayPromptLibrary();
                        }
                    } catch(webErr) {
                        console.warn('📝 [Profile] Web API fallback failed:', webErr);
                        promptLibraryData.prompts = [];
                        displayPromptLibrary();
                    }
                }
            } catch (error) {
                console.error('❌ [Profile] Error loading prompt library:', error);
                showCorporateAlert('Error loading prompt library: ' + error.message, 'error');
            }
        }

        function filterPromptsList(prompts) {
            let filtered = [...prompts];

            // Apply search filter
            if (promptSearchQuery) {
                const query = promptSearchQuery.toLowerCase();
                filtered = filtered.filter(p => 
                    p.text.toLowerCase().includes(query) ||
                    (p.tags || []).some(tag => tag.toLowerCase().includes(query))
                );
            }

            // Apply type filter
            if (currentPromptFilter === 'favorites') {
                filtered = filtered.filter(p => p.isFavorite);
            } else if (currentPromptFilter === 'recent') {
                filtered = filtered.sort((a, b) => new Date(b.lastUsed || b.createdAt) - new Date(a.lastUsed || a.createdAt)).slice(0, 10);
            } else if (currentPromptFilter === 'week') {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                filtered = filtered.filter(p => new Date(p.createdAt) >= weekAgo);
            }

            // Sort by most recent
            return filtered.sort((a, b) => new Date(b.lastUsed || b.createdAt) - new Date(a.lastUsed || a.createdAt));
        }

        function renderPromptRow(prompt, index) {
            const createdDate = new Date(prompt.createdAt);
            const lastUsedDate = prompt.lastUsed ? new Date(prompt.lastUsed) : null;
            const daysSinceLastUse = lastUsedDate ? Math.floor((Date.now() - lastUsedDate.getTime()) / (1000 * 60 * 60 * 24)) : null;

            return `
                <div class="profile-prompt-row ${index >= 3 ? 'hidden-initially' : ''}">
                    <strong>${prompt.isFavorite ? '⭐ ' : ''}"${escapeHtml(prompt.text)}"</strong>
                    <div class="profile-prompt-meta">
                        <span>📊 Used ${prompt.usageCount || 1}x</span>
                        ${lastUsedDate ? `<span>🕐 ${daysSinceLastUse === 0 ? 'Today' : daysSinceLastUse === 1 ? '1d' : `${daysSinceLastUse}d`}</span>` : ''}
                        <span>📅 ${createdDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' })}</span>
                    </div>
                    <div class="profile-prompt-actions">
                        <button class="btn btn-primary" onclick="copyPrompt('${prompt.id}')">Copy</button>
                        <button class="btn btn-use" onclick="usePromptAgain('${prompt.id}')">Use</button>
                    </div>
                </div>
            `;
        }

        function renderPromptSection(section) {
            if (!section.prompts.length) return '';

            const rows = section.prompts.map((prompt, index) => renderPromptRow(prompt, index)).join('');
            const extraCount = Math.max(section.prompts.length - 3, 0);
            const showMoreButton = extraCount > 0
                ? `<button class="prompt-show-more" data-expanded="false" data-label-more="Show ${extraCount} more..." data-label-less="Show less" onclick="togglePromptShowMore(this)">⬇️ Show ${extraCount} more...</button>`
                : '';

            return `
                <div class="profile-prompt-category">
                    <div class="profile-category-header" onclick="togglePromptCategory(this)">
                        <div class="profile-category-title">
                            <span class="category-icon">${section.icon}</span>
                            <span>${section.title}</span>
                            <span class="profile-category-count">(${section.prompts.length} prompts)</span>
                        </div>
                        <span class="profile-category-toggle">▼</span>
                    </div>
                    <div class="profile-category-body">
                        ${rows}
                        ${showMoreButton}
                    </div>
                </div>
            `;
        }

        function renderPromptSections(prompts) {
            const favorites = prompts.filter(p => p.isFavorite);
            const others = prompts.filter(p => !p.isFavorite);
            const sections = [];

            if (favorites.length) {
                sections.push({ title: 'Favorites', icon: '⭐', prompts: favorites });
            }

            if (others.length) {
                sections.push({ title: 'Other prompts', icon: '📝', prompts: others });
            }

            return sections.map(renderPromptSection).join('');
        }

        function togglePromptCategory(header) {
            const body = header.nextElementSibling;
            if (!body) return;
            header.classList.toggle('collapsed');
            body.classList.toggle('collapsed');
        }

        function togglePromptShowMore(button) {
            const body = button.previousElementSibling;
            if (!body) return;
            const expanded = button.dataset.expanded === 'true';
            const hiddenRows = body.querySelectorAll('.profile-prompt-row.hidden-initially');
            if (expanded) {
                hiddenRows.forEach(row => row.classList.add('hidden-initially'));
                button.textContent = button.dataset.labelMore || '⬇️ Show more...';
                button.dataset.expanded = 'false';
            } else {
                hiddenRows.forEach(row => row.classList.remove('hidden-initially'));
                button.textContent = button.dataset.labelLess || '⬆️ Show less';
                button.dataset.expanded = 'true';
            }
        }

        function collapseAllPromptCategories() {
            document.querySelectorAll('.profile-category-header').forEach(header => {
                header.classList.add('collapsed');
                const body = header.nextElementSibling;
                if (body) body.classList.add('collapsed');
            });
        }

        function expandAllPromptCategories() {
            document.querySelectorAll('.profile-category-header').forEach(header => {
                header.classList.remove('collapsed');
                const body = header.nextElementSibling;
                if (body) body.classList.remove('collapsed');
            });
        }

        function handlePromptListAction(action) {
            if (action === 'collapse') {
                collapseAllPromptCategories();
                showNotification('Categories collapsed');
            } else if (action === 'expand') {
                expandAllPromptCategories();
                showNotification('Categories expanded');
            }
        }

        function displayPromptLibrary() {
            const prompts = promptLibraryData.prompts || [];
            const stats = calculatePromptStats(prompts);
            const enabled = promptLibraryData.settings.enabled !== false; // Default to true
            
            console.log('📝 [Profile] Displaying prompt library:', {
                totalPrompts: prompts.length,
                enabled: enabled,
                settings: promptLibraryData.settings
            });
            
            // Hide/show prompt library section based on enabled setting
            const promptLibrarySection = document.getElementById('promptLibrarySection');
            if (promptLibrarySection) {
                promptLibrarySection.style.display = enabled ? 'block' : 'none';
                console.log('📝 [Profile] Prompt Library section display:', enabled ? 'visible' : 'hidden');
            }
            
            // Don't display if disabled
            if (!enabled) {
                console.log('📝 [Profile] Prompt Library is disabled in settings');
                return;
            }
            
            // Update stats
            document.getElementById('promptTotalCount').textContent = stats.total;
            document.getElementById('promptFavoriteCount').textContent = stats.favorites;
            document.getElementById('promptThisMonthCount').textContent = stats.thisMonth;
            document.getElementById('promptAutoDeleteDays').textContent = 
                promptLibraryData.settings.autoDeleteDays > 0 
                    ? `${promptLibraryData.settings.autoDeleteDays}d` 
                    : 'Never';

            // Filter and display prompts
            const filteredPrompts = filterPromptsList(prompts);
            const promptsList = document.getElementById('promptsList');
            const emptyState = document.getElementById('promptsEmptyState');

            console.log('📝 [Profile] Filtered prompts:', filteredPrompts.length, 'out of', prompts.length);
            
            // Set view mode
            promptsList.setAttribute('data-view', currentPromptView);
            
            if (filteredPrompts.length === 0) {
                promptsList.innerHTML = '';
                emptyState.style.display = 'block';
                console.log('📝 [Profile] Showing empty state - no prompts to display');
            } else {
                emptyState.style.display = 'none';
                let html = '';
                if (currentPromptView === 'table') {
                    html = createPromptTable(filteredPrompts);
                } else if (currentPromptView === 'card') {
                    html = filteredPrompts.map(prompt => createPromptCard(prompt)).join('');
                } else {
                    html = renderPromptSections(filteredPrompts);
                }
                promptsList.innerHTML = html;
                console.log('📝 [Profile] Rendered', filteredPrompts.length, 'prompts in', currentPromptView, 'view');
            }
        }

        function calculatePromptStats(prompts) {
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            
            return {
                total: prompts.length,
                favorites: prompts.filter(p => p.isFavorite).length,
                thisMonth: prompts.filter(p => new Date(p.createdAt) >= monthStart).length
            };
        }

            const autoDeleteDate = prompt.autoDeleteDate ? new Date(prompt.autoDeleteDate) : null;
            const daysUntilDelete = autoDeleteDate && !prompt.isFavorite ? Math.ceil((autoDeleteDate - Date.now()) / (1000 * 60 * 60 * 24)) : null;

                                        <div class="dropdown-item" onclick="event.stopPropagation(); showCorporateAlert('Edit feature coming soon!')">✏️ Edit</div>
                                        <div class="dropdown-item" onclick="event.stopPropagation(); showCorporateAlert('Tag feature coming soon!')">🏷️ Add Tag</div>
                                        <div class="dropdown-item danger" onclick="event.stopPropagation(); deletePrompt('${prompt.id}')">🗑️ Delete</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${isExpanded ? `
                            <div style="width: 100%; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
                                ${!prompt.isFavorite && daysUntilDelete !== null && daysUntilDelete > 0 ? `
                                <div class="delete-warning" style="margin-bottom: 1rem;">
                                    <span>⚠️</span>
                                    <span><strong>Auto-deletes in ${daysUntilDelete} ${daysUntilDelete === 1 ? 'day' : 'days'}</strong> (Mark as favorite to save permanently)</span>
                                </div>
                                ` : ''}
                                ${tagsHtml ? `<div class="prompt-tags" style="margin-bottom: 1rem;">${tagsHtml}</div>` : ''}
                                ${aiUsageHtml ? `<div class="ai-usage" style="margin-bottom: 1rem;">${aiUsageHtml}</div>` : ''}
                                <div class="prompt-meta">
                                    <span class="meta-item">
                                        <span class="meta-icon">📊</span>
                                        <span>Used ${prompt.usageCount || 1}x</span>
                                    </span>
                                    ${lastUsedDate ? `
                                    <span class="meta-item">
                                        <span class="meta-icon">🕐</span>
                                        <span>Last used: ${daysSinceLastUse === 0 ? 'Today' : daysSinceLastUse === 1 ? '1 day ago' : `${daysSinceLastUse} days ago`}</span>
                                    </span>
                                    ` : ''}
                                    <span class="meta-item">
                                        <span class="meta-icon">📅</span>
                                        <span>Created: ${createdDate.toLocaleDateString()}</span>

                                </div>

                        ` : ''}
                    </div>
                `;
            }

            // Card view (original)
            return `
                <div class="prompt-card ${prompt.isFavorite ? 'favorite' : ''}" data-prompt-id="${prompt.id}">
                    <div class="prompt-header">
                        <span class="favorite-btn ${prompt.isFavorite ? '' : 'inactive'}" onclick="togglePromptFavorite('${prompt.id}')">⭐</span>
                        <div class="prompt-text">"${escapeHtml(prompt.text)}"</div>
                    </div>

                    <div class="prompt-meta">
                        <span class="meta-item">
                            <span class="meta-icon">📊</span>
                            <span>Used ${prompt.usageCount || 1}x</span>

                        ${lastUsedDate ? `
                        <span class="meta-item">
                            <span class="meta-icon">🕐</span>

                    <div class="delete-warning">

        function createPromptTable(prompts) {
            const aiIcons = {
                'chatgpt': '🤖',
                'claude': '🔮',
                'gemini': '✨',
                'perplexity': '🔍',
                'grok': '🚀',
                'mistral': '🎯'
            };

            let html = '<table class="prompt-table"><thead><tr><th class="favorite-cell">⭐</th><th>Prompt</th><th class="meta-cell">Used</th><th class="meta-cell">Last Used</th><th class="meta-cell">Created</th><th class="actions-cell">Actions</th></tr></thead><tbody>';
            
            prompts.forEach(prompt => {
                const createdDate = new Date(prompt.createdAt);
                const lastUsedDate = prompt.lastUsed ? new Date(prompt.lastUsed) : null;
                const daysSinceLastUse = lastUsedDate ? Math.floor((Date.now() - lastUsedDate.getTime()) / (1000 * 60 * 60 * 24)) : null;
                const promptText = escapeHtml(prompt.text);
                const truncatedText = promptText.length > 60 ? promptText.substring(0, 60) + '...' : promptText;
                
                html += `
                    <tr data-prompt-id="${prompt.id}">
                        <td class="favorite-cell">
                            <span class="favorite-btn ${prompt.isFavorite ? '' : 'inactive'}" onclick="togglePromptFavorite('${prompt.id}')" style="font-size: 1.2rem;">⭐</span>
                        </td>
                        <td class="text-cell" title="${promptText}">${truncatedText}</td>
                        <td class="meta-cell">${prompt.usageCount || 1}x</td>
                        <td class="meta-cell">${lastUsedDate ? (daysSinceLastUse === 0 ? 'Today' : daysSinceLastUse === 1 ? '1d ago' : `${daysSinceLastUse}d ago`) : 'Never'}</td>
                        <td class="meta-cell">${createdDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' })}</td>
                        <td class="actions-cell">
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <button class="btn btn-primary" onclick="copyPrompt('${prompt.id}')" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;">📋</button>
                                <button class="btn btn-use" onclick="usePromptAgain('${prompt.id}')" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;">▶️</button>
                                <div class="dropdown">
                                    <button class="dropdown-btn" onclick="toggleDropdown(event)" style="padding: 0.35rem 0.65rem; font-size: 0.9rem;">⋮</button>
                                    <div class="dropdown-menu" id="dropdown-${prompt.id}">
                                        ${!prompt.isFavorite ? `<div class="dropdown-item" onclick="togglePromptFavorite('${prompt.id}')">⭐ Add to Favorites</div>` : ''}
                                        <div class="dropdown-item" onclick="showCorporateAlert('Edit feature coming soon!')">✏️ Edit</div>
                                        <div class="dropdown-item" onclick="showCorporateAlert('Tag feature coming soon!')">🏷️ Add Tag</div>
                                        <div class="dropdown-item danger" onclick="deletePrompt('${prompt.id}')">🗑️ Delete</div>

                                </div>
                            </div>
                        </td>
