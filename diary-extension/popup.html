<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diary</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; width: 280px; min-height: 160px; padding: 0; }
    .header { background: #1B2A4A; padding: 14px 16px; display: flex; align-items: center; gap: 8px; }
    .logo { font-size: 16px; font-weight: 600; color: #F5F3EE; letter-spacing: -0.3px; }
    .logo span { color: #C17D3C; }
    .body { padding: 16px; }
    .state-signed-out { text-align: center; padding: 8px 0; }
    .state-signed-out p { font-size: 12px; color: #6B6559; margin-bottom: 12px; line-height: 1.6; }
    .btn { display: block; width: 100%; padding: 9px; border-radius: 6px; font-size: 13px; font-weight: 500; text-align: center; cursor: pointer; border: none; font-family: inherit; transition: background 0.2s; text-decoration: none; }
    .btn-primary { background: #1B2A4A; color: #F5F3EE; margin-bottom: 6px; }
    .btn-primary:hover { background: #243A63; }
    .btn-secondary { background: #fff; color: #1B2A4A; border: 0.5px solid #D6D2C8; }
    .btn-secondary:hover { border-color: #1B2A4A; }
    .state-signed-in { }
    .user-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .user-email { font-size: 12px; color: #6B6559; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
    .sign-out { font-size: 11px; color: #9E9890; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
    .sign-out:hover { color: #1B2A4A; }
    .divider { height: 0.5px; background: #D6D2C8; margin: 10px 0; }
    .tip { font-size: 11px; color: #9E9890; line-height: 1.6; text-align: center; margin-top: 10px; }
    .tip span { color: #C17D3C; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Diary<span>.</span></div>
  </div>
  <div class="body">
    <div id="signedOut" class="state-signed-out" style="display:none">
      <p>Sign in to save AI responses directly to your personal Diary.</p>
      <a href="https://diary.projectcoachai.com/signin.html" target="_blank" class="btn btn-primary">Sign In</a>
      <a href="https://diary.projectcoachai.com/signup.html" target="_blank" class="btn btn-secondary">Create Free Account</a>
    </div>
    <div id="signedIn" class="state-signed-in" style="display:none">
      <div class="user-row">
        <span class="user-email" id="userEmail"></span>
        <button class="sign-out" id="signOutBtn">Sign out</button>
      </div>
      <a href="https://diary.projectcoachai.com/app.html" target="_blank" class="btn btn-primary">&#128214; Open My Diary</a>
      <div class="divider"></div>
      <a href="https://diary.projectcoachai.com/chat.html" target="_blank" class="btn btn-secondary">&#9889; Chat with AI</a>
      <p class="tip">Look for the <span>Save to Diary</span> button on any AI page.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
