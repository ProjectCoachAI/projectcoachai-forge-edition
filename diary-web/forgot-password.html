<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #fff; border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #1B2A4A; text-align: center; margin-bottom: 0.5rem; }
    .logo span { color: #C17D3C; }
    h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { font-size: 13px; color: #6B6559; text-align: center; margin-bottom: 1.75rem; line-height: 1.5; }
    label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 4px; }
    input { width: 100%; border: 1px solid #D6D2C8; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; margin-bottom: 1rem; }
    input:focus { border-color: #C17D3C; }
    .btn { width: 100%; background: #1B2A4A; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; }
    .btn:hover { background: #243A63; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 1rem; display: none; }
    .success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 1rem; display: none; }
    .back { text-align: center; margin-top: 1.25rem; font-size: 13px; color: #6B6559; }
    .back a { color: #C17D3C; text-decoration: none; font-weight: 500; }
  </style>
  <script src="/js/forge-api.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">Diary<span>.</span></div>
    <h2>Reset your password</h2>
    <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <button class="btn" id="submitBtn" onclick="handleReset()">Send reset link</button>
    <div class="back"><a href="/signin.html">← Back to sign in</a></div>
  </div>
  <script>
    async function handleReset() {
      var email = document.getElementById('email').value.trim();
      var errEl = document.getElementById('errorMsg');
      var sucEl = document.getElementById('successMsg');
      var btn = document.getElementById('submitBtn');
      errEl.style.display = 'none';
      sucEl.style.display = 'none';
      if (!email) { errEl.textContent = 'Please enter your email address.'; errEl.style.display = 'block'; return; }
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        var r = await Forge.request('POST', '/api/auth/forgot-password', { email: email });
        if (r.ok) {
          sucEl.textContent = 'Check your inbox — we\'ve sent a reset link to ' + email;
          sucEl.style.display = 'block';
          btn.textContent = 'Email sent';
        } else {
          errEl.textContent = r.data?.error || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Send reset link';
        }
      } catch(e) {
        errEl.textContent = 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleReset();
    });
  </script>
</body>
</html>
