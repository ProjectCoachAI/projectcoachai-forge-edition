<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    .nav-wrap { border-bottom: 0.5px solid #D6D2C8; }
    .diary-nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 3rem; max-width: 1100px; margin: 0 auto; width: 100%; }
    .diary-logo { font-family: 'Lora', serif; font-size: 20px; font-weight: 500; color: #1B2A4A; letter-spacing: -0.3px; }
    .diary-logo span { color: #C17D3C; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 2rem; }
    .card { background: #fff; border: 0.5px solid #D6D2C8; border-radius: 10px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; text-align: center; }
    .card-title { font-family: 'Lora', serif; font-size: 26px; font-weight: 400; margin-bottom: 0.5rem; color: #1B2A4A; }
    .card-sub { font-size: 14px; color: #6B6559; margin-bottom: 2rem; }
    .form-group { text-align: left; margin-bottom: 1rem; }
    .form-group label { font-size: 13px; font-weight: 500; color: #1B2A4A; display: block; margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 10px 14px; border: 0.5px solid #D6D2C8; border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif; background: #F5F3EE; color: #1B2A4A; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #C17D3C; }
    .btn-primary { width: 100%; background: #1B2A4A; color: #F5F3EE; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 500; border: none; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; margin-top: 0.5rem; }
    .btn-primary:hover { background: #243A63; }
    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: #9E9890; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: #D6D2C8; }
    .btn-google { width: 100%; background: #fff; color: #1B2A4A; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 500; border: 0.5px solid #D6D2C8; cursor: pointer; font-family: 'Inter', sans-serif; transition: border-color 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-google:hover { border-color: #1B2A4A; }
    .toggle { font-size: 13px; color: #6B6559; margin-top: 1.5rem; }
    .toggle a { color: #C17D3C; font-weight: 500; }
    .error { background: #FEF2F2; border: 0.5px solid #FCA5A5; border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #B91C1C; margin-bottom: 1rem; display: none; }
    .terms-note { font-size: 11px; color: #9E9890; margin-top: 1rem; line-height: 1.6; }
    .terms-note a { color: #C17D3C; }
    .footer-wrap { border-top: 0.5px solid #D6D2C8; }
    .footer { padding: 1.5rem 3rem; display: flex; justify-content: center; gap: 2rem; max-width: 1100px; margin: 0 auto; }
    .footer-link { font-size: 13px; color: #9E9890; }
    .footer-link:hover { color: #1B2A4A; }
  </style>
</head>
<body>
  <div class="nav-wrap">
    <nav class="diary-nav">
      <a href="/" style="text-decoration:none"><div class="diary-logo">Diary<span>.</span></div></a>
    </nav>
  </div>
  <main class="main">
    <div class="card">
      <h1 class="card-title">Start your Diary</h1>
      <p class="card-sub">Free forever. No card required.</p>
      <div class="error" id="errorMsg"></div>
      <div class="form-group">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Daniel" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" />
      </div>
      <button class="btn-primary" onclick="handleSignUp()">Create Free Account</button>
      <div class="divider">or</div>
      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <p class="terms-note">By signing up you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p>
      <p class="toggle">Already have an account? <a href="/signin.html">Sign in</a></p>
    </div>
  </main>
  <div class="footer-wrap">
    <footer class="footer">
      <a href="/privacy.html" class="footer-link">Privacy</a>
      <a href="/terms.html" class="footer-link">Terms</a>
      <a href="/help.html" class="footer-link">Help</a>
    </footer>
  </div>
  <script src="https://cdn.projectcoachai.com/forge.js"></script>
  <script>
    async function handleSignUp() {
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var err = document.getElementById('errorMsg');
      err.style.display = 'none';
      if (!name || !email || !password) { err.textContent = 'Please fill in all fields.'; err.style.display = 'block'; return; }
      if (password.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
      try {
        var result = await Forge.auth.signup(email, password, { name: name });
        if (result) window.location.href = '/app.html';
        else { err.textContent = 'Could not create account. Please try again.'; err.style.display = 'block'; }
      } catch(e) { err.textContent = e.message || 'Something went wrong. Please try again.'; err.style.display = 'block'; }
    }
    async function handleGoogle() {
      try { await Forge.auth.signinWithGoogle(); window.location.href = '/app.html'; }
      catch(e) { var err = document.getElementById('errorMsg'); err.textContent = 'Google sign in failed.'; err.style.display = 'block'; }
    }
  </script>
</body>
</html>
