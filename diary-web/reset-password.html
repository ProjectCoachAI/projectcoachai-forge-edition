<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a new password — Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; overflow-x: hidden; }
    .card { background: #fff; border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #1B2A4A; text-align: center; margin-bottom: 0.5rem; }
    .logo span { color: #C17D3C; }
    h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { font-size: 13px; color: #6B6559; text-align: center; margin-bottom: 1.75rem; line-height: 1.5; }
    label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 4px; }
    input { width: 100%; border: 1px solid #D6D2C8; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; margin-bottom: 1rem; }
    input:focus { border-color: #C17D3C; }
    .btn { width: 100%; background: #1B2A4A; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; }
    .btn:hover { background: #243A63; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 1rem; display: none; }
    .success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 1rem; display: none; }
    .back { text-align: center; margin-top: 1.25rem; font-size: 13px; color: #6B6559; }
    .back a { color: #C17D3C; text-decoration: none; font-weight: 500; }
      .form-group { margin-bottom: 0; }
    .icon { font-size: 40px; text-align: center; margin-bottom: 0.75rem; }
    .cta { display: none; text-align: center; text-decoration: none; }
</style>
  <script src="/js/forge-api.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">Diary<span>.</span></div>
    <h2>Set a new password</h2>
    <p class="subtitle">Choose a new password for your Diary account.</p>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    <div class="form-group">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Repeat new password" autocomplete="new-password" />
    </div>
    <button class="btn" id="submitBtn">Set new password</button>
    <div class="back"><a href="/forgot-password.html">Need a new link?</a> · <a href="/signin.html">Back to sign in</a></div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var email = params.get('email') || '';
    var token = params.get('token') || '';
    var errEl = document.getElementById('errorMsg');
    var okEl = document.getElementById('successMsg');
    var btn = document.getElementById('submitBtn');
    var busy = false;
    function showErr(m) { errEl.textContent = m; errEl.style.display = 'block'; }
    if (!email || !token) { showErr('This reset link is not valid. Please request a new one.'); btn.disabled = true; }
    async function submit() {
      if (busy || btn.disabled) return;
      errEl.style.display = 'none';
      var pw = document.getElementById('password').value;
      var cf = document.getElementById('confirm').value;
      if (pw.length < 8) { showErr('Password must be at least 8 characters.'); return; }
      if (pw !== cf) { showErr('Passwords do not match.'); return; }
      busy = true; btn.disabled = true; btn.textContent = 'Saving...';
      try {
        var r = await Forge.auth.confirmPasswordReset(email, token, pw);
        if (r && r.ok) {
          okEl.textContent = 'Password updated. Taking you to sign in...';
          okEl.style.display = 'block';
          btn.textContent = 'Done';
          setTimeout(function () { window.location.href = '/signin.html'; }, 2000);
          return;
        }
        showErr((r && r.data && r.data.error) || 'Reset failed. Please request a new link.');
      } catch (e) { showErr('Something went wrong. Please try again.'); }
      busy = false; btn.disabled = false; btn.textContent = 'Set new password';
    }
    btn.addEventListener('click', submit);
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  </script>
</body>
</html>
