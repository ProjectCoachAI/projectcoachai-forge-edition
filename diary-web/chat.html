    .card-header { padding: 1.25rem 1.5rem; border-bottom: 0.5px solid #D6D2C8; display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; color: #1B2A4A; }
    .card-sub { font-size: 12px; color: #9E9890; margin-top: 2px; }

    /* Provider list */
    .provider-list { padding: 0.5rem 0; }
    .provider-row { display: flex; align-items: center; gap: 12px; padding: 12px 1.5rem; cursor: pointer; transition: background 0.15s; border-bottom: 0.5px solid #F5F3EE; }
    .provider-row:last-child { border-bottom: none; }
    .provider-row:hover { background: #FAFAF7; }
    .provider-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .provider-name { font-size: 14px; font-weight: 500; color: #1B2A4A; flex: 1; }
    .provider-status { font-size: 11px; color: #C17D3C; font-weight: 500; }

    /* Extension wall */
    .ext-wall { padding: 2rem 1.5rem; text-align: center; }
    .ext-wall-icon { font-size: 36px; margin-bottom: 1rem; display: block; }
    .ext-wall-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; color: #1B2A4A; margin-bottom: 0.5rem; }
    .ext-wall-sub { font-size: 13px; color: #6B6559; line-height: 1.7; margin-bottom: 1.5rem; max-width: 340px; margin-left: auto; margin-right: auto; }
    .btn-install { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; background: #1B2A4A; color: #F5F3EE; border-radius: 6px; font-size: 13px; font-weight: 500; transition: background 0.2s; }
    .btn-install:hover { background: #243A63; }
    .ext-note { font-size: 11px; color: #9E9890; margin-top: 0.75rem; }
    .ext-note a { color: #C17D3C; cursor: pointer; }

    .footer-wrap { border-top: 0.5px solid #D6D2C8; }
    .footer { padding: 1.25rem 2rem; display: flex; justify-content: center; gap: 2rem; max-width: 1100px; margin: 0 auto; }
    .footer-link { font-size: 12px; color: #9E9890; }
    .footer-link:hover { color: #1B2A4A; }

<body>

<div class="nav-wrap">
  <nav class="diary-nav">
    <a href="/index.html" style="text-decoration:none"><div class="diary-logo">Diary<span>.</span></div></a>
    <a href="/app.html" class="nav-back">&#8592; Back to Diary</a>
  </nav>
</div>

<main class="main">
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">&#9889; Chat with AI</div>
        <div class="card-sub">Choose an AI — your Diary extension handles the rest</div>
      </div>
    </div>
    <div id="qaContent">
      <div class="provider-list" id="qaList"></div>
    </div>
  </div>
</main>

<div class="footer-wrap">
  <footer class="footer">
    <a href="/privacy.html" class="footer-link">Privacy</a>
    <a href="/terms.html" class="footer-link">Terms</a>
    <a href="/help.html" class="footer-link">Help</a>
  </footer>
</div>

<script src="/js/forge-api.js"></script>
<script>
var DIARY_PROVIDERS = [
  { id: 'claude',      name: 'Claude',           color: '#C17D3C', url: 'https://claude.ai/new' },
  { id: 'chatgpt',    name: 'ChatGPT',          color: '#10A37F', url: 'https://chatgpt.com' },
  { id: 'gemini',     name: 'Gemini',           color: '#4A8EF4', url: 'https://gemini.google.com' },
  { id: 'perplexity', name: 'Perplexity',       color: '#20B2AA', url: 'https://www.perplexity.ai' },
  { id: 'grok',       name: 'Grok',             color: '#888',    url: 'https://grok.com' },
  { id: 'deepseek',   name: 'DeepSeek',         color: '#4169E1', url: 'https://chat.deepseek.com' },
  { id: 'mistral',    name: 'Mistral',          color: '#FF7000', url: 'https://chat.mistral.ai' },
  { id: 'meta',       name: 'Meta AI',          color: '#0668E1', url: 'https://www.meta.ai' },
];

var extensionActive = false;

function detectExtension() {
  return new Promise(function(resolve) {
    var EXT_IDS = [
      'momenmcgdmceejapigodolpekonmaedd',
      'onlaamgggkmmnpbkcllnhdpecaidfpml'
    ];
    if (typeof chrome === 'undefined' || !chrome.runtime) { resolve(false); return; }
    var found = false;
    var checked = 0;
    EXT_IDS.forEach(function(id) {
      try {
        chrome.runtime.sendMessage(id, { type: 'PING' }, function(r) {
          if (r && r.ok && !found) { found = true; extensionActive = true; resolve(true); }
          checked++;
          if (checked === EXT_IDS.length && !found) resolve(false);
        });
      } catch(_) { checked++; if (checked === EXT_IDS.length && !found) resolve(false); }
    });
    setTimeout(function() { if (!found) resolve(false); }, 1500);
  });
}

function renderProviders() {
  var el = document.getElementById('qaList');
  el.innerHTML = DIARY_PROVIDERS.map(function(p) {
    return '<div class="provider-row" onclick="goChat(\'' + p.id + '\')">' +
      '<div class="provider-dot" style="background:' + p.color + '"></div>' +
      '<span class="provider-name">' + p.name + '</span>' +
      '<span class="provider-status">&#9679; Ready</span>' +
    '</div>';
  }).join('');
}

function renderExtWall() {
  var ua = navigator.userAgent;
  var isEdge = /Edg\//.test(ua);
  var isOpera = /OPR\//.test(ua);
  var isSafari = /Safari/.test(ua) && !/Chrome/.test(ua);
  var isFirefox = /Firefox/.test(ua);
  var isMobile = /Android|iPhone|iPad|Mobile/i.test(ua);

  if (isMobile) { renderProviders(); return; }

  var btnText = isEdge ? 'Install for Edge — Free' : isOpera ? 'Install for Opera — Free' : 'Install Diary Extension — Free';
  var note = (isSafari || isFirefox)
    ? '<div class="ext-wall-sub">The Diary extension is available for Chrome, Edge, and Opera. For best experience, open in Chrome.</div><a href="https://www.google.com/chrome/" target="_blank" class="btn-install">Open in Chrome</a>'
    : '<a href="https://chromewebstore.google.com/detail/forge/onlaamgggkmmnpbkcllnhdpecaidfpml" target="_blank" class="btn-install">&#9889; ' + btnText + '</a>';

  document.getElementById('qaContent').innerHTML =
    '<div class="ext-wall">' +
    '<span class="ext-wall-icon">&#128214;</span>' +
    '<div class="ext-wall-title">Install the Diary extension first</div>' +
    '<div class="ext-wall-sub">The extension adds a Save to Diary button on every AI page and brings you back automatically.</div>' +
    note +
    '<div class="ext-note">Already installed? <a onclick="location.reload()">Refresh the page</a></div>' +
    '</div>';
}

function goChat(id) {
  var p = DIARY_PROVIDERS.find(function(x) { return x.id === id; });
  if (p) window.open(p.url, '_blank');
}

async function init() {
  if (typeof Forge === 'undefined') return;
  var user = await Forge.restoreSession();
  if (!user) { window.location.href = '/signin.html?return=/chat.html'; return; }
  // Always show providers — extension detection added after Web Store submission
  renderProviders();
}

init();
</script>
</body>
</html>
