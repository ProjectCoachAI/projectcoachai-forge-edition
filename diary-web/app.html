<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    .nav-wrap { border-bottom: 0.5px solid #D6D2C8; position: sticky; top: 0; background: #F5F3EE; z-index: 100; }
    .diary-nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; max-width: 1100px; margin: 0 auto; width: 100%; gap: 1rem; }
    .diary-logo { font-family: 'Lora', serif; font-size: 20px; font-weight: 500; color: #1B2A4A; letter-spacing: -0.3px; flex-shrink: 0; }
    .diary-logo span { color: #C17D3C; }
    .nav-search { flex: 1; max-width: 400px; position: relative; }
    .nav-search input { width: 100%; padding: 8px 14px 8px 36px; border: 0.5px solid #D6D2C8; border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif; background: #fff; color: #1B2A4A; outline: none; transition: border-color 0.2s; }
    .nav-search input:focus { border-color: #C17D3C; }
    .nav-search i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9E9890; font-size: 16px; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { font-size: 13px; color: #6B6559; }
    .btn-signout { font-size: 13px; color: #9E9890; background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; padding: 0; }
    .btn-signout:hover { color: #1B2A4A; }
    .btn-upgrade { font-size: 13px; background: #C17D3C; color: #fff; padding: 7px 16px; border-radius: 6px; font-weight: 500; transition: background 0.2s; }
    .btn-upgrade:hover { background: #A5682F; }
    .main { flex: 1; max-width: 1100px; margin: 0 auto; width: 100%; padding: 2.5rem 3rem; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .page-title { font-family: 'Lora', serif; font-size: 28px; font-weight: 400; color: #1B2A4A; }
    .page-count { font-size: 13px; color: #9E9890; margin-top: 2px; }
    .filters { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 0.5px solid #D6D2C8; background: #fff; color: #6B6559; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
    .filter-btn:hover, .filter-btn.active { background: #1B2A4A; color: #F5F3EE; border-color: #1B2A4A; }
    .entries { display: flex; flex-direction: column; gap: 1px; border: 0.5px solid #D6D2C8; border-radius: 10px; overflow: hidden; background: #D6D2C8; }
    .entry { background: #fff; padding: 1.25rem 1.5rem; cursor: pointer; transition: background 0.15s; }
    .entry:hover { background: #FAFAF7; }
    .entry-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.4rem; }
    .entry-title { font-family: 'Lora', serif; font-size: 16px; font-weight: 500; color: #1B2A4A; line-height: 1.4; flex: 1; }
    .entry-date { font-size: 11px; color: #9E9890; flex-shrink: 0; margin-top: 3px; }
    .entry-preview { font-size: 13px; color: #6B6559; line-height: 1.6; margin-bottom: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .entry-meta { display: flex; align-items: center; gap: 8px; }
    .entry-source { font-size: 11px; padding: 2px 10px; border-radius: 20px; border: 0.5px solid #D6D2C8; color: #6B6559; background: #F5F3EE; text-transform: capitalize; }
    .entry-actions { display: flex; gap: 6px; margin-left: auto; opacity: 0; transition: opacity 0.15s; }
    .entry:hover .entry-actions { opacity: 1; }
    .entry-btn { font-size: 11px; padding: 4px 10px; border-radius: 5px; border: 0.5px solid #D6D2C8; background: #fff; color: #6B6559; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
    .entry-btn:hover { border-color: #1B2A4A; color: #1B2A4A; }
    .entry-btn.primary { background: #1B2A4A; color: #fff; border-color: #1B2A4A; }
    .entry-btn.primary:hover { background: #243A63; }
    .empty { text-align: center; padding: 5rem 2rem; color: #9E9890; }
    .empty-icon { font-size: 40px; margin-bottom: 1rem; display: block; }
    .empty h3 { font-family: 'Lora', serif; font-size: 20px; font-weight: 400; color: #1B2A4A; margin-bottom: 0.5rem; }
    .empty p { font-size: 14px; line-height: 1.7; max-width: 360px; margin: 0 auto 1.5rem; }
    .loading { text-align: center; padding: 4rem; color: #9E9890; font-size: 14px; }
    .forge-upsell { background: #1B2A4A; color: #F5F3EE; border-radius: 10px; padding: 1.5rem 2rem; margin-top: 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .upsell-text { font-size: 14px; line-height: 1.6; }
    .upsell-text strong { font-family: 'Lora', serif; font-size: 16px; display: block; margin-bottom: 0.25rem; }
    .upsell-text span { color: #B8C4D8; }
    .btn-upsell { background: #C17D3C; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background 0.2s; flex-shrink: 0; }
    .btn-upsell:hover { background: #A5682F; }
    .footer-wrap { border-top: 0.5px solid #D6D2C8; margin-top: auto; }
    .footer { padding: 1.5rem 3rem; display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; }
    .footer-brand { font-family: 'Lora', serif; font-size: 13px; color: #9E9890; }
    .footer-links { display: flex; gap: 1.75rem; }
    .footer-link { font-size: 13px; color: #9E9890; }
    .footer-link:hover { color: #1B2A4A; }
    /* Entry view panel */
    .entry-panel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 680px; height: 100vh; background: #fff; border-left: 0.5px solid #D6D2C8; z-index: 200; display: flex; flex-direction: column; transition: right 0.3s cubic-bezier(.4,0,.2,1); box-shadow: -8px 0 32px rgba(0,0,0,0.08); }
    .entry-panel.open { right: 0; }
    .entry-panel-overlay { position: fixed; inset: 0; background: rgba(27,42,74,0.2); z-index: 199; display: none; }
    .entry-panel-overlay.open { display: block; }
    .entry-panel-header { padding: 1.25rem 1.5rem; border-bottom: 0.5px solid #D6D2C8; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
    .entry-panel-back { background: none; border: none; cursor: pointer; font-size: 20px; color: #9E9890; padding: 0; line-height: 1; transition: color 0.15s; }
    .entry-panel-back:hover { color: #1B2A4A; }
    .entry-panel-source { font-size: 11px; padding: 2px 10px; border-radius: 20px; border: 0.5px solid #D6D2C8; color: #6B6559; background: #F5F3EE; }
    .entry-panel-date { font-size: 11px; color: #9E9890; margin-left: auto; }
    .entry-panel-body { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .entry-panel-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; color: #1B2A4A; margin-bottom: 1rem; line-height: 1.4; }
    .entry-panel-content { font-size: 15px; color: #4A4035; line-height: 1.8; white-space: pre-wrap; }
    .entry-panel-actions { padding: 1rem 1.5rem; border-top: 0.5px solid #D6D2C8; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
    .share-btn { font-size: 12px; padding: 7px 14px; border-radius: 6px; border: 0.5px solid #D6D2C8; background: #fff; color: #6B6559; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
    .share-btn:hover { border-color: #1B2A4A; color: #1B2A4A; }
    .share-btn.primary { background: #1B2A4A; color: #fff; border-color: #1B2A4A; }
    .share-btn.primary:hover { background: #243A63; }
    .share-btn.amber { background: #C17D3C; color: #fff; border-color: #C17D3C; }
    .share-btn.amber:hover { background: #A5682F; }
    @media (max-width: 640px) {
      .diary-nav { padding: 1rem 1.25rem; }
      .main { padding: 1.5rem 1.25rem; }
      .forge-upsell { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="nav-wrap">
    <nav class="diary-nav">
      <a href="/" style="text-decoration:none"><div class="diary-logo">Diary<span>.</span></div></a>
      <div class="nav-search">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="Search your diary..." oninput="handleSearch(this.value)" />
      </div>
      <div class="nav-right">
        <span class="nav-user" id="navUser"></span>
        <a href="https://forge.projectcoachai.com" class="btn-upgrade">Try Forge →</a>
        <button class="btn-signout" onclick="handleSignOut()">Sign out</button>
      </div>
    </nav>
  </div>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Your Diary</h1>
        <p class="page-count" id="entryCount">Loading...</p>
      </div>
    </div>

    <div class="filters" id="filters">
      <button class="filter-btn active" onclick="filterBy('all', this)">All</button>
      <button class="filter-btn" onclick="filterBy('claude', this)">Claude</button>
      <button class="filter-btn" onclick="filterBy('chatgpt', this)">ChatGPT</button>
      <button class="filter-btn" onclick="filterBy('gemini', this)">Gemini</button>
      <button class="filter-btn" onclick="filterBy('perplexity', this)">Perplexity</button>
      <button class="filter-btn" onclick="filterBy('sweep', this)">Sweep</button>
      <button class="filter-btn" onclick="filterBy('quick_answer', this)">Quick Answer</button>
    </div>

    <div id="entriesContainer"><div class="loading">Loading your diary...</div></div>

    <div class="forge-upsell">
      <div class="upsell-text">
        <strong>Want more from your AI responses?</strong>
        <span>Compare 8 AIs simultaneously, get a synthesised best answer, and go deeper — all in one session.</span>
      </div>
      <a href="https://forge.projectcoachai.com" class="btn-upsell">Try Forge Free →</a>
    </div>
  </main>

  <div class="footer-wrap">
    <footer class="footer">
      <span class="footer-brand">Diary — by Forge</span>
      <div class="footer-links">
        <a href="/privacy.html" class="footer-link">Privacy</a>
        <a href="/terms.html" class="footer-link">Terms</a>
        <a href="/help.html" class="footer-link">Help</a>
      </div>
    </footer>
  </div>

  <!-- Entry view panel -->
  <div class="entry-panel-overlay" id="entryOverlay" onclick="closeEntry()"></div>
  <div class="entry-panel" id="entryPanel">
    <div class="entry-panel-header">
      <button class="entry-panel-back" onclick="closeEntry()">&#8592;</button>
      <span class="entry-panel-source" id="panelSource"></span>
      <span class="entry-panel-date" id="panelDate"></span>
    </div>
    <div class="entry-panel-body">
      <div class="entry-panel-title" id="panelTitle"></div>
      <div class="entry-panel-content" id="panelContent"></div>
    </div>
    <div class="entry-panel-actions">
      <button class="share-btn" onclick="panelCopy()">&#128203; Copy</button>
      <button class="share-btn" onclick="panelWhatsApp()">&#128172; WhatsApp</button>
      <button class="share-btn" onclick="panelEmail()">&#9993; Email</button>
      <button class="share-btn" onclick="panelPrint()">&#128424; Print</button>
      <button class="share-btn amber" id="panelAskMore" onclick="panelAskMoreFn()">Ask more &#8594;</button>
    </div>
  </div>

  <script src="/js/forge-api.js"></script>
  <script>
    var allEntries = [];
    var filteredEntries = [];
    var currentFilter = 'all';
    var searchQuery = '';

    var SOURCE_LABELS = {
      claude: 'Claude', chatgpt: 'ChatGPT', gemini: 'Gemini', mistral: 'Mistral',
      deepseek: 'DeepSeek', perplexity: 'Perplexity', grok: 'Grok', meta: 'Meta AI',
      sweep: 'Sweep', quick_answer: 'Quick Answer', excel: 'Excel', documents: 'Documents'
    };

    function formatDate(ts) {
      var d = new Date(ts);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderEntries() {
      var container = document.getElementById('entriesContainer');
      var count = document.getElementById('entryCount');
      if (!filteredEntries.length) {
        container.innerHTML = '<div class="empty"><span class="empty-icon">📭</span><h3>' +
          (searchQuery ? 'No results found' : 'Your diary is empty') + '</h3><p>' +
          (searchQuery ? 'Try a different search term.' : 'Save any AI response using the Diary extension and it will appear here.') +
          '</p></div>';
        count.textContent = '';
        return;
      }
      count.textContent = filteredEntries.length + ' ' + (filteredEntries.length === 1 ? 'entry' : 'entries');
      container.innerHTML = '<div class="entries">' + filteredEntries.slice(0, 50).map(function(e) {
        var title = e.title || (e.prompt ? e.prompt.slice(0, 80) : 'Untitled entry');
        var preview = (e.content || '').replace(/<[^>]+>/g, '').slice(0, 160);
        var source = SOURCE_LABELS[e.source] || e.source || 'Unknown';
        return '<div class="entry" onclick="openEntry(' + e.id + ')">' +
          '<div class="entry-header">' +
            '<div class="entry-title">' + escHtml(title) + '</div>' +
            '<div class="entry-date">' + formatDate(e.created_at || e.timestamp || Date.now()) + '</div>' +
          '</div>' +
          '<div class="entry-preview">' + escHtml(preview) + '</div>' +
          '<div class="entry-meta">' +
            '<span class="entry-source">' + escHtml(source) + '</span>' +
            '<div class="entry-actions">' +
              '<button class="entry-btn" onclick="copyEntry(' + e.id + ')">Copy</button>' +
              '<button class="entry-btn primary" onclick="askMore(' + e.id + ')">Ask more →</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function filterBy(source, btn) {
      currentFilter = source;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      applyFilters();
    }

    function handleSearch(q) {
      searchQuery = q.toLowerCase();
      applyFilters();
    }

    function applyFilters() {
      filteredEntries = allEntries.filter(function(e) {
        var matchSource = currentFilter === 'all' || e.source === currentFilter;
        var matchSearch = !searchQuery || (e.title || '').toLowerCase().includes(searchQuery) ||
          (e.prompt || '').toLowerCase().includes(searchQuery) ||
          (e.content || '').toLowerCase().includes(searchQuery);
        return matchSource && matchSearch;
      });
      renderEntries();
    }

    function copyEntry(id) {
      var e = allEntries.find(function(x) { return x.id === id; });
      if (e) navigator.clipboard?.writeText(e.content || '');
    }

    function askMore(id) {
      var e = allEntries.find(function(x) { return x.id === id; });
      if (!e) return;
      try { localStorage.setItem('forge_diary_context', JSON.stringify({ prompt: e.prompt, content: e.content, title: e.title, source: e.source })); } catch(_) {}
      var src = (e.source || '').toLowerCase();
      var PROVIDER_URLS = { claude: 'https://claude.ai/new', chatgpt: 'https://chatgpt.com', gemini: 'https://gemini.google.com', perplexity: 'https://www.perplexity.ai', mistral: 'https://chat.mistral.ai', deepseek: 'https://chat.deepseek.com', grok: 'https://grok.com', meta: 'https://www.meta.ai' };
      if (PROVIDER_URLS[src]) window.location.href = PROVIDER_URLS[src];
      else window.location.href = 'https://forge.projectcoachai.com/perspectives.html?from=diary';
    }

    function handleSignOut() {
      Forge.auth.signout(); window.location.href = '/signin.html';
    }

    var currentPanelEntry = null;

    function openEntry(id) {
      var e = allEntries.find(function(x) { return x.id === id; });
      if (!e) return;
      currentPanelEntry = e;
      var title = e.title || (e.prompt ? e.prompt.slice(0, 80) : 'Untitled entry');
      document.getElementById('panelTitle').textContent = title;
      document.getElementById('panelContent').textContent = e.content || '';
      document.getElementById('panelSource').textContent = SOURCE_LABELS[e.source] || e.source || 'Unknown';
      document.getElementById('panelDate').textContent = formatDate(e.created_at || e.timestamp || Date.now());
      document.getElementById('entryPanel').classList.add('open');
      document.getElementById('entryOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeEntry() {
      document.getElementById('entryPanel').classList.remove('open');
      document.getElementById('entryOverlay').classList.remove('open');
      document.body.style.overflow = '';
      currentPanelEntry = null;
    }

    function panelCopy() {
      if (currentPanelEntry) navigator.clipboard?.writeText(currentPanelEntry.content || '');
    }

    function panelWhatsApp() {
      if (!currentPanelEntry) return;
      var text = (currentPanelEntry.title || '') + '

' + (currentPanelEntry.content || '').slice(0, 1000);
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }

    function panelEmail() {
      if (!currentPanelEntry) return;
      var subject = encodeURIComponent(currentPanelEntry.title || 'From my Diary');
      var body = encodeURIComponent((currentPanelEntry.content || '').slice(0, 2000));
      window.location.href = 'mailto:?subject=' + subject + '&body=' + body;
    }

    function panelPrint() {
      if (!currentPanelEntry) return;
      var w = window.open('', '_blank');
      w.document.write('<html><head><title>' + (currentPanelEntry.title || 'Diary Entry') + '</title></head><body style="font-family:Georgia,serif;max-width:700px;margin:2rem auto;line-height:1.8;color:#1B2A4A"><h1 style="font-size:24px;margin-bottom:1rem">' + (currentPanelEntry.title || '') + '</h1><pre style="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px">' + (currentPanelEntry.content || '') + '</pre></body></html>');
      w.document.close();
      w.print();
    }

    function panelAskMoreFn() {
      if (!currentPanelEntry) return;
      askMore(currentPanelEntry.id);
    }

    // Close panel on Escape key
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeEntry(); });

    async function init() {
      if (typeof Forge === 'undefined') return;
      var user = await Forge.restoreSession();
      if (!user) { window.location.href = '/signin.html'; return; }
      document.getElementById('navUser').textContent = user.email || '';
      try {
        var token = Forge.getToken();
        var res = await fetch('https://api.projectcoachai.com/api/diary?limit=200', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await res.json();
        allEntries = data.entries || [];
        filteredEntries = allEntries;
        renderEntries();
      } catch(e) {
        document.getElementById('entriesContainer').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><h3>Could not load diary</h3><p>Please refresh the page.</p></div>';
      }
    }

    init();
  </script>
</body>
</html>
