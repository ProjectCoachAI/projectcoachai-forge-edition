  var text = customMessage
    ? customMessage
    : 'Monthly free entries used (' + used + '/' + limit + '). ';
  el.innerHTML = '<div class="chat-limit-banner">' + text + ' ' +
    '<a href="https://forge.projectcoachai.com/pricing.html">Upgrade to Forge</a> for unlimited continues.</div>';
}

async function sendChatMessage() {
  if (chatIsSending) return;
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  // Confirmed as a real, direct bug: this previously required non-empty
  // typed text unconditionally, even when a file was genuinely attached
  // — someone attaching a .txt/image/PDF with no additional typed
  // message at all (a completely reasonable thing to do — "here's my
  // document, take a look") would click Send and see nothing happen,
  // with no error at all, since this returned silently before ever
  // reaching the attachment logic further down.
  if (!text && !chatAttachedFiles.length) return;
  if (!Forge.isAuthenticated()) { window.location.href = '/signin.html?return=/continue.html'; return; }

  // Captured BEFORE chatHistory is mutated below, deliberately — this is
  // exactly "how many messages existed natively at the moment of
  // forking," which must exclude the very message about to be pushed
  // (the first-ever Forge-side message). Confirmed directly: capturing
  // this any later — even right after the push, let alone at
  // linkChatSessionToDiaryEntry()'s own call site further down, after
  // the assistant's response has ALSO been pushed — would incorrectly
  // count that first Forge exchange as part of the native seed.
  var nativeSeedCountAtForkTime = chatHistory.length;

  // Captured and cleared here, deliberately BEFORE the request is even
  // sent — a slow or failed response shouldn't leave stale attachments
  // attached to whatever the user types next by accident.
  var filesForThisSend = chatAttachedFiles.slice();
  clearChatImageAttachment();

  input.value = '';
  autoResizeChatInput(input);

  // .txt files need no special AI-provider content block at all, unlike
  // images/PDFs — their own text is just appended directly into the
  // actual message sent to the AI, wrapped with a clear delimiter so the
  // model can distinguish the user's own typed message from an
  // attached file's own content. Computed BEFORE chatHistory.push()
  // below, deliberately — pushing the original, un-appended `text`
  // there would mean the attached file's own content is only ever sent
  // once and never actually persisted in the conversation's own
  // history, silently losing it for every message after this one.
  var txtFilesForThisSend = filesForThisSend.filter(function(f) { return f.type === 'txt'; });
  var messageToSend = text;
  txtFilesForThisSend.forEach(function(f) {
    messageToSend += '\n\n--- Attached file: ' + f.filename + ' ---\n' + f.textContent;
  });
  // Backend rejects a genuinely empty message outright (separate check
  // there, not just this page's own guard above) — .txt attachments
  // already make messageToSend non-empty via the append above, but an
  // image/PDF sent completely alone (no typed text, no .txt file) would
  // still leave it blank at this point, so a plain default fills that
  // gap rather than leaving the send to fail one step further down.
  if (!messageToSend.trim() && filesForThisSend.length) {
    messageToSend = 'Please take a look at the attached file' + (filesForThisSend.length > 1 ? 's' : '') + '.';
  }
  // Trims any leading whitespace left over specifically when text was
  // empty and a .txt file's own content was appended directly onto it
  // above (e.g. "\n\n--- Attached file...") — cosmetic only, but a
  // clean send is worth the one extra call.
  messageToSend = messageToSend.trim();
  var nonTxtFilesForThisSend = filesForThisSend.filter(function(f) { return f.type !== 'txt'; });

  // Images get a visual preview; PDFs get a clickable chip (opening the
  // reader modal); .txt files get a plain, non-clickable chip — their
  // own content is already folded into messageToSend above (so it's
  // excluded from the image-preview path, which would have incorrectly
  // tried to render a .txt file's own raw text content as an <img>
  // src), but the chip itself still needs to show SOMETHING was
  // attached, since that content never appears in this displayed
  // bubble at all (see the un-appended `text` used below).
  var imagePreviewsForBubble = filesForThisSend.filter(function(f) { return f.type !== 'pdf' && f.type !== 'txt'; }).map(function(f) { return f.base64; });
  var pdfsForBubble = filesForThisSend.filter(function(f) { return f.type === 'pdf'; }).map(function(f) { return { url: f.base64, filename: f.filename }; });
  var txtsForBubble = filesForThisSend.filter(function(f) { return f.type === 'txt'; }).map(function(f) { return { filename: f.filename }; });
  // The DISPLAYED bubble still shows the user's own original, un-appended
  // text — genuinely showing the raw ~2000-word contents of an attached
  // .txt file inline in the chat would be unreadable clutter; the file
  // itself is already visible via the (now-cleared) pre-send preview
  // chip. Only the actual API payload and persisted history need the
  // full, appended text.
  var lastUserMessageEl = addMessageToDOM('user', text, Object.assign(
    imagePreviewsForBubble.length ? { imagePreviewURLs: imagePreviewsForBubble } : {},
    txtsForBubble.length ? { txtAttachments: txtsForBubble } : {},
    pdfsForBubble.length ? { pdfAttachments: pdfsForBubble } : {}
  ));
  chatHistory.push({ role: 'user', content: messageToSend });

  chatIsSending = true;
  document.getElementById('chatSendBtn').disabled = true;
  addMessageToDOM('assistant', '', { loading: true, id: 'chatLoading' });

  var wasFirstMessage = !chatSessionId;

  try {
    const base = (Forge.API_BASE || 'https://api.projectcoachai.com');
    const resp = await fetch(base + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
        'Authorization': 'Bearer ' + (Forge.getToken ? Forge.getToken() : '')
      },
      body: JSON.stringify({
        sessionId: chatSessionId,
        model: chatModel,
        message: messageToSend,
        history: chatHistory.slice(0, -1),
        source: 'diary',
        diaryEntryId: chatDiaryEntryId,
        attachments: nonTxtFilesForThisSend.length ? nonTxtFilesForThisSend.map(function(f) { return { base64: f.base64, mimeType: f.mimeType, type: f.type }; }) : undefined
      })
    });

    if (resp.status === 429) {
      const errData = await resp.json().catch(() => ({}));
      document.getElementById('chatLoading')?.remove();
      // Restore the typed text and remove the now-stale user bubble —
      // chatHistory.pop() below already removes this message from
      // state, but without this the DOM bubble stayed visible,
      // misleadingly implying the message had sent when it hadn't, and
      // the text itself was permanently lost from the input box,
      // forcing a full retype to retry (or to copy elsewhere, e.g. a
      // different, non-capped entry, per this error's own suggestion).
      lastUserMessageEl?.remove();
      input.value = text;
      autoResizeChatInput(input);
      // Two distinct 429 reasons, per the two-axis gating design — shown
      // differently since they mean genuinely different things to the
      // user: one says "this specific conversation is done growing,
      // try a different entry," the other says "you're out of entries
      // to continue this month at all."
      if (errData.reason === 'message_cap') {
        showLimitBanner(null, null, errData.error);
      } else {
        showLimitBanner(errData.entriesUsed, errData.entryLimit);
      }
      chatHistory.pop();
      Forge.showToast(errData.error || 'Limit reached.', 'error');
      return;
    }
    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error || ('Request failed (' + resp.status + ')'));
    }

    const contentType = resp.headers.get('content-type') || '';
    var assistantContent = '';
    var sid = null;
    var bridged = false;
    var bridgedFromSessionId = null;
    var seededMessages = null;

    if (contentType.includes('text/event-stream')) {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));
            if (event.type === 'message') { assistantContent = event.content; sid = event.sessionId; bridged = event.bridged; bridgedFromSessionId = event.bridgedFromSessionId; seededMessages = event.seededMessages; }
            if (event.type === 'error') throw new Error(event.error);
          } catch (e) { if (e.message) throw e; }
        }
      }
    } else {
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Chat failed');
      assistantContent = data.content;
      sid = data.sessionId;
      bridged = data.bridged;
      bridgedFromSessionId = data.bridgedFromSessionId;
      seededMessages = data.seededMessages;
    }

    document.getElementById('chatLoading')?.remove();
    // Bridge marker — shown BEFORE the assistant's own response, at the
    // point where the actual bridge happened, same "honest, visible
    // seam" principle as the existing fork-marker divider elsewhere in
    // this app (see app.html's own "Continued in Forge" divider) —
    // reusing that precedent rather than inventing a new pattern, per
    // the explicit design guidance this was built against.
    if (bridged) {
      var bridgeMarkerEl = document.createElement('div');
      bridgeMarkerEl.style.cssText = 'display:flex;align-items:center;gap:10px;margin:20px 0 14px;';
      bridgeMarkerEl.innerHTML = '<div style="flex:1;height:1px;background:#E8DCC8;"></div>' +
        '<span style="font-size:11px;color:#9E9890;white-space:nowrap;">&#128279; Conversation continued automatically — it grew too long to keep going, so relevant earlier context was carried forward into a new, linked conversation</span>' +
        '<div style="flex:1;height:1px;background:#E8DCC8;"></div>';
      document.getElementById('chatMessages').appendChild(bridgeMarkerEl);
    }
    addMessageToDOM('assistant', assistantContent);
    if (bridged && Array.isArray(seededMessages)) {
      // chatHistory itself must be reset here, not just appended to —
      // otherwise the NEXT message send would still slice() the old,
      // massive pre-bridge history as `history` in the request body,
      // re-triggering the same oversized check (and a wasteful,
      // redundant re-embed) on every subsequent message instead of
      // just once. seededMessages already includes this exchange's own
      // assistant response (it's `messages` server-side, captured after
      // that push), so this replaces the usual, separate
      // chatHistory.push() below entirely rather than running both.
      chatHistory = seededMessages;
    } else {
      chatHistory.push({ role: 'assistant', content: assistantContent });
    }
    if (sid) {
      chatSessionId = sid;
      linkChatSessionToDiaryEntry(sid, wasFirstMessage, nativeSeedCountAtForkTime);
    }
  } catch (err) {
    document.getElementById('chatLoading')?.remove();
    // Same restoration as the 429 case above, plus removing this
    // message from chatHistory too (missing here previously, unlike
    // the 429 path) — otherwise a failed send left the message stuck
    // in chatHistory permanently, risking a duplicate if the user
    // retyped and resent the same text.
    lastUserMessageEl?.remove();
    input.value = text;
    autoResizeChatInput(input);
    chatHistory.pop();
    // Confirmed as a real, direct bug: the icon was previously
    // concatenated INTO the content string itself, which then went
    // through renderWithBubbles() -> Forge.renderMarkdown() — a markdown
    // renderer correctly escapes raw HTML tags as a safety measure
    // (it shouldn't trust arbitrary HTML from AI-generated text), so the
    // <svg> markup itself was being shown as literal, escaped text
    // rather than rendered. Fixed by keeping the icon entirely separate
    // from the markdown-processed text — inserted directly into the
    // resulting message body afterward, bypassing that escaping path.
    var errorMsgEl = addMessageToDOM('assistant', err.message || 'Something went wrong.');
    var errorBodyEl = errorMsgEl && errorMsgEl.querySelector('.chat-msg-body');
    if (errorBodyEl) {
      errorBodyEl.insertAdjacentHTML('afterbegin', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>');
    }
    Forge.showToast(err.message || 'Chat request failed.', 'error');
  } finally {
    chatIsSending = false;
    document.getElementById('chatSendBtn').disabled = false;
    input.focus();
  }
}
window.sendChatMessage = sendChatMessage;

// ── Init — entry point is a plain query param, not sessionStorage ──────────
// Deliberately NOT the sessionStorage handoff Forge's own chat.html
// uses: confirmed directly that diary.projectcoachai.com and
// forge.projectcoachai.com are genuinely separate origins (server.js's
// own CORS config), so sessionStorage set on one could never be read on
// the other at all. Since Diary's own UI already knows the entry's id
// directly (no navigation between separate origins involved at all),
// a query param is the simplest, most direct mechanism — nothing to
// hand off, just something to read from this page's own URL.
(function init() {
  if (!Forge.isAuthenticated()) {
    window.location.href = '/signin.html?return=/continue.html';
    return;
  }

  var params = new URLSearchParams(window.location.search);
  chatDiaryEntryId = params.get('entryId');

  if (!chatDiaryEntryId) {
    document.getElementById('chatEmpty').innerHTML =
      '<h2>Continue in Forge</h2><p>Open this from a Diary entry to continue that conversation.</p>';
    document.getElementById('modelBadgeText').textContent = 'No entry selected';
    return;
  }

  // "Back to Diary" previously always landed on the plain, top-of-list
  // view, with no way for app.html to know which entry the user was
  // just working with — carrying entryId through fixes this, paired
  // with app.html's own deep-link handling of the same param.
  var backLink = document.getElementById('chatBackLink');
  if (backLink) backLink.href = '/app.html?entryId=' + chatDiaryEntryId;

  // NOTE: entry.content is NOT a single, isolated assistant response —
  // it's the entire, multi-turn conversation thread, with every
  // question after the first marked by an invisible U+2063 marker
  // around bolded text (diary-extension's own boldQuestion(), consumed
  // by app.html's renderWithBubbles() for its own bubble styling).
  // Confirmed directly against app.html's own parsing before writing
  // this — same marker regex, but building a real {role,content}
  // message list here instead of HTML, since that's what this page's
  // chat-style UI (and chatHistory sent to /api/chat) actually needs.
  // Skipping this and treating entry.content as one assistant blob
  // (the original, wrong version of this function) meant every
  // embedded question, its invisible markers, and the true model
  // response all rendered as one undifferentiated message — losing
  // per-turn bubbles/labels and confusing renderMarkdown with content
  // it was never meant to parse as a single unit.
  function splitEntryIntoMessages(entry) {
    var messages = [];
    var text = entry.content || '';

    var sourcesText = '';
    var sourcesMatch = text.match(/\n\n---\n\n\*\*Sources:\*\*\n([\s\S]*)$/);
    if (sourcesMatch) {
      sourcesText = text.slice(sourcesMatch.index);
      text = text.slice(0, sourcesMatch.index);
    }

    var TITLE_MARK = '\u2063';
    var markerRe = new RegExp(TITLE_MARK + '\\*\\*([^*]+)\\*\\*' + TITLE_MARK, 'g');
    var lastIndex = 0;
    var m;
    while ((m = markerRe.exec(text)) !== null) {
      var before = text.slice(lastIndex, m.index).replace(/^\n+|\n+$/g, '');
      if (before) messages.push({ role: 'assistant', content: before });
      messages.push({ role: 'user', content: m[1] });
      lastIndex = markerRe.lastIndex;
    }
    var rest = text.slice(lastIndex).replace(/^\n+/, '');
    if (rest) messages.push({ role: 'assistant', content: rest });

    // The FIRST question is stored twice on the extension's own side —
    // once as entry.prompt, and, for at least Claude, ALSO wrapped in
    // the exact same U+2063 marker at the very start of entry.content
    // itself (confirmed directly: diary-content.js's own comment says
    // entry.prompt is extracted by finding the first such marked span
    // in the same seed text that becomes entry.content). Prepending
    // entry.prompt unconditionally, as the original version of this
    // function did, double-counted that first question whenever it was
    // already present as entry.content's own first marker match — which
    // is exactly the reported "title shown twice" bug. Detecting this
    // directly from the parsed result (rather than hardcoding "Claude
    // always does this") stays correct even if a provider's own content
    // never embeds the first question in entry.content at all — in
    // that case messages[0] won't already be the user's first turn, so
    // prepending is still exactly right.
    var firstQuestionAlreadyCaptured = messages.length > 0 && messages[0].role === 'user' &&
      entry.prompt && messages[0].content.trim() === entry.prompt.trim();
    if (entry.prompt && !firstQuestionAlreadyCaptured) {
      messages.unshift({ role: 'user', content: entry.prompt });
    }

    if (sourcesText && messages.length && messages[messages.length - 1].role === 'assistant') {
      messages[messages.length - 1].content += sourcesText;
    } else if (sourcesText) {
      messages.push({ role: 'assistant', content: sourcesText.replace(/^\n+/, '') });
    }

    return messages;
  }

  // ── "Load earlier messages" pagination for long threads ────────────────
  // Deliberately NOT literal page-1/2/3 pagination — a chat thread isn't
  // a document or list, and every real chat interface (Slack, WhatsApp,
  // ChatGPT itself) already uses this same pattern instead: show the
  // most recent messages by default, load older ones on demand as the
  // user actually asks for them. Matches what people already expect
  // here, rather than introducing an unfamiliar mental model to solve
  // what's really a rendering-performance problem (a long native seed —
  // confirmed live today at 44 messages deep — rendering everything
  // into the DOM at once).
  //
  // chatHistory itself ALWAYS holds the full conversation regardless of
  // what's rendered — the model needs complete context to respond
  // correctly even if the user hasn't scrolled up to see older
  // messages. This is purely a DOM/rendering concern, never a logical
  // one.
  var INITIAL_VISIBLE_MESSAGE_COUNT = 20;
  var LOAD_EARLIER_BATCH_SIZE = 20;
  var allLoadedMessages = [];
  var messagesRenderedFromIndex = 0;

  function renderMessagesWithPagination(messages) {
    allLoadedMessages = messages.slice();
    messages.forEach(function(msg) { chatHistory.push(msg); });

    var total = messages.length;
    var startIndex = Math.max(0, total - INITIAL_VISIBLE_MESSAGE_COUNT);
    messagesRenderedFromIndex = startIndex;

    if (startIndex > 0) renderLoadEarlierButton();
    for (var i = startIndex; i < total; i++) {
      var msgImageUrls = (allLoadedMessages[i].attachmentUrls || []).filter(function(a) { return a.type !== 'pdf'; }).map(function(a) { return a.url; });
      var msgPdfs = (allLoadedMessages[i].attachmentUrls || []).filter(function(a) { return a.type === 'pdf'; }).map(function(a) { return { url: a.url, filename: a.filename || 'document.pdf' }; });
      addMessageToDOM(allLoadedMessages[i].role, allLoadedMessages[i].content, Object.assign(
        msgImageUrls.length ? { imagePreviewURLs: msgImageUrls } : {},
        msgPdfs.length ? { pdfAttachments: msgPdfs } : {}
      ));
    }
  }

  // ── Search within this conversation ──────────────────────────────────
  // Direct port of the same, already-working feature in app.html
  // (runEntrySearch() etc.) — same TreeWalker-based highlight/navigate
  // mechanism, adapted for this page's single, ongoing conversation
  // rather than per-entry parameterization (no entry `id` needed here,
  // since there's only ever one conversation on this page at a time).
  //
  // Confirmed BEFORE writing this, not discovered as a bug afterward:
  // this page paginates its messages the exact same way app.html's own
  // entry content did (messagesRenderedFromIndex tracks not-yet-rendered
  // earlier messages) — so this expands everything into the DOM first,
  // same fix as expandAllEntryContentForSearch() there, avoiding
  // shipping the same, already-known gap into a brand new feature.
  var chatSearchState = { matches: [], index: -1 };

  function expandAllChatContentForSearch() {
    var guard = 0;
    while (messagesRenderedFromIndex > 0 && guard < 200) {
      loadEarlierMessages();
      guard++;
    }
  }

  function toggleChatSearch() {
    var bar = document.getElementById('chatSearchBar');
    var isHidden = bar.style.display === 'none' || !bar.style.display;
    bar.style.display = isHidden ? 'flex' : 'none';
    var input = document.getElementById('chatSearchInput');
    if (isHidden) {
      // preventScroll:true — same fix as app.html's own entry-search
      // toggle, same reasoning: focusing this input right as the bar's
      // own new height appears can otherwise trigger the browser's
      // default scroll-into-view behavior, shifting the page slightly.
      if (input) input.focus({ preventScroll: true });
    } else {
      if (input) input.value = '';
      clearChatSearchHighlights();
    }
  }
  window.toggleChatSearch = toggleChatSearch;

  function clearChatSearchHighlights() {
    var container = document.getElementById('chatMessages');
    if (container) {
      var marks = container.querySelectorAll('mark.chat-search-hit');
      marks.forEach(function(m) {
        var parent = m.parentNode;
        if (!parent) return;
        parent.replaceChild(document.createTextNode(m.textContent), m);
        parent.normalize();
      });
    }
    chatSearchState = { matches: [], index: -1 };
    updateChatSearchCounter();
  }

  function updateChatSearchCounter() {
    var counter = document.getElementById('chatSearchCounter');
    var input = document.getElementById('chatSearchInput');
    if (!counter) return;
    if (!input || !input.value.trim()) { counter.textContent = ''; return; }
    var matches = chatSearchState.matches;
    counter.textContent = matches.length ? (chatSearchState.index + 1) + ' of ' + matches.length : '0 of 0';
  }

  function runChatSearch() {
    expandAllChatContentForSearch();
    clearChatSearchHighlights();
    var input = document.getElementById('chatSearchInput');
    var query = input ? input.value.trim() : '';
    if (!query) return;
    var container = document.getElementById('chatMessages');
    if (!container) return;

    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var textNodes = [];
    var node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.trim()) textNodes.push(node);
    }

    var lowerQuery = query.toLowerCase();
    textNodes.forEach(function(textNode) {
      var text = textNode.nodeValue;
      var lowerText = text.toLowerCase();
      if (lowerText.indexOf(lowerQuery) === -1) return;

      var frag = document.createDocumentFragment();
      var lastEnd = 0;
      var idx = lowerText.indexOf(lowerQuery);
      while (idx !== -1) {
        frag.appendChild(document.createTextNode(text.slice(lastEnd, idx)));
        var mark = document.createElement('mark');
        mark.className = 'chat-search-hit';
        mark.style.background = '#FFE58A';
        mark.style.borderRadius = '2px';
        mark.textContent = text.slice(idx, idx + query.length);
        frag.appendChild(mark);
        lastEnd = idx + query.length;
        idx = lowerText.indexOf(lowerQuery, lastEnd);
      }
      frag.appendChild(document.createTextNode(text.slice(lastEnd)));
      textNode.parentNode.replaceChild(frag, textNode);
    });

    var matches = Array.prototype.slice.call(container.querySelectorAll('mark.chat-search-hit'));
    chatSearchState = { matches: matches, index: matches.length ? 0 : -1 };
    updateChatSearchCounter();
    focusCurrentChatSearchMatch();
  }
  window.runChatSearch = runChatSearch;

  function focusCurrentChatSearchMatch() {
    chatSearchState.matches.forEach(function(m, i) {
      m.style.background = i === chatSearchState.index ? '#FFA500' : '#FFE58A';
    });
    if (chatSearchState.index >= 0 && chatSearchState.matches[chatSearchState.index]) {
      chatSearchState.matches[chatSearchState.index].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function nextChatSearchMatch() {
    if (!chatSearchState.matches.length) return;
    chatSearchState.index = (chatSearchState.index + 1) % chatSearchState.matches.length;
    updateChatSearchCounter();
    focusCurrentChatSearchMatch();
  }
  window.nextChatSearchMatch = nextChatSearchMatch;

  function prevChatSearchMatch() {
    if (!chatSearchState.matches.length) return;
    chatSearchState.index = (chatSearchState.index - 1 + chatSearchState.matches.length) % chatSearchState.matches.length;
    updateChatSearchCounter();
    focusCurrentChatSearchMatch();
  }
  window.prevChatSearchMatch = prevChatSearchMatch;

  function renderLoadEarlierButton() {
    var container = document.getElementById('chatMessages');
    var existing = document.getElementById('loadEarlierBtn');
    if (existing) existing.remove();
    var btn = document.createElement('button');
    btn.id = 'loadEarlierBtn';
    btn.className = 'chat-icon-btn';
    btn.style.cssText = 'display:block;margin:0 auto 16px;';
    btn.textContent = 'Load earlier messages (' + messagesRenderedFromIndex + ' more)';
    btn.onclick = loadEarlierMessages;
    container.insertBefore(btn, container.firstChild);
  }

  function loadEarlierMessages() {
    var newStart = Math.max(0, messagesRenderedFromIndex - LOAD_EARLIER_BATCH_SIZE);
    var container = document.getElementById('chatMessages');
    var btn = document.getElementById('loadEarlierBtn');
    // Insert each newly-revealed message directly after the button
    // (i.e. right before whatever was previously the FIRST visible
    // message) — walking backwards from the most-recent-of-the-newly-
    // revealed-batch so each insertBefore() lands them in the correct,
    // original chronological order rather than reversed.
    var anchor = btn ? btn.nextSibling : container.firstChild;
    for (var i = messagesRenderedFromIndex - 1; i >= newStart; i--) {
      var msg = allLoadedMessages[i];
      var msgImageUrls2 = (msg.attachmentUrls || []).filter(function(a) { return a.type !== 'pdf'; }).map(function(a) { return a.url; });
      var msgPdfs2 = (msg.attachmentUrls || []).filter(function(a) { return a.type === 'pdf'; }).map(function(a) { return { url: a.url, filename: a.filename || 'document.pdf' }; });
      var el = addMessageToDOM(msg.role, msg.content, Object.assign({ insertBeforeEl: anchor },
        msgImageUrls2.length ? { imagePreviewURLs: msgImageUrls2 } : {},
        msgPdfs2.length ? { pdfAttachments: msgPdfs2 } : {}
      ));
      anchor = el;
    }
    messagesRenderedFromIndex = newStart;
    if (newStart === 0) {
      if (btn) btn.remove();
    } else if (btn) {
      btn.textContent = 'Load earlier messages (' + newStart + ' more)';
    }
  }
  window.loadEarlierMessages = loadEarlierMessages;

  function seedFromEntry(entry) {
    var messages = splitEntryIntoMessages(entry);
    renderMessagesWithPagination(messages);
    // Same "land inside, ready to type" behavior as the existing-
    // session restore path below — this covers all three call sites
    // (no session yet, session lookup failed, session came back empty)
    // in one place rather than repeating it at each. Uses
    // getElementById directly rather than the `input` variable, since
    // that's a LOCAL variable scoped to sendChatMessage() — this
    // function has no access to it at all, confirmed directly before
    // writing this (a scope bug plain syntax-checking alone would
    // never have caught, since JS wouldn't flag it until this code
    // actually ran).
    document.getElementById('chatInput')?.focus();
  }

  Forge.request('GET', '/api/diary/' + chatDiaryEntryId).then(function(r) {
    if (!r || !r.ok || !r.data || !r.data.entry) {
      document.getElementById('chatEmpty').innerHTML = '<h2>Entry not found</h2><p>This Diary entry could not be loaded.</p>';
      return;
    }
    var entry = r.data.entry;
    var meta = null;
    try { meta = typeof entry.metadata === 'string' ? JSON.parse(entry.metadata) : entry.metadata; } catch(_) {}
    var sourceMap = { claude:'claude', chatgpt:'chatgpt', gemini:'gemini', perplexity:'perplexity', grok:'grok', mistral:'mistral', deepseek:'deepseek', meta:'meta' };
    chatModel = sourceMap[entry.source] || 'claude';
    document.getElementById('modelBadgeText').textContent = MODEL_LABELS[chatModel] || chatModel;
    updateChatImageAttachButtonState();
    chatConversationUrl = meta && meta.url ? meta.url : null;
    updateSyncButtonLabel();

    // Honest, visible disclosure — not a missing-feature apology, a
    // real correctness warning: if the user showed the original model
    // an image and then continues here, Forge has no way to know that
    // image ever existed, and may respond as if it hadn't — exactly
    // the "why doesn't it know what I already told it" confusion this
    // whole feature exists to prevent. Shown only when this specific
    // entry actually has images at all (meta.images.length, the same
    // check app.html's own entry card already uses) — never as
    // needless noise on a fork with nothing to disclose.
    if (meta && meta.images && meta.images.length) {
      var imgNote = document.createElement('div');
      imgNote.style.cssText = 'font-size:12px;color:#6B6559;margin:0 20px 12px;padding:8px 12px;background:rgba(193,125,60,0.08);border:0.5px solid rgba(193,125,60,0.25);border-radius:8px;line-height:1.5;';
      imgNote.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>' + 'This conversation included ' + meta.images.length + ' image' + (meta.images.length === 1 ? '' : 's') + ' — images aren\u2019t carried over here yet, so Forge won\u2019t know about anything shown only in a picture from the original conversation.';
      var messagesEl = document.getElementById('chatMessages');
      messagesEl.parentNode.insertBefore(imgNote, messagesEl);
    }

    var sessionId = meta && meta.chatSessionId ? meta.chatSessionId : null;
    if (sessionId) {
      Forge.request('GET', '/api/chat/' + sessionId).then(function(sr) {
        if (sr && sr.ok && sr.data && sr.data.session && sr.data.session.messages && sr.data.session.messages.length) {
          chatSessionId = sessionId;
          renderMessagesWithPagination(sr.data.session.messages);
          // Land the user INSIDE the conversation on return, not just
          // looking at it — ready to type immediately, same as Forge
          // Synthesize already does for its own returning sessions,
          // rather than requiring an extra click into the input box
          // before they can continue where they left off. Uses
          // getElementById directly, not the `input` variable — that's
          // local to sendChatMessage(), inaccessible here.
          document.getElementById('chatInput')?.focus();
        } else {
          seedFromEntry(entry);
        }
      }).catch(function() { seedFromEntry(entry); });
    } else {
      seedFromEntry(entry);
    }
  }).catch(function() {
    document.getElementById('chatEmpty').innerHTML = '<h2>Something went wrong</h2><p>Could not load this Diary entry.</p>';
  });
})();
</script>

<!-- Image zoom / attachment reader — ported from app.html's own,
     already-working components (same overlay/close conventions, same
     ids reused for the pdf.js render logic) rather than building new
     ones, for genuine UX and code consistency between the Diary app and
     Continue Conversation. Deliberately narrower than app.html's own
     version: search-within-document, print, and share are already
     handled elsewhere in THIS page (Continue Conversation's own
     search/print/share), so they're intentionally not duplicated here
     — just the core view+zoom experience, plus download. -->
<div id="imageZoomModal" onclick="if(event.target===this)closeImageZoom()" style="display:none;position:fixed;inset:0;background:rgba(20,20,20,0.9);z-index:10001;align-items:center;justify-content:center;cursor:zoom-out;">
  <button onclick="closeImageZoom()" aria-label="Close" style="position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;line-height:1;cursor:pointer;font-family:Inter,sans-serif;">&times;</button>
  <img id="imageZoomImg" src="" style="max-width:92vw;max-height:92vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,0.5);cursor:default;" onclick="event.stopPropagation();"/>
</div>

<div id="attachmentReaderModal" onclick="if(event.target===this)closeAttachmentReader()" style="display:none;position:fixed;inset:0;background:rgba(20,20,20,0.9);z-index:10001;align-items:center;justify-content:center;">
  <div id="attachmentReaderPanel" style="background:#F5F3EE;width:min(1200px,95vw);height:auto;max-height:95vh;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);overflow:auto;transition:width 0.2s ease, height 0.2s ease;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:0.5px solid #D6D2C8;flex-shrink:0;background:#fdfdfb;">
      <div id="attachmentReaderTitle" style="font-size:14px;font-weight:600;color:#1B2A4A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;font-family:Inter,sans-serif;"></div>
      <div style="display:flex;align-items:center;gap:16px;flex-shrink:0;">
        <div id="pdfZoomControls" style="display:none;align-items:center;gap:8px;">
          <button onclick="zoomPdfOut()" aria-label="Zoom out" style="background:none;border:0.5px solid #D6D2C8;border-radius:5px;color:#6B6559;cursor:pointer;padding:2px 8px;font-size:14px;line-height:1.4;" title="Zoom out">&minus;</button>
          <span id="pdfZoomLevel" style="font-size:11px;color:#9E9890;min-width:36px;text-align:center;">100%</span>
          <button onclick="zoomPdfIn()" aria-label="Zoom in" style="background:none;border:0.5px solid #D6D2C8;border-radius:5px;color:#6B6559;cursor:pointer;padding:2px 8px;font-size:14px;line-height:1.4;" title="Zoom in">&plus;</button>
        </div>
        <button id="attachmentReaderDownload" onclick="downloadAttachmentFromReader()" style="font-size:12px;color:#C17D3C;text-decoration:none;font-weight:500;font-family:Inter,sans-serif;background:none;border:none;cursor:pointer;padding:0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>Download</button>
        <button onclick="closeAttachmentReader()" aria-label="Close" style="background:none;border:none;color:#6B6559;font-size:22px;line-height:1;cursor:pointer;padding:0;">&times;</button>
      </div>
    </div>
    <div id="attachmentReaderBody" style="flex:1;overflow:auto;padding:24px;">
      <div style="text-align:center;color:#9E9890;padding:40px;font-family:Inter,sans-serif;font-size:13px;">Loading&hellip;</div>
    </div>
  </div>
</div>

<script>
function openImageZoom(url) {
  var modal = document.getElementById('imageZoomModal');
  var img = document.getElementById('imageZoomImg');
  img.src = url;
  modal.style.display = 'flex';
}
window.openImageZoom = openImageZoom;

function closeImageZoom() {
  var modal = document.getElementById('imageZoomModal');
  if (modal) modal.style.display = 'none';
}
window.closeImageZoom = closeImageZoom;

var ATTACHMENT_READER_TEXT_TYPES = ['txt','md','csv','json','js','jsx','ts','tsx','py','rb','go','java','c','cpp','h','hpp','cs','php','sh','yml','yaml','xml','html','css','sql'];
var currentReaderAttachment = null;
var currentPdfDoc = null;
var currentPdfScale = 1.4;
var currentPdfReaderBody = null;

function escHtmlReader(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function openAttachmentReader(url, filename, type) {
  var modal = document.getElementById('attachmentReaderModal');
  var titleEl = document.getElementById('attachmentReaderTitle');
  var body = document.getElementById('attachmentReaderBody');
  if (!modal || !titleEl || !body) return;

  currentReaderAttachment = { url: url, filename: filename || 'download', type: (type || '').toLowerCase() };
  titleEl.textContent = filename || 'Document';
  body.innerHTML = '<div style="text-align:center;color:#9E9890;padding:40px;font-family:Inter,sans-serif;font-size:13px;">Loading&hellip;</div>';
  modal.style.display = 'flex';

  var t = (type || '').toLowerCase();
  var zoomControls = document.getElementById('pdfZoomControls');
  if (zoomControls) zoomControls.style.display = t === 'pdf' ? 'flex' : 'none';
  try {
    if (t === 'pdf') {
      await renderPdfIntoReader(url, body);
    } else if (ATTACHMENT_READER_TEXT_TYPES.indexOf(t) !== -1) {
      await renderTextIntoReader(url, body);
    } else {
      body.innerHTML = '<div style="text-align:center;color:#9E9890;padding:40px;font-family:Inter,sans-serif;font-size:13px;">This file type can\'t be previewed here yet. <a href="' + escHtmlReader(url) + '" target="_blank" style="color:#C17D3C;">Open directly &#8599;</a></div>';
    }
  } catch (e) {
    console.warn('[Chat] Attachment reader failed to render:', e.message);
    body.innerHTML = '<div style="text-align:center;color:#9E9890;padding:40px;font-family:Inter,sans-serif;font-size:13px;">Couldn\'t load this file for preview. <a href="' + escHtmlReader(url) + '" target="_blank" style="color:#C17D3C;">Open directly &#8599;</a></div>';
  }
}
window.openAttachmentReader = openAttachmentReader;

function closeAttachmentReader() {
  var modal = document.getElementById('attachmentReaderModal');
  if (modal) modal.style.display = 'none';
  var body = document.getElementById('attachmentReaderBody');
  if (body) body.innerHTML = '<div style="text-align:center;color:#9E9890;padding:40px;font-family:Inter,sans-serif;font-size:13px;">Loading&hellip;</div>';
  currentReaderAttachment = null;
  currentPdfDoc = null;
  currentPdfScale = 1.4;
  currentPdfReaderBody = null;
  // Reset panel size — a previously-opened, orientation-adjusted size
  // (see renderPdfIntoReader's own auto-detection) shouldn't leak into
  // whatever, possibly differently-shaped attachment gets opened next.
  // Resets to the SAME explicit values as the original HTML default, not
  // an empty string — clearing to '' would remove the width property
  // entirely rather than restore it, since setting it via JS already
  // overwrote whatever the original, static HTML value was.
  var panel = document.getElementById('attachmentReaderPanel');
  if (panel) { panel.style.width = 'min(1200px,95vw)'; panel.style.height = 'auto'; panel.style.maxHeight = '95vh'; }
}
window.closeAttachmentReader = closeAttachmentReader;

function downloadAttachmentFromReader() {
  if (!currentReaderAttachment) return;
  var a = document.createElement('a');
  a.href = currentReaderAttachment.url;
  a.download = currentReaderAttachment.filename;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
window.downloadAttachmentFromReader = downloadAttachmentFromReader;

async function renderTextIntoReader(url, body) {
  var resp = await fetch(url);
  if (!resp.ok) throw new Error('Fetch failed with status ' + resp.status);
  var text = await resp.text();
  body.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;color:#1B2A4A;">' + escHtmlReader(text) + '</pre>';
}

async function renderPdfIntoReader(url, body) {
  if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js failed to load');
  currentPdfReaderBody = body;
  currentPdfScale = 1.4;
  currentPdfDoc = await pdfjsLib.getDocument({ url: url }).promise;

  // Auto-detect page orientation from the first page and size the modal
  // panel accordingly — same fix as app.html's own version, ported
  // directly. Uses the UNSCALED viewport (scale: 1) specifically to read
  // the page's own, genuine aspect ratio, independent of whatever zoom
  // level is currently active.
  try {
    var firstPage = await currentPdfDoc.getPage(1);
    var nativeViewport = firstPage.getViewport({ scale: 1 });
    var panel = document.getElementById('attachmentReaderPanel');
    if (panel) {
      if (nativeViewport.width > nativeViewport.height) {
        panel.style.width = 'min(1200px, 95vw)';
        panel.style.height = 'auto';
        panel.style.maxHeight = '95vh';
      } else {
        panel.style.width = 'min(1200px, 95vw)';
        panel.style.height = 'auto';
        panel.style.maxHeight = '95vh';
      }
    }
  } catch (e) {
    console.warn('[Chat] PDF orientation detection failed (non-fatal, using default size):', e.message);
  }

  await renderPdfAtCurrentScale();
}

async function renderPdfAtCurrentScale() {
  if (!currentPdfDoc || !currentPdfReaderBody) return;
  if (renderPdfAtCurrentScale._busy) { renderPdfAtCurrentScale._pending = true; return; }
  renderPdfAtCurrentScale._busy = true;
  var body = currentPdfReaderBody;
  var zoomLevelEl = document.getElementById('pdfZoomLevel');
  if (zoomLevelEl) zoomLevelEl.textContent = Math.round((currentPdfScale / 1.4) * 100) + '%';
  body.innerHTML = '';
  for (var pageNum = 1; pageNum <= currentPdfDoc.numPages; pageNum++) {
    var page = await currentPdfDoc.getPage(pageNum);
    var viewport = page.getViewport({ scale: currentPdfScale });

    var pageWrapper = document.createElement('div');
    pageWrapper.style.position = 'relative';
    pageWrapper.style.margin = '0 auto 16px auto';
    pageWrapper.style.width = viewport.width + 'px';
    pageWrapper.style.height = viewport.height + 'px';
    pageWrapper.style.boxShadow = '0 2px 10px rgba(0,0,0,0.15)';
    pageWrapper.style.background = '#fff';

    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.display = 'block';
    pageWrapper.appendChild(canvas);

    body.appendChild(pageWrapper);

    var ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
  }
  renderPdfAtCurrentScale._busy = false;
  if (renderPdfAtCurrentScale._pending) {
    renderPdfAtCurrentScale._pending = false;
    renderPdfAtCurrentScale();
  }
}

function zoomPdfIn() {
  if (!currentPdfDoc) return;
  currentPdfScale = Math.min(3.0, Math.round((currentPdfScale + 0.2) * 10) / 10);
  renderPdfAtCurrentScale();
}
window.zoomPdfIn = zoomPdfIn;

function zoomPdfOut() {
  if (!currentPdfDoc) return;
  currentPdfScale = Math.max(0.6, Math.round((currentPdfScale - 0.2) * 10) / 10);
  renderPdfAtCurrentScale();
}
window.zoomPdfOut = zoomPdfOut;
</script>
