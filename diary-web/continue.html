<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Continue in Forge — Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  .chat-page { display:flex; flex-direction:column; height:100vh; max-width:760px; margin:0 auto; }
  .chat-header { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:0.5px solid #D6D2C8; flex-shrink:0; background:#F5F3EE; }
  .chat-header a.back { color:#6B6559; text-decoration:none; font-size:13px; display:flex; align-items:center; gap:4px; font-family:'Inter',sans-serif; }
  .chat-header a.back:hover { color:#1B2A4A; }
  .chat-model-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(193,125,60,0.1); border:0.5px solid rgba(193,125,60,0.3); border-radius:50px; padding:4px 12px; font-size:12px; font-weight:500; color:#C17D3C; margin-left:auto; font-family:'Inter',sans-serif; }
  .chat-model-badge .dot { width:6px; height:6px; border-radius:50%; background:#C17D3C; }

  .chat-messages { flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:0; }
  .chat-msg { width:100%; font-size:14px; line-height:1.7; padding:16px 0; border-bottom:0.5px solid #EDE9E0; }
  .chat-msg:last-child { border-bottom:none; }
  .chat-msg.user { display:flex; flex-direction:column; align-items:flex-end; }
  .chat-msg.user .chat-msg-body { background:#1B2A4A; color:#F5F3EE; border-radius:16px 16px 4px 16px; padding:10px 16px; max-width:80%; display:inline-block; text-align:left; }
  .chat-msg.assistant { color:#1B2A4A; }
  .chat-msg-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .chat-msg-label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.03em; font-family:'Inter',sans-serif; }
  .chat-msg-label.ai-label { color:#C17D3C; }
  .chat-msg-body { font-size:14px; line-height:1.75; color:#1B2A4A; }
  .chat-msg-body p { margin:4px 0; }
  .chat-msg-body h1,.chat-msg-body h2,.chat-msg-body h3 { font-family:'Lora',serif; margin:0.75rem 0 0.4rem; color:#1B2A4A; }
  .chat-msg-body ul,.chat-msg-body ol { margin:2px 0 4px; padding-left:1.4em; }
  .chat-msg-body li { margin:1px 0; }
  .chat-msg-footer { display:flex; gap:8px; margin-top:10px; }
  .chat-msg.loading .chat-msg-body { color:#9E9890; font-style:italic; }
  .chat-msg pre { background:#EDE9E0; padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; margin:10px 0; }
  .chat-msg code { background:#EDE9E0; padding:2px 5px; border-radius:4px; font-size:13px; }
  .chat-icon-btn { background:none; border:0.5px solid #D6D2C8; border-radius:6px; color:#6B6559; cursor:pointer; font-size:11px; padding:3px 8px; transition:all .15s; font-family:'Inter',sans-serif; }
  .chat-icon-btn:hover { color:#1B2A4A; border-color:#C17D3C; }

  .chat-input-row { display:flex; gap:8px; padding:14px 20px; border-top:0.5px solid #D6D2C8; flex-shrink:0; background:#F5F3EE; }
  .chat-input { flex:1; background:#fff; border:0.5px solid #D6D2C8; border-radius:8px; padding:10px 14px; color:#1B2A4A; font-size:14px; outline:none; resize:none; min-height:44px; max-height:200px; font-family:'Inter',sans-serif; }
  .chat-input:focus { border-color:#C17D3C; }
  .chat-send-btn { background:#1B2A4A; color:#fff; border:none; border-radius:8px; padding:0 20px; font-size:13px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.2s; }
  .chat-send-btn:hover { background:#26365c; }
  .chat-send-btn:disabled { background:#D6D2C8; cursor:not-allowed; }

  .chat-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#9E9890; padding:20px; }
  .chat-empty h2 { font-family:'Lora',serif; font-size:1.3rem; color:#1B2A4A; margin-bottom:8px; font-weight:500; }
  .chat-empty p { font-size:13px; max-width:380px; }

  .chat-limit-banner { background:#FBF1E8; border:0.5px solid #C17D3C; border-radius:8px; padding:12px 16px; margin:0 20px 16px; font-size:13px; color:#1B2A4A; }
  .chat-limit-banner a { color:#C17D3C; font-weight:500; }

  @media (max-width: 600px) {
    .chat-page { max-width:100%; }
    .chat-msg .chat-msg-body { max-width:90%; }
  }
</style>
</head>
<body>

<div class="chat-page">
  <div class="chat-header">
    <a href="/app.html" class="back" id="chatBackLink">&larr; Back to Diary</a>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <button class="chat-icon-btn" onclick="copyChatThread()" title="Copy conversation">&#128203; Copy</button>
      <div class="chat-model-badge" id="modelBadge"><span class="dot"></span><span id="modelBadgeText">Loading&hellip;</span></div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-empty" id="chatEmpty">
      <h2>Continue in Forge</h2>
      <p>Picking up this Diary conversation in Forge — same context, ready to keep going.</p>
    </div>
  </div>

  <div id="chatLimitBanner"></div>

  <div class="chat-input-row">
    <textarea id="chatInput" class="chat-input" placeholder="Type your message..." rows="1" oninput="autoResizeChatInput(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}"></textarea>
    <button id="chatSendBtn" class="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>
</div>

<script src="/js/forge-api.js"></script>
<script>
'use strict';

const MODEL_LABELS = {
  claude: 'Claude', chatgpt: 'ChatGPT', gemini: 'Gemini', mistral: 'Mistral',
  deepseek: 'DeepSeek', perplexity: 'Perplexity', grok: 'Grok', meta: 'Meta (Llama)'
};

let chatModel = 'claude';
let chatDiaryEntryId = null;
let chatHistory = [];
let chatSessionId = null;
let chatIsSending = false;

function autoResizeChatInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
window.autoResizeChatInput = autoResizeChatInput;

function addMessageToDOM(role, content, opts) {
  opts = opts || {};
  var empty = document.getElementById('chatEmpty');
  if (empty) empty.remove();
  var container = document.getElementById('chatMessages');
  var div = document.createElement('div');
  div.className = 'chat-msg ' + role + (opts.loading ? ' loading' : '');
  if (opts.id) div.id = opts.id;

  var rendered = window.Forge && Forge.renderMarkdown ? Forge.renderMarkdown(content) : content;

  if (role === 'assistant') {
    var modelLabel = MODEL_LABELS[chatModel] || chatModel;
    if (opts.loading) {
      div.innerHTML =
        '<div class="chat-msg-header"><span class="chat-msg-label ai-label">' + modelLabel + '</span></div>' +
        '<div class="chat-msg-body">&bull;&bull;&bull; thinking</div>';
    } else {
      var msgId = 'cmsg_' + Date.now();
      div.innerHTML =
        '<div class="chat-msg-header"><span class="chat-msg-label ai-label">' + modelLabel + '</span></div>' +
        '<div class="chat-msg-body" id="' + msgId + '">' + rendered + '</div>' +
        '<div class="chat-msg-footer"><button class="chat-icon-btn" onclick="copyMsgContent(\'' + msgId + '\')">&#128203; Copy</button></div>';
    }
  } else {
    div.innerHTML = '<div class="chat-msg-body">' + rendered + '</div>';
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function copyMsgContent(msgId) {
  var el = document.getElementById(msgId);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(function() {
    Forge.showToast('Copied!', 'success');
  }).catch(function() { Forge.showToast('Copy failed', 'error'); });
}
window.copyMsgContent = copyMsgContent;

function copyChatThread() {
  var text = chatHistory.map(function(m) {
    return (m.role === 'user' ? 'You: ' : (MODEL_LABELS[chatModel] || chatModel) + ': ') + m.content;
  }).join('\n\n');
  navigator.clipboard.writeText(text).then(function() {
    Forge.showToast('Conversation copied!', 'success');
  }).catch(function() { Forge.showToast('Copy failed', 'error'); });
}
window.copyChatThread = copyChatThread;

// NOTE: fork-marker write-back — see app.html's own display of this
// for the visible badge. Writes BOTH the exact same field name Forge's
// own chat.html already writes (metadata.chatSessionId — confirmed
// directly in that file before building this, so an entry forked from
// either surface is recognized identically) and a new
// metadata.forkedToForgeAt timestamp, since Forge's own version never
// tracked a fork date at all — needed here to show "Forked on [date]"
// without an extra round-trip to chat_sessions just to read its
// created_at.
function linkChatSessionToDiaryEntry(sessionId, isFirstFork) {
  if (!chatDiaryEntryId) return;
  var patch = { metadata: { chatSessionId: sessionId } };
  if (isFirstFork) {
    patch.metadata.forkedToForgeAt = new Date().toISOString();
  }
  Forge.request('PATCH', '/api/diary/' + chatDiaryEntryId, patch).catch(function() {});
}

function showLimitBanner(used, limit, customMessage) {
  var el = document.getElementById('chatLimitBanner');
  var text = customMessage
    ? customMessage
    : 'Monthly free entries used (' + used + '/' + limit + '). ';
  el.innerHTML = '<div class="chat-limit-banner">' + text + ' ' +
    '<a href="/app.html">Upgrade to Forge</a> for unlimited continues.</div>';
}

async function sendChatMessage() {
  if (chatIsSending) return;
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  if (!Forge.isAuthenticated()) { window.location.href = '/signin.html?return=/continue.html'; return; }

  input.value = '';
  autoResizeChatInput(input);
  addMessageToDOM('user', text);
  chatHistory.push({ role: 'user', content: text });

  chatIsSending = true;
  document.getElementById('chatSendBtn').disabled = true;
  addMessageToDOM('assistant', '', { loading: true, id: 'chatLoading' });

  var wasFirstMessage = !chatSessionId;

  try {
    const base = (Forge.API_BASE || 'https://api.projectcoachai.com');
    const resp = await fetch(base + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
        'Authorization': 'Bearer ' + (Forge.getToken ? Forge.getToken() : '')
      },
      body: JSON.stringify({
        sessionId: chatSessionId,
        model: chatModel,
        message: text,
        history: chatHistory.slice(0, -1),
        source: 'diary',
        diaryEntryId: chatDiaryEntryId
      })
    });

    if (resp.status === 429) {
      const errData = await resp.json().catch(() => ({}));
      document.getElementById('chatLoading')?.remove();
      // Two distinct 429 reasons, per the two-axis gating design — shown
      // differently since they mean genuinely different things to the
      // user: one says "this specific conversation is done growing,
      // try a different entry," the other says "you're out of entries
      // to continue this month at all."
      if (errData.reason === 'message_cap') {
        showLimitBanner(null, null, errData.error);
      } else {
        showLimitBanner(errData.entriesUsed, errData.entryLimit);
      }
      chatHistory.pop();
      Forge.showToast(errData.error || 'Limit reached.', 'error');
      return;
    }
    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error || ('Request failed (' + resp.status + ')'));
    }

    const contentType = resp.headers.get('content-type') || '';
    var assistantContent = '';
    var sid = null;

    if (contentType.includes('text/event-stream')) {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));
            if (event.type === 'message') { assistantContent = event.content; sid = event.sessionId; }
            if (event.type === 'error') throw new Error(event.error);
          } catch (e) { if (e.message) throw e; }
        }
      }
    } else {
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Chat failed');
      assistantContent = data.content;
      sid = data.sessionId;
    }

    document.getElementById('chatLoading')?.remove();
    addMessageToDOM('assistant', assistantContent);
    chatHistory.push({ role: 'assistant', content: assistantContent });
    if (sid) {
      chatSessionId = sid;
      linkChatSessionToDiaryEntry(sid, wasFirstMessage);
    }
  } catch (err) {
    document.getElementById('chatLoading')?.remove();
    addMessageToDOM('assistant', '&#9888; ' + (err.message || 'Something went wrong.'));
    Forge.showToast(err.message || 'Chat request failed.', 'error');
  } finally {
    chatIsSending = false;
    document.getElementById('chatSendBtn').disabled = false;
    input.focus();
  }
}
window.sendChatMessage = sendChatMessage;

// ── Init — entry point is a plain query param, not sessionStorage ──────────
// Deliberately NOT the sessionStorage handoff Forge's own chat.html
// uses: confirmed directly that diary.projectcoachai.com and
// forge.projectcoachai.com are genuinely separate origins (server.js's
// own CORS config), so sessionStorage set on one could never be read on
// the other at all. Since Diary's own UI already knows the entry's id
// directly (no navigation between separate origins involved at all),
// a query param is the simplest, most direct mechanism — nothing to
// hand off, just something to read from this page's own URL.
(function init() {
  if (!Forge.isAuthenticated()) {
    window.location.href = '/signin.html?return=/continue.html';
    return;
  }

  var params = new URLSearchParams(window.location.search);
  chatDiaryEntryId = params.get('entryId');

  if (!chatDiaryEntryId) {
    document.getElementById('chatEmpty').innerHTML =
      '<h2>Continue in Forge</h2><p>Open this from a Diary entry to continue that conversation.</p>';
    document.getElementById('modelBadgeText').textContent = 'No entry selected';
    return;
  }

  function seedFromEntry(entry) {
    if (entry.prompt) {
      addMessageToDOM('user', entry.prompt);
      chatHistory.push({ role: 'user', content: entry.prompt });
    }
    if (entry.content) {
      addMessageToDOM('assistant', entry.content);
      chatHistory.push({ role: 'assistant', content: entry.content });
    }
  }

  Forge.request('GET', '/api/diary/' + chatDiaryEntryId).then(function(r) {
    if (!r || !r.ok || !r.data || !r.data.entry) {
      document.getElementById('chatEmpty').innerHTML = '<h2>Entry not found</h2><p>This Diary entry could not be loaded.</p>';
      return;
    }
    var entry = r.data.entry;
    var meta = null;
    try { meta = typeof entry.metadata === 'string' ? JSON.parse(entry.metadata) : entry.metadata; } catch(_) {}
    var sourceMap = { claude:'claude', chatgpt:'chatgpt', gemini:'gemini', perplexity:'perplexity', grok:'grok', mistral:'mistral', deepseek:'deepseek', meta:'meta' };
    chatModel = sourceMap[entry.source] || 'claude';
    document.getElementById('modelBadgeText').textContent = MODEL_LABELS[chatModel] || chatModel;

    var sessionId = meta && meta.chatSessionId ? meta.chatSessionId : null;
    if (sessionId) {
      Forge.request('GET', '/api/chat/' + sessionId).then(function(sr) {
        if (sr && sr.ok && sr.data && sr.data.session && sr.data.session.messages && sr.data.session.messages.length) {
          chatSessionId = sessionId;
          sr.data.session.messages.forEach(function(msg) {
            addMessageToDOM(msg.role, msg.content);
            chatHistory.push(msg);
          });
        } else {
          seedFromEntry(entry);
        }
      }).catch(function() { seedFromEntry(entry); });
    } else {
      seedFromEntry(entry);
    }
  }).catch(function() {
    document.getElementById('chatEmpty').innerHTML = '<h2>Something went wrong</h2><p>Could not load this Diary entry.</p>';
  });
})();
</script>

</body>
</html>
