<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Continue in Forge — Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  .chat-page { display:flex; flex-direction:column; height:100vh; max-width:760px; margin:0 auto; }
  .chat-header { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:0.5px solid #D6D2C8; flex-shrink:0; background:#F5F3EE; }
  .chat-header a.back { color:#6B6559; text-decoration:none; font-size:13px; display:flex; align-items:center; gap:4px; font-family:'Inter',sans-serif; }
  .chat-header a.back:hover { color:#1B2A4A; }
  .chat-model-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(193,125,60,0.1); border:0.5px solid rgba(193,125,60,0.3); border-radius:50px; padding:4px 12px; font-size:12px; font-weight:500; color:#C17D3C; margin-left:auto; font-family:'Inter',sans-serif; }
  .chat-model-badge .dot { width:6px; height:6px; border-radius:50%; background:#C17D3C; }

  .chat-messages { flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:0; }
  .chat-msg { width:100%; font-size:14px; line-height:1.7; padding:16px 0; border-bottom:0.5px solid #EDE9E0; }
  .chat-msg:last-child { border-bottom:none; }
  .chat-msg.user { display:flex; flex-direction:column; align-items:flex-end; }
  .chat-msg.user .chat-msg-body { background:#e8f0fe; color:#1a1a2e; font-weight:500; border-radius:16px 16px 4px 16px; padding:8px 14px; max-width:80%; display:inline-block; text-align:left; }
  .chat-msg.assistant { color:#1B2A4A; }
  .chat-msg-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .chat-msg-label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.03em; font-family:'Inter',sans-serif; }
  .chat-msg-label.ai-label { color:#C17D3C; }
  .chat-msg-body { font-size:14px; line-height:1.75; color:#1B2A4A; }
  .chat-msg-body p { margin:4px 0; }
  .chat-msg-body h1,.chat-msg-body h2,.chat-msg-body h3 { font-family:'Lora',serif; margin:0.75rem 0 0.4rem; color:#1B2A4A; }
  .chat-msg-body ul,.chat-msg-body ol { margin:2px 0 4px; padding-left:1.4em; }
  .chat-msg-body li { margin:1px 0; }
  .chat-msg-footer { display:flex; gap:8px; margin-top:10px; }
  .chat-msg.loading .chat-msg-body { color:#9E9890; font-style:italic; }
  .chat-msg pre { background:#EDE9E0; padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; margin:10px 0; }
  .chat-msg-body table { border-collapse:collapse; width:100%; margin:0.75rem 0; font-size:13px; }
  .chat-msg-body th { background:#F5F2EC; color:#1B2A4A; font-weight:600; padding:7px 10px; border:0.5px solid #D6D2C8; text-align:left; }
  .chat-msg-body td { padding:6px 10px; border:0.5px solid #D6D2C8; color:#3D3530; vertical-align:top; }
  .chat-msg-body tr:nth-child(even) td { background:#FAFAF8; }
  .chat-msg code { background:#EDE9E0; padding:2px 5px; border-radius:4px; font-size:13px; }
  .chat-icon-btn { background:none; border:0.5px solid #D6D2C8; border-radius:6px; color:#6B6559; cursor:pointer; font-size:11px; padding:3px 8px; transition:all .15s; font-family:'Inter',sans-serif; }
  .chat-icon-btn:hover { color:#1B2A4A; border-color:#C17D3C; }

  .chat-input-row { display:flex; gap:8px; padding:14px 20px; border-top:0.5px solid #D6D2C8; flex-shrink:0; background:#F5F3EE; }
  .chat-input { flex:1; background:#fff; border:0.5px solid #D6D2C8; border-radius:8px; padding:10px 14px; color:#1B2A4A; font-size:14px; outline:none; resize:none; min-height:44px; max-height:200px; font-family:'Inter',sans-serif; }
  .chat-input:focus { border-color:#C17D3C; }
  .chat-send-btn { background:#1B2A4A; color:#fff; border:none; border-radius:8px; padding:0 20px; font-size:13px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.2s; }
  .chat-send-btn:hover { background:#26365c; }
  .chat-send-btn:disabled { background:#D6D2C8; cursor:not-allowed; }

  .chat-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#9E9890; padding:20px; }
  .chat-empty h2 { font-family:'Lora',serif; font-size:1.3rem; color:#1B2A4A; margin-bottom:8px; font-weight:500; }
  .chat-empty p { font-size:13px; max-width:380px; }

  .chat-limit-banner { background:#FBF1E8; border:0.5px solid #C17D3C; border-radius:8px; padding:12px 16px; margin:0 20px 16px; font-size:13px; color:#1B2A4A; }
  .chat-limit-banner a { color:#C17D3C; font-weight:500; }

  /* Bubble/sources styling — mirrors app.html's own .user-bubble,
     .user-bubble-long, and .sources-collapsible exactly, since
     renderWithBubbles() below is adapted directly from that same
     function. Needed here specifically for seeded content (a Diary
     entry's own saved prompt/content, which carries the same invisible
     bubble markers and possible Sources footer app.html already knows
     how to render) — without this, that content fell back to plain
     Forge.renderMarkdown() alone, correctly rendering markdown but
     losing the bubble/sources treatment entirely. */
  .user-bubble { display:block; background:#e8f0fe; border-radius:16px 16px 4px 16px; padding:8px 14px; margin:12px 0 4px auto; max-width:80%; font-size:13px; color:#1a1a2e; font-weight:500; text-align:right; width:fit-content; margin-left:auto; }
  .user-bubble-long { display:block; background:none; border-left:3px solid #D6D2C8; border-radius:0; padding:2px 0 2px 14px; margin:12px 0; max-width:100%; width:auto; font-size:13px; color:#4A4035; font-weight:400; text-align:left; white-space:pre-wrap; }

  @media (max-width: 600px) {
    .chat-page { max-width:100%; }
    .chat-msg .chat-msg-body { max-width:90%; }
  }
</style>
</head>
<body>

<div class="chat-page">
  <div class="chat-header">
    <a href="/app.html" class="back" id="chatBackLink">&larr; Back to Diary</a>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <button class="chat-icon-btn" id="syncBtn" onclick="performSync()" title="Pull in anything new from the original conversation">&#128260; Checking&hellip;</button>
      <button class="chat-icon-btn" onclick="copyChatThread()" title="Copy conversation">&#128203; Copy</button>
      <div class="chat-model-badge" id="modelBadge"><span class="dot"></span><span id="modelBadgeText">Loading&hellip;</span></div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-empty" id="chatEmpty">
      <h2>Continue in Forge</h2>
      <p>Picking up this Diary conversation in Forge — same context, ready to keep going.</p>
    </div>
  </div>

  <div id="chatLimitBanner"></div>

  <div class="chat-input-row">
    <textarea id="chatInput" class="chat-input" placeholder="Type your message..." rows="1" oninput="autoResizeChatInput(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}"></textarea>
    <button id="chatSendBtn" class="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>
</div>

<script src="/js/forge-api.js"></script>
<script>
'use strict';

const MODEL_LABELS = {
  claude: 'Claude', chatgpt: 'ChatGPT', gemini: 'Gemini', mistral: 'Mistral',
  deepseek: 'DeepSeek', perplexity: 'Perplexity', grok: 'Grok', meta: 'Meta (Llama)'
};

let chatModel = 'claude';
let chatDiaryEntryId = null;
let chatHistory = [];
let chatSessionId = null;
let chatIsSending = false;

// ── Sync (Diary Priority 9) ─────────────────────────────────────────────────
const DIARY_EXT_ID = 'momenmcgdmceejapigodolpekonmaedd';
let chatConversationUrl = null;
let chatIsSyncing = false;

function isExtensionAvailable() {
  return typeof chrome !== 'undefined' && !!chrome.runtime;
}

function extSendMessage(payload) {
  return new Promise(function(resolve) {
    if (!isExtensionAvailable()) { resolve(null); return; }
    try {
      chrome.runtime.sendMessage(DIARY_EXT_ID, payload, function(response) {
        if (chrome.runtime.lastError) { resolve(null); return; }
        resolve(response);
      });
    } catch (e) { resolve(null); }
  });
}

// Rough, human, non-precise phrasing — "synced as of [time]" is meant
// to read the same familiar way Dropbox/iCloud/git already do, per the
// brief's own guidance not to over-explain this.
function formatRelativeTime(isoString) {
  if (!isoString) return null;
  var then = new Date(isoString).getTime();
  var diffSec = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (diffSec < 30) return 'just now';
  if (diffSec < 90) return '1 min ago';
  if (diffSec < 3600) return Math.round(diffSec / 60) + ' min ago';
  if (diffSec < 7200) return '1 hour ago';
  if (diffSec < 86400) return Math.round(diffSec / 3600) + ' hours ago';
  return new Date(isoString).toLocaleDateString(undefined, {month:'short', day:'numeric'});
}

// Decided BEFORE any click, never a surprise after — per the explicit
// design requirement: the button's own label already tells the user
// whether this will be near-instant or involves opening a visible tab
// to the original conversation, rather than a tab just appearing
// unannounced once they've already committed to clicking.
async function updateSyncButtonLabel() {
  var btn = document.getElementById('syncBtn');
  if (!btn) return;
  if (!isExtensionAvailable()) {
    btn.style.display = 'none';
    return;
  }
  if (!chatConversationUrl) {
    btn.textContent = '\u{1F504} Sync';
    return;
  }
  var lastSynced = null;
  try {
    var r = await Forge.request('GET', '/api/diary/' + chatDiaryEntryId);
    if (r && r.ok && r.data && r.data.entry) {
      var meta = typeof r.data.entry.metadata === 'string' ? JSON.parse(r.data.entry.metadata) : r.data.entry.metadata;
      lastSynced = meta && meta.lastSyncedAt;
    }
  } catch(_) {}
  var syncedText = lastSynced ? ('Synced ' + formatRelativeTime(lastSynced)) : 'Never synced';
  var tabCheck = await extSendMessage({ type: 'CHECK_TAB_OPEN', conversationUrl: chatConversationUrl });
  var opensNewTab = !(tabCheck && tabCheck.isOpen);
  btn.dataset.syncedText = syncedText;
  btn.textContent = '\u{1F504} ' + syncedText + (opensNewTab ? ' \u2022 opens original conversation' : '');
}

async function performSync() {
  if (chatIsSyncing || !chatConversationUrl) return;
  var btn = document.getElementById('syncBtn');
  chatIsSyncing = true;
  var previousText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '\u{1F504} Syncing\u2026'; btn.disabled = true; }
  try {
    const result = await extSendMessage({ type: 'REQUEST_SYNC', conversationUrl: chatConversationUrl, diaryEntryId: chatDiaryEntryId });
    if (!result || !result.success) {
      Forge.showToast((result && result.error) || 'Sync failed — extension may not be installed.', 'error');
      if (btn) btn.textContent = previousText;
      return;
    }
    // Reflect what actually happened, honestly — a sync "succeeding"
    // (the mechanism ran without error) is a distinct thing from
    // whether it actually found and merged anything, per the brief's
    // own emphasis on not overclaiming here. history_mismatch in
    // particular must surface to the user, not read as a silent,
    // unremarked success — the whole reason the backend surfaces this
    // reason at all instead of just quietly skipping the merge.
    const sync = result.chatSessionSync;
    if (sync && sync.reason === 'history_mismatch') {
      Forge.showToast('Synced the entry, but couldn\u2019t merge into this Forge conversation automatically — the native and Forge histories no longer line up.', 'error');
    } else if (sync && sync.merged) {
      Forge.showToast('Synced — ' + sync.addedCount + ' new message' + (sync.addedCount === 1 ? '' : 's') + ' pulled in.', 'success');
    } else {
      Forge.showToast('Synced — nothing new to pull in.', 'success');
    }
    // Reload to reflect whatever actually changed — the simplest,
    // most reliable way to show a merged conversation without trying
    // to reconcile partial DOM state by hand.
    setTimeout(function() { window.location.reload(); }, 900);
  } finally {
    chatIsSyncing = false;
    if (btn) btn.disabled = false;
    updateSyncButtonLabel();
  }
}
window.performSync = performSync;

function autoResizeChatInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
window.autoResizeChatInput = autoResizeChatInput;

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Adapted directly from app.html's own renderWithBubbles() — see that
// function's own comments for the full reasoning on the Sources-split
// and bubble-marker logic; kept in sync deliberately rather than
// sharing via forge-api.js, since this stayed small enough that
// duplicating it here was lower-risk than modifying that shared,
// cross-page module for one page's need. Safe to call for EVERY
// message, not just seeded ones: degrades to plain Forge.renderMarkdown()
// when no bubble marker or Sources footer is present at all, which is
// always true for a freshly-generated response.
function renderWithBubbles(text) {
  var sourcesHtml = '';
  var sourcesMatch = text.match(/\n\n---\n\n\*\*Sources:\*\*\n([\s\S]*)$/);
  if (sourcesMatch) {
    text = text.slice(0, sourcesMatch.index);
    var sourceLines = sourcesMatch[1].split('\n').filter(function(l) { return l.trim(); });
    var sourcesBody = Forge.renderMarkdown(sourcesMatch[1]).replace(/<p>\s*<\/p>/g, '');
    var sid = 'src-' + Math.random().toString(36).slice(2, 10);
    sourcesHtml = '<div style="margin-top:14px;">' +
      '<button onclick="event.stopPropagation();var b=document.getElementById(\'' + sid + '\');var open=b.style.display!==\'none\';b.style.display=open?\'none\':\'block\';this.querySelector(\'.sources-chevron\').style.transform=open?\'rotate(-90deg)\':\'rotate(0deg)\';" ' +
        'style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px 0;font-size:12px;color:#6B6559;font-family:Inter,sans-serif;">' +
        '<span class="sources-chevron" style="display:inline-block;transition:transform 0.15s;transform:rotate(-90deg);">&#9656;</span>' +
        'Sources (' + sourceLines.length + ')' +
      '</button>' +
      '<div id="' + sid + '" style="display:none;padding-left:18px;font-size:13px;color:#6B6559;">' + sourcesBody + '</div>' +
    '</div>';
  }

  var TITLE_MARK = '\u2063';
  var markerRe = new RegExp(TITLE_MARK + '\\*\\*([^*]+)\\*\\*' + TITLE_MARK, 'g');
  var html = '';
  var lastIndex = 0;
  var m;
  var found = false;
  while ((m = markerRe.exec(text)) !== null) {
    found = true;
    var before = text.slice(lastIndex, m.index).replace(/^\n+|\n+$/g, '');
    if (before) html += Forge.renderMarkdown(before).replace(/<p>\s*<\/p>/g, '');
    var isLongQuestion = m[1].length > 150 || (m[1].match(/\n/g) || []).length > 1;
    html += '<div class="' + (isLongQuestion ? 'user-bubble-long' : 'user-bubble') + '">' + escHtml(m[1]) + '</div>';
    lastIndex = markerRe.lastIndex;
  }
  if (!found) return Forge.renderMarkdown(text).replace(/<p>\s*<\/p>/g, '') + sourcesHtml;
  var rest = text.slice(lastIndex).replace(/^\n+/, '');
  if (rest) html += Forge.renderMarkdown(rest).replace(/<p>\s*<\/p>/g, '');
  return html + sourcesHtml;
}

function addMessageToDOM(role, content, opts) {
  opts = opts || {};
  var empty = document.getElementById('chatEmpty');
  if (empty) empty.remove();
  var container = document.getElementById('chatMessages');
  var div = document.createElement('div');
  div.className = 'chat-msg ' + role + (opts.loading ? ' loading' : '');
  if (opts.id) div.id = opts.id;

  var rendered = window.Forge && Forge.renderMarkdown ? renderWithBubbles(content) : content;

  if (role === 'assistant') {
    var modelLabel = MODEL_LABELS[chatModel] || chatModel;
    if (opts.loading) {
      div.innerHTML =
        '<div class="chat-msg-header"><span class="chat-msg-label ai-label">' + modelLabel + '</span></div>' +
        '<div class="chat-msg-body">&bull;&bull;&bull; thinking</div>';
    } else {
      var msgId = 'cmsg_' + Date.now();
      div.innerHTML =
        '<div class="chat-msg-header"><span class="chat-msg-label ai-label">' + modelLabel + '</span></div>' +
        '<div class="chat-msg-body" id="' + msgId + '">' + rendered + '</div>' +
        '<div class="chat-msg-footer"><button class="chat-icon-btn" onclick="copyMsgContent(\'' + msgId + '\')">&#128203; Copy</button></div>';
    }
  } else {
    div.innerHTML = '<div class="chat-msg-body">' + rendered + '</div>';
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function copyMsgContent(msgId) {
  var el = document.getElementById(msgId);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(function() {
    Forge.showToast('Copied!', 'success');
  }).catch(function() { Forge.showToast('Copy failed', 'error'); });
}
window.copyMsgContent = copyMsgContent;

function copyChatThread() {
  var text = chatHistory.map(function(m) {
    return (m.role === 'user' ? 'You: ' : (MODEL_LABELS[chatModel] || chatModel) + ': ') + m.content;
  }).join('\n\n');
  navigator.clipboard.writeText(text).then(function() {
    Forge.showToast('Conversation copied!', 'success');
  }).catch(function() { Forge.showToast('Copy failed', 'error'); });
}
window.copyChatThread = copyChatThread;

// NOTE: fork-marker write-back — see app.html's own display of this
// for the visible badge. Writes BOTH the exact same field name Forge's
// own chat.html already writes (metadata.chatSessionId — confirmed
// directly in that file before building this, so an entry forked from
// either surface is recognized identically) and a new
// metadata.forkedToForgeAt timestamp, since Forge's own version never
// tracked a fork date at all — needed here to show "Forked on [date]"
// without an extra round-trip to chat_sessions just to read its
// created_at.
function linkChatSessionToDiaryEntry(sessionId, isFirstFork, nativeSeedCount) {
  if (!chatDiaryEntryId) return;
  var patch = { metadata: { chatSessionId: sessionId } };
  if (isFirstFork) {
    patch.metadata.forkedToForgeAt = new Date().toISOString();
    patch.metadata.nativeSeedMessageCount = nativeSeedCount;
  }
  Forge.request('PATCH', '/api/diary/' + chatDiaryEntryId, patch).catch(function() {});
}

function showLimitBanner(used, limit, customMessage) {
  var el = document.getElementById('chatLimitBanner');
  var text = customMessage
    ? customMessage
    : 'Monthly free entries used (' + used + '/' + limit + '). ';
  el.innerHTML = '<div class="chat-limit-banner">' + text + ' ' +
    '<a href="https://forge.projectcoachai.com/pricing.html">Upgrade to Forge</a> for unlimited continues.</div>';
}

async function sendChatMessage() {
  if (chatIsSending) return;
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  if (!Forge.isAuthenticated()) { window.location.href = '/signin.html?return=/continue.html'; return; }

  // Captured BEFORE chatHistory is mutated below, deliberately — this is
  // exactly "how many messages existed natively at the moment of
  // forking," which must exclude the very message about to be pushed
  // (the first-ever Forge-side message). Confirmed directly: capturing
  // this any later — even right after the push, let alone at
  // linkChatSessionToDiaryEntry()'s own call site further down, after
  // the assistant's response has ALSO been pushed — would incorrectly
  // count that first Forge exchange as part of the native seed.
  var nativeSeedCountAtForkTime = chatHistory.length;

  input.value = '';
  autoResizeChatInput(input);
  var lastUserMessageEl = addMessageToDOM('user', text);
  chatHistory.push({ role: 'user', content: text });

  chatIsSending = true;
  document.getElementById('chatSendBtn').disabled = true;
  addMessageToDOM('assistant', '', { loading: true, id: 'chatLoading' });

  var wasFirstMessage = !chatSessionId;

  try {
    const base = (Forge.API_BASE || 'https://api.projectcoachai.com');
    const resp = await fetch(base + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
        'Authorization': 'Bearer ' + (Forge.getToken ? Forge.getToken() : '')
      },
      body: JSON.stringify({
        sessionId: chatSessionId,
        model: chatModel,
        message: text,
        history: chatHistory.slice(0, -1),
        source: 'diary',
        diaryEntryId: chatDiaryEntryId
      })
    });

    if (resp.status === 429) {
      const errData = await resp.json().catch(() => ({}));
      document.getElementById('chatLoading')?.remove();
      // Restore the typed text and remove the now-stale user bubble —
      // chatHistory.pop() below already removes this message from
      // state, but without this the DOM bubble stayed visible,
      // misleadingly implying the message had sent when it hadn't, and
      // the text itself was permanently lost from the input box,
      // forcing a full retype to retry (or to copy elsewhere, e.g. a
      // different, non-capped entry, per this error's own suggestion).
      lastUserMessageEl?.remove();
      input.value = text;
      autoResizeChatInput(input);
      // Two distinct 429 reasons, per the two-axis gating design — shown
      // differently since they mean genuinely different things to the
      // user: one says "this specific conversation is done growing,
      // try a different entry," the other says "you're out of entries
      // to continue this month at all."
      if (errData.reason === 'message_cap') {
        showLimitBanner(null, null, errData.error);
      } else {
        showLimitBanner(errData.entriesUsed, errData.entryLimit);
      }
      chatHistory.pop();
      Forge.showToast(errData.error || 'Limit reached.', 'error');
      return;
    }
    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error || ('Request failed (' + resp.status + ')'));
    }

    const contentType = resp.headers.get('content-type') || '';
    var assistantContent = '';
    var sid = null;

    if (contentType.includes('text/event-stream')) {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));
            if (event.type === 'message') { assistantContent = event.content; sid = event.sessionId; }
            if (event.type === 'error') throw new Error(event.error);
          } catch (e) { if (e.message) throw e; }
        }
      }
    } else {
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Chat failed');
      assistantContent = data.content;
      sid = data.sessionId;
    }

    document.getElementById('chatLoading')?.remove();
    addMessageToDOM('assistant', assistantContent);
    chatHistory.push({ role: 'assistant', content: assistantContent });
    if (sid) {
      chatSessionId = sid;
      linkChatSessionToDiaryEntry(sid, wasFirstMessage, nativeSeedCountAtForkTime);
    }
  } catch (err) {
    document.getElementById('chatLoading')?.remove();
    // Same restoration as the 429 case above, plus removing this
    // message from chatHistory too (missing here previously, unlike
    // the 429 path) — otherwise a failed send left the message stuck
    // in chatHistory permanently, risking a duplicate if the user
    // retyped and resent the same text.
    lastUserMessageEl?.remove();
    input.value = text;
    autoResizeChatInput(input);
    chatHistory.pop();
    addMessageToDOM('assistant', '&#9888; ' + (err.message || 'Something went wrong.'));
    Forge.showToast(err.message || 'Chat request failed.', 'error');
  } finally {
    chatIsSending = false;
    document.getElementById('chatSendBtn').disabled = false;
    input.focus();
  }
}
window.sendChatMessage = sendChatMessage;

// ── Init — entry point is a plain query param, not sessionStorage ──────────
// Deliberately NOT the sessionStorage handoff Forge's own chat.html
// uses: confirmed directly that diary.projectcoachai.com and
// forge.projectcoachai.com are genuinely separate origins (server.js's
// own CORS config), so sessionStorage set on one could never be read on
// the other at all. Since Diary's own UI already knows the entry's id
// directly (no navigation between separate origins involved at all),
// a query param is the simplest, most direct mechanism — nothing to
// hand off, just something to read from this page's own URL.
(function init() {
  if (!Forge.isAuthenticated()) {
    window.location.href = '/signin.html?return=/continue.html';
    return;
  }

  var params = new URLSearchParams(window.location.search);
  chatDiaryEntryId = params.get('entryId');

  if (!chatDiaryEntryId) {
    document.getElementById('chatEmpty').innerHTML =
      '<h2>Continue in Forge</h2><p>Open this from a Diary entry to continue that conversation.</p>';
    document.getElementById('modelBadgeText').textContent = 'No entry selected';
    return;
  }

  // NOTE: entry.content is NOT a single, isolated assistant response —
  // it's the entire, multi-turn conversation thread, with every
  // question after the first marked by an invisible U+2063 marker
  // around bolded text (diary-extension's own boldQuestion(), consumed
  // by app.html's renderWithBubbles() for its own bubble styling).
  // Confirmed directly against app.html's own parsing before writing
  // this — same marker regex, but building a real {role,content}
  // message list here instead of HTML, since that's what this page's
  // chat-style UI (and chatHistory sent to /api/chat) actually needs.
  // Skipping this and treating entry.content as one assistant blob
  // (the original, wrong version of this function) meant every
  // embedded question, its invisible markers, and the true model
  // response all rendered as one undifferentiated message — losing
  // per-turn bubbles/labels and confusing renderMarkdown with content
  // it was never meant to parse as a single unit.
  function splitEntryIntoMessages(entry) {
    var messages = [];
    var text = entry.content || '';

    var sourcesText = '';
    var sourcesMatch = text.match(/\n\n---\n\n\*\*Sources:\*\*\n([\s\S]*)$/);
    if (sourcesMatch) {
      sourcesText = text.slice(sourcesMatch.index);
      text = text.slice(0, sourcesMatch.index);
    }

    var TITLE_MARK = '\u2063';
    var markerRe = new RegExp(TITLE_MARK + '\\*\\*([^*]+)\\*\\*' + TITLE_MARK, 'g');
    var lastIndex = 0;
    var m;
    while ((m = markerRe.exec(text)) !== null) {
      var before = text.slice(lastIndex, m.index).replace(/^\n+|\n+$/g, '');
      if (before) messages.push({ role: 'assistant', content: before });
      messages.push({ role: 'user', content: m[1] });
      lastIndex = markerRe.lastIndex;
    }
    var rest = text.slice(lastIndex).replace(/^\n+/, '');
    if (rest) messages.push({ role: 'assistant', content: rest });

    // The FIRST question is stored twice on the extension's own side —
    // once as entry.prompt, and, for at least Claude, ALSO wrapped in
    // the exact same U+2063 marker at the very start of entry.content
    // itself (confirmed directly: diary-content.js's own comment says
    // entry.prompt is extracted by finding the first such marked span
    // in the same seed text that becomes entry.content). Prepending
    // entry.prompt unconditionally, as the original version of this
    // function did, double-counted that first question whenever it was
    // already present as entry.content's own first marker match — which
    // is exactly the reported "title shown twice" bug. Detecting this
    // directly from the parsed result (rather than hardcoding "Claude
    // always does this") stays correct even if a provider's own content
    // never embeds the first question in entry.content at all — in
    // that case messages[0] won't already be the user's first turn, so
    // prepending is still exactly right.
    var firstQuestionAlreadyCaptured = messages.length > 0 && messages[0].role === 'user' &&
      entry.prompt && messages[0].content.trim() === entry.prompt.trim();
    if (entry.prompt && !firstQuestionAlreadyCaptured) {
      messages.unshift({ role: 'user', content: entry.prompt });
    }

    if (sourcesText && messages.length && messages[messages.length - 1].role === 'assistant') {
      messages[messages.length - 1].content += sourcesText;
    } else if (sourcesText) {
      messages.push({ role: 'assistant', content: sourcesText.replace(/^\n+/, '') });
    }

    return messages;
  }

  function seedFromEntry(entry) {
    var messages = splitEntryIntoMessages(entry);
    messages.forEach(function(msg) {
      addMessageToDOM(msg.role, msg.content);
      chatHistory.push(msg);
    });
    // Same "land inside, ready to type" behavior as the existing-
    // session restore path below — this covers all three call sites
    // (no session yet, session lookup failed, session came back empty)
    // in one place rather than repeating it at each. Uses
    // getElementById directly rather than the `input` variable, since
    // that's a LOCAL variable scoped to sendChatMessage() — this
    // function has no access to it at all, confirmed directly before
    // writing this (a scope bug plain syntax-checking alone would
    // never have caught, since JS wouldn't flag it until this code
    // actually ran).
    document.getElementById('chatInput')?.focus();
  }

  Forge.request('GET', '/api/diary/' + chatDiaryEntryId).then(function(r) {
    if (!r || !r.ok || !r.data || !r.data.entry) {
      document.getElementById('chatEmpty').innerHTML = '<h2>Entry not found</h2><p>This Diary entry could not be loaded.</p>';
      return;
    }
    var entry = r.data.entry;
    var meta = null;
    try { meta = typeof entry.metadata === 'string' ? JSON.parse(entry.metadata) : entry.metadata; } catch(_) {}
    var sourceMap = { claude:'claude', chatgpt:'chatgpt', gemini:'gemini', perplexity:'perplexity', grok:'grok', mistral:'mistral', deepseek:'deepseek', meta:'meta' };
    chatModel = sourceMap[entry.source] || 'claude';
    document.getElementById('modelBadgeText').textContent = MODEL_LABELS[chatModel] || chatModel;
    chatConversationUrl = meta && meta.url ? meta.url : null;
    updateSyncButtonLabel();

    var sessionId = meta && meta.chatSessionId ? meta.chatSessionId : null;
    if (sessionId) {
      Forge.request('GET', '/api/chat/' + sessionId).then(function(sr) {
        if (sr && sr.ok && sr.data && sr.data.session && sr.data.session.messages && sr.data.session.messages.length) {
          chatSessionId = sessionId;
          sr.data.session.messages.forEach(function(msg) {
            addMessageToDOM(msg.role, msg.content);
            chatHistory.push(msg);
          });
          // Land the user INSIDE the conversation on return, not just
          // looking at it — ready to type immediately, same as Forge
          // Synthesize already does for its own returning sessions,
          // rather than requiring an extra click into the input box
          // before they can continue where they left off. Uses
          // getElementById directly, not the `input` variable — that's
          // local to sendChatMessage(), inaccessible here.
          document.getElementById('chatInput')?.focus();
        } else {
          seedFromEntry(entry);
        }
      }).catch(function() { seedFromEntry(entry); });
    } else {
      seedFromEntry(entry);
    }
  }).catch(function() {
    document.getElementById('chatEmpty').innerHTML = '<h2>Something went wrong</h2><p>Could not load this Diary entry.</p>';
  });
})();
</script>
