<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Continue in Forge — Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  .chat-page { display:flex; flex-direction:column; height:100vh; max-width:760px; margin:0 auto; transition: max-width 0.2s ease; }
  /* Confirmed 760px is a genuinely good default for text readability
     (optimal line length lands around 50-75 characters at typical font
     sizes), but leaves substantial, unused whitespace on wide monitors
     — expanded state offers more room for those who want it, without
     going fully unconstrained (which would just trade "too narrow" for
     "lines too long to read comfortably" in the other direction). Not
     display:none-level different from the default, so the same "safe
     default, opt into more space" pattern already proven for the
     sidebar toggle in app.html. */
  .chat-page.chat-page-expanded { max-width: 1100px; }
  .chat-header { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:0.5px solid #D6D2C8; flex-shrink:0; background:#F5F3EE; }
  .chat-header a.back { color:#6B6559; text-decoration:none; font-size:13px; display:flex; align-items:center; gap:4px; font-family:'Inter',sans-serif; }
  .chat-header a.back:hover { color:#1B2A4A; }
  .chat-model-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(193,125,60,0.1); border:0.5px solid rgba(193,125,60,0.3); border-radius:50px; padding:4px 12px; font-size:12px; font-weight:500; color:#C17D3C; margin-left:auto; font-family:'Inter',sans-serif; }
  .chat-model-badge .dot { width:6px; height:6px; border-radius:50%; background:#C17D3C; }

  .chat-messages { flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:0; }
  .chat-msg { width:100%; font-size:14px; line-height:1.7; padding:16px 0; border-bottom:0.5px solid #EDE9E0; }
  .chat-msg:last-child { border-bottom:none; }
  .chat-msg.user { display:flex; flex-direction:column; align-items:flex-end; }
  .chat-msg.user .chat-msg-body { background:#e8f0fe; color:#1a1a2e; font-weight:500; border-radius:16px 16px 4px 16px; padding:8px 14px; max-width:80%; display:inline-block; text-align:left; }
  .chat-msg.assistant { color:#1B2A4A; }
  .chat-msg-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .chat-msg-label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.03em; font-family:'Inter',sans-serif; }
  .chat-msg-label.ai-label { color:#C17D3C; }
  .chat-msg-body { font-size: calc(14px * var(--diary-font-scale, 1)); line-height:1.75; color:#1B2A4A; }
  .chat-msg-body p { margin:4px 0; }
  .chat-msg-body h1,.chat-msg-body h2,.chat-msg-body h3 { font-family:'Lora',serif; margin:0.75rem 0 0.4rem; color:#1B2A4A; }
  .chat-msg-body ul,.chat-msg-body ol { margin:2px 0 4px; padding-left:1.4em; }
  .chat-msg-body li { margin:1px 0; }
  .chat-msg-footer { display:flex; gap:8px; margin-top:10px; }
  .chat-msg.loading .chat-msg-body { color:#9E9890; font-style:italic; }
  .chat-msg pre { background:#EDE9E0; padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; margin:10px 0; }
  .chat-msg-body table { border-collapse:collapse; width:100%; margin:0.75rem 0; font-size:13px; }
  .chat-msg-body th { background:#F5F2EC; color:#1B2A4A; font-weight:600; padding:7px 10px; border:0.5px solid #D6D2C8; text-align:left; }
  .chat-msg-body td { padding:6px 10px; border:0.5px solid #D6D2C8; color:#3D3530; vertical-align:top; }
  .chat-msg-body tr:nth-child(even) td { background:#FAFAF8; }
  .chat-msg code { background:#EDE9E0; padding:2px 5px; border-radius:4px; font-size:13px; }
  .chat-icon-btn { background:none; border:0.5px solid #D6D2C8; border-radius:6px; color:#6B6559; cursor:pointer; font-size:11px; padding:3px 8px; transition:all .15s; font-family:'Inter',sans-serif; }
  .chat-icon-btn:hover { color:#1B2A4A; border-color:#C17D3C; }

  .chat-input-row { display:flex; gap:8px; padding:14px 20px; border-top:0.5px solid #D6D2C8; flex-shrink:0; background:#F5F3EE; }
  .chat-input { flex:1; background:#fff; border:0.5px solid #D6D2C8; border-radius:8px; padding:10px 14px; color:#1B2A4A; font-size:14px; outline:none; resize:none; min-height:44px; max-height:200px; font-family:'Inter',sans-serif; }
  .chat-input:focus { border-color:#C17D3C; }
  .chat-send-btn { background:#1B2A4A; color:#fff; border:none; border-radius:8px; padding:0 20px; font-size:13px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.2s; }
  .chat-send-btn:hover { background:#26365c; }
  .chat-send-btn:disabled { background:#D6D2C8; cursor:not-allowed; }

  .chat-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#9E9890; padding:20px; }
  .chat-empty h2 { font-family:'Lora',serif; font-size:1.3rem; color:#1B2A4A; margin-bottom:8px; font-weight:500; }
  .chat-empty p { font-size:13px; max-width:380px; }

  .chat-limit-banner { background:#FBF1E8; border:0.5px solid #C17D3C; border-radius:8px; padding:12px 16px; margin:0 20px 16px; font-size:13px; color:#1B2A4A; }
  .chat-limit-banner a { color:#C17D3C; font-weight:500; }

  /* Bubble/sources styling — mirrors app.html's own .user-bubble,
     .user-bubble-long, and .sources-collapsible exactly, since
     renderWithBubbles() below is adapted directly from that same
     function. Needed here specifically for seeded content (a Diary
     entry's own saved prompt/content, which carries the same invisible
     bubble markers and possible Sources footer app.html already knows
     how to render) — without this, that content fell back to plain
     Forge.renderMarkdown() alone, correctly rendering markdown but
     losing the bubble/sources treatment entirely. */
  .user-bubble { display:block; background:#e8f0fe; border-radius:16px 16px 4px 16px; padding:8px 14px; margin:12px 0 4px auto; max-width:80%; font-size:13px; color:#1a1a2e; font-weight:500; text-align:right; width:fit-content; margin-left:auto; }
  .user-bubble-long { display:block; background:none; border-left:3px solid #D6D2C8; border-radius:0; padding:2px 0 2px 14px; margin:12px 0; max-width:100%; width:auto; font-size:13px; color:#4A4035; font-weight:400; text-align:left; white-space:pre-wrap; }

  @media (max-width: 600px) {
    .chat-page { max-width:100%; }
    .chat-msg .chat-msg-body { max-width:90%; }
  }
</style>
<!-- pdf.js — same loader/version as app.html's own, for the ported
     attachment reader below. Confirmed there, directly against cdnjs's
     own file listing: modern pdf.js ships ONLY as ES modules, so this
     must use type="module" + a real import, then bridge it onto window
     for the rest of this plain script to call normally. Worker path set
     here, inside the module — module scripts defer until after parsing,
     so setting it in the main script block would run before this
     import completes. -->
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108/pdf.worker.min.mjs';
  window.pdfjsLib = pdfjsLib;
</script>
</head>
<body>

<div class="chat-page" id="chatPage">
  <div class="chat-header">
    <a href="/app.html" class="back" id="chatBackLink">&larr; Back to Diary</a>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <button class="chat-icon-btn" id="syncBtn" onclick="performSync()" title="Pull in anything new from the original conversation"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg> Checking&hellip;</button>
      <span style="display:inline-flex;gap:4px;margin-right:4px;">
        <button onclick="adjustDiaryFontScale(-1)" title="Decrease text size" style="width:24px;height:24px;border:0.5px solid #D6D2C8;border-radius:5px;background:#fff;color:#4A4035;font-size:11px;font-weight:700;cursor:pointer;line-height:1;">A&#8722;</button>
        <button onclick="adjustDiaryFontScale(1)" title="Increase text size" style="width:24px;height:24px;border:0.5px solid #D6D2C8;border-radius:5px;background:#fff;color:#4A4035;font-size:14px;font-weight:700;cursor:pointer;line-height:1;">A&#43;</button>
      </span>
      <button class="chat-icon-btn" id="chatWidthToggleBtn" onclick="toggleChatPageWidth()" title="Expand for a wider reading view"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg> Expand</button>
      <button class="chat-icon-btn" onclick="toggleChatSearch()" title="Search this conversation"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</button>
      <button class="chat-icon-btn" onclick="copyChatThread()" title="Copy conversation"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 7.5V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08M15.75 18H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08M15.75 18.75v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5A3.375 3.375 0 0 0 6.375 7.5H5.25m11.9-3.664A2.251 2.251 0 0 0 15 2.25h-1.5a2.251 2.251 0 0 0-2.15 1.586m5.8 0c.065.21.1.433.1.664v.75h-6V4.5c0-.231.035-.454.1-.664M6.75 7.5H4.875c-.621 0-1.125.504-1.125 1.125v12c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V16.5a9 9 0 0 0-9-9Z"/></svg> Copy</button>
      <button class="chat-icon-btn" onclick="shareConversation()" title="Share this conversation"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg> Share</button>
      <div class="chat-model-badge" id="modelBadge"><span class="dot"></span><span id="modelBadgeText">Loading&hellip;</span></div>
    </div>
  </div>

  <div id="chatSearchBar" style="display:none;align-items:center;gap:8px;padding:8px 20px;background:#F5F3EE;border-bottom:0.5px solid #D6D2C8;">
    <input id="chatSearchInput" type="text" placeholder="Search this conversation..." oninput="runChatSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();if(event.shiftKey){prevChatSearchMatch()}else{nextChatSearchMatch()}}else if(event.key==='Escape'){toggleChatSearch()}" style="flex:1;font-size:13px;padding:6px 10px;border:0.5px solid #D6D2C8;border-radius:5px;font-family:Inter,sans-serif;outline:none;"/>
    <span id="chatSearchCounter" style="font-size:11px;color:#9E9890;white-space:nowrap;min-width:52px;text-align:center;"></span>
    <button onclick="prevChatSearchMatch()" style="background:none;border:none;color:#6B6559;cursor:pointer;padding:0 4px;display:inline-flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5"/></svg></button>
    <button onclick="nextChatSearchMatch()" style="background:none;border:none;color:#6B6559;cursor:pointer;padding:0 4px;display:inline-flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg></button>
    <button onclick="toggleChatSearch()" style="background:none;border:none;color:#6B6559;cursor:pointer;padding:0 4px;font-size:16px;">&times;</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-empty" id="chatEmpty">
      <h2>Continue in Forge</h2>
      <p>Picking up this Diary conversation in Forge — same context, ready to keep going.</p>
    </div>
  </div>

  <div id="chatLimitBanner"></div>

  <div id="chatImagePreviewRow" style="display:none;align-items:center;gap:8px;padding:8px 20px 0;flex-wrap:wrap;"></div>

  <div class="chat-input-row">
    <input type="file" id="chatImageFileInput" accept="image/*,application/pdf,text/plain,.txt" multiple style="display:none;" onchange="handleChatFilesSelected(this.files)"/>
    <button id="chatImageAttachBtn" class="chat-icon-btn" onclick="document.getElementById('chatImageFileInput').click()" title="Attach images or PDFs" style="flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13"/></svg></button>
    <textarea id="chatInput" class="chat-input" placeholder="Type your message..." rows="1" oninput="autoResizeChatInput(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}"></textarea>
    <button id="chatSendBtn" class="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>
</div>

<!-- Share Modal — same structure/styling as app.html's own, so sharing
     feels identical regardless of which surface it's triggered from -->
<div id="shareModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(27,42,74,0.5);backdrop-filter:blur(4px);z-index:10500;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border:0.5px solid #D6D2C8;border-radius:12px;padding:2rem;max-width:420px;width:100%;">
    <div style="font-family:Lora,serif;font-size:20px;font-weight:500;color:#1B2A4A;margin-bottom:0.4rem;">Share conversation</div>

      <div onclick="shareVia('whatsapp')" style="border:0.5px solid #D6D2C8;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color 0.15s;" onmouseover="this.style.borderColor='#C17D3C'" onmouseout="this.style.borderColor='#D6D2C8'">
        <div style="font-size:22px;margin-bottom:5px;">💬</div><div style="font-size:12px;color:#6B6559;font-weight:500;">WhatsApp</div>
      </div>
      <div onclick="shareVia('email')" style="border:0.5px solid #D6D2C8;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color 0.15s;" onmouseover="this.style.borderColor='#C17D3C'" onmouseout="this.style.borderColor='#D6D2C8'">
        <div style="font-size:22px;margin-bottom:5px;">📧</div><div style="font-size:12px;color:#6B6559;font-weight:500;">Email</div>
      </div>
      <div onclick="shareVia('copy')" style="border:0.5px solid #D6D2C8;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color 0.15s;" onmouseover="this.style.borderColor='#C17D3C'" onmouseout="this.style.borderColor='#D6D2C8'">
        <div style="font-size:22px;margin-bottom:5px;">📋</div><div style="font-size:12px;color:#6B6559;font-weight:500;">Copy Text</div>
      </div>
      <div onclick="shareVia('word')" style="border:0.5px solid #D6D2C8;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color 0.15s;" onmouseover="this.style.borderColor='#C17D3C'" onmouseout="this.style.borderColor='#D6D2C8'">
        <div style="font-size:22px;margin-bottom:5px;">📝</div><div style="font-size:12px;color:#6B6559;font-weight:500;">Word / Doc</div>
      </div>
      <div onclick="shareVia('print')" style="border:0.5px solid #D6D2C8;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color 0.15s;" onmouseover="this.style.borderColor='#C17D3C'" onmouseout="this.style.borderColor='#D6D2C8'">
        <div style="font-size:22px;margin-bottom:5px;">🖨️</div><div style="font-size:12px;color:#6B6559;font-weight:500;">Print / PDF</div>
      </div>
    </div>
    <button onclick="closeShareModal()" style="width:100%;background:none;border:0.5px solid #D6D2C8;border-radius:6px;padding:9px;color:#6B6559;font-size:13px;cursor:pointer;font-family:Inter,sans-serif;">Cancel</button>
  </div>
</div>

<script src="/js/forge-api.js"></script>
<script>
'use strict';

const MODEL_LABELS = {
  claude: 'Claude', chatgpt: 'ChatGPT', gemini: 'Gemini', mistral: 'Mistral',
  deepseek: 'DeepSeek', perplexity: 'Perplexity', grok: 'Grok', meta: 'Meta (Llama)'
};

// ── Text size (shared with the Diary entry's own font-scale feature) ───────
// Deliberately reuses the SAME localStorage key and CSS variable as
// app.html's applyDiaryFontScale() — confirmed via that feature's own
// comment that this is meant to be "global and persistent... wants it
// everywhere", so a separate, page-specific preference here would
// actually work against that stated intent rather than extend it.
// Genuinely just a port, not a reimplementation — same bounds, same
// step, same functions.
var DIARY_FONT_SCALE_MIN = 0.85;
var DIARY_FONT_SCALE_MAX = 2.0;
var DIARY_FONT_SCALE_STEP = 0.1;
function getDiaryFontScale() {
  var stored = parseFloat(localStorage.getItem('diaryFontScale'));
  return (!isNaN(stored) && stored >= DIARY_FONT_SCALE_MIN && stored <= DIARY_FONT_SCALE_MAX) ? stored : 1;
}
function applyDiaryFontScale(scale) {
  document.documentElement.style.setProperty('--diary-font-scale', scale);
}
function adjustDiaryFontScale(direction) {
  var current = getDiaryFontScale();
  var next = Math.round((current + direction * DIARY_FONT_SCALE_STEP) * 100) / 100;
  next = Math.max(DIARY_FONT_SCALE_MIN, Math.min(DIARY_FONT_SCALE_MAX, next));
  localStorage.setItem('diaryFontScale', next);
  applyDiaryFontScale(next);
}
window.adjustDiaryFontScale = adjustDiaryFontScale;
applyDiaryFontScale(getDiaryFontScale()); // apply immediately on script load, before messages render

// ── Reading width toggle ─────────────────────────────────────────────────
// Persisted (same "wants it everywhere" pattern as the font-scale/sidebar
// preferences) — default stays at the existing, genuinely good-for-
// readability 760px; this offers a wider, opt-in view for anyone working
// on a wide monitor who wants less unused whitespace on either side.
// SVG path data fetched directly from Heroicons' own official GitHub
// repo, not reproduced from memory.
var ICON_EXPAND = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg> Expand';
var ICON_NARROW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9 3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5 5.25 5.25"/></svg> Narrow';
function toggleChatPageWidth() {
  var page = document.getElementById('chatPage');
  var btn = document.getElementById('chatWidthToggleBtn');
  if (!page) return;
  var expanded = page.classList.toggle('chat-page-expanded');
  localStorage.setItem('chatPageExpanded', expanded ? '1' : '0');
  if (btn) btn.innerHTML = expanded ? ICON_NARROW : ICON_EXPAND;
}
window.toggleChatPageWidth = toggleChatPageWidth;
(function applyInitialChatPageWidth() {
  var page = document.getElementById('chatPage');
  var btn = document.getElementById('chatWidthToggleBtn');
  if (page && localStorage.getItem('chatPageExpanded') === '1') {
    page.classList.add('chat-page-expanded');
    if (btn) btn.innerHTML = ICON_NARROW;
  }
})();

let chatModel = 'claude';

// Matches backend/routes/chat.js's own IMAGE_CAPABLE_MODELS exactly —
// kept as a literal, separate constant here rather than fetched from the
// server, since it's small, static, and rarely changes; if a provider is
// ever added/removed there, this needs updating too (this duplication is
// a real, accepted trade-off — not something automatically kept in sync).
const IMAGE_CAPABLE_MODELS = new Set(['claude', 'chatgpt', 'gemini']);
const MAX_CHAT_ATTACHMENTS = 5; // matches backend's own MAX_ATTACHMENTS_PER_MESSAGE exactly — see chat.js for the researched provider-limit rationale

function renderChatAttachmentPreviews() {
  var row = document.getElementById('chatImagePreviewRow');

    // messages — confirmed as a real, direct request: someone should be
    // able to verify they attached the right file BEFORE sending, the
    // same way native chatbot pages already let you preview a staged
    // attachment first. Works directly from the local, in-memory
    // f.base64 data — the file hasn't been uploaded/persisted yet at

    } else if (f.type === 'txt') {
      // Not clickable-to-preview like PDF/image — this is staged, raw
      // text with no server URL yet at all (unlike PDF/image, which
      // still work from local base64 directly), and building a separate
      // "preview raw text before sending" modal just for this case would
      // be real scope creep beyond what was flagged as a trivial add.
      thumb = '<div style="width:40px;height:40px;border-radius:6px;border:0.5px solid #D6D2C8;display:flex;align-items:center;justify-content:center;background:#F5F3EE;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg></div>';
    } else {

    }

// Minimal, local escape helper — kept separate from any shared escHtml
// elsewhere in this file to avoid assuming one exists with the exact
// same name/behavior; filenames are the only untrusted text rendered
// into this specific preview row.
function escHtmlChat(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function handleChatFilesSelected(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  if (chatAttachedFiles.length + files.length > MAX_CHAT_ATTACHMENTS) {
    Forge.showToast('You can attach up to ' + MAX_CHAT_ATTACHMENTS + ' files per message.', 'error');
    return;
  }
  files.forEach(function(file) {
    var isImage = file.type && file.type.startsWith('image/');
    var isPdf = file.type === 'application/pdf';
    // .txt files, genuinely trivial per the earlier open-items list —
    // no AI provider needs a special content block for plain text at
    // all, unlike images/PDFs, so this is handled entirely differently:
    // read as text (not base64) and appended directly into the message
    // itself at send time, rather than going through the
    // attachments/backend-upload path used for images and PDFs. Still
    // uses the same preview-chip staging area for a consistent,
    // reviewable-before-sending experience.
    var isTxt = file.type === 'text/plain' || /\.txt$/i.test(file.name);
    if (!isImage && !isPdf && !isTxt) {
      Forge.showToast(file.name + ': only images, PDFs, and .txt files are supported.', 'error');
      return;
    }
    // 8MB is a conservative, round ceiling comfortably under every target
    // provider's own base64-encoded request-size limits, not a precisely
    // researched per-provider maximum — errs safe rather than risking a
    // provider-side rejection after the user has already waited for a
    // response.
    if (file.size > 8 * 1024 * 1024) {
      Forge.showToast(file.name + ' is too large (max 8MB).', 'error');
      return;
    }
    var reader = new FileReader();
    reader.onload = function() {
      if (isTxt) {
        chatAttachedFiles.push({ textContent: reader.result, filename: file.name, type: 'txt' });
      } else {
        chatAttachedFiles.push({ base64: reader.result, mimeType: file.type, filename: file.name, type: isPdf ? 'pdf' : 'image' });
      }
      renderChatAttachmentPreviews();
    };
    reader.onerror = function() {
      Forge.showToast('Could not read ' + file.name + ' — please try again.', 'error');
    };
    if (isTxt) {
      reader.readAsText(file);
    } else {
      reader.readAsDataURL(file);
    }
  });
}
window.handleChatFilesSelected = handleChatFilesSelected;

function removeChatAttachment(index) {
  chatAttachedFiles.splice(index, 1);
  renderChatAttachmentPreviews();
}
window.removeChatAttachment = removeChatAttachment;

function clearChatImageAttachment() {
  chatAttachedFiles = [];
  renderChatAttachmentPreviews();
  var fileInput = document.getElementById('chatImageFileInput');
  if (fileInput) fileInput.value = '';
}
window.clearChatImageAttachment = clearChatImageAttachment;

let chatDiaryEntryId = null;
let chatHistory = [];
let chatSessionId = null;
let chatIsSending = false;

// ── Sync (Diary Priority 9) ─────────────────────────────────────────────────
const DIARY_EXT_ID = 'momenmcgdmceejapigodolpekonmaedd';
let chatConversationUrl = null;
let chatIsSyncing = false;

function isExtensionAvailable() {
  return typeof chrome !== 'undefined' && !!chrome.runtime;
}

function extSendMessage(payload) {
  return new Promise(function(resolve) {
    if (!isExtensionAvailable()) { resolve(null); return; }
    try {
      chrome.runtime.sendMessage(DIARY_EXT_ID, payload, function(response) {
        if (chrome.runtime.lastError) { resolve(null); return; }
        resolve(response);
      });
    } catch (e) { resolve(null); }
  });
}

// Rough, human, non-precise phrasing — "synced as of [time]" is meant
// to read the same familiar way Dropbox/iCloud/git already do, per the
// brief's own guidance not to over-explain this.
function formatRelativeTime(isoString) {
  if (!isoString) return null;
  var then = new Date(isoString).getTime();
  var diffSec = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (diffSec < 30) return 'just now';
  if (diffSec < 90) return '1 min ago';
  if (diffSec < 3600) return Math.round(diffSec / 60) + ' min ago';
  if (diffSec < 7200) return '1 hour ago';
  if (diffSec < 86400) return Math.round(diffSec / 3600) + ' hours ago';
  return new Date(isoString).toLocaleDateString(undefined, {month:'short', day:'numeric'});
}

// Decided BEFORE any click, never a surprise after — per the explicit
// design requirement: the button's own label already tells the user
// whether this will be near-instant or involves opening a visible tab
// to the original conversation, rather than a tab just appearing
// unannounced once they've already committed to clicking.
async function updateSyncButtonLabel() {
  var btn = document.getElementById('syncBtn');
  if (!btn) return;
  if (!isExtensionAvailable()) {
    btn.style.display = 'none';
    return;
  }
  if (!chatConversationUrl) {
    btn.textContent = '\u{1F504} Sync';
    return;
  }
  var lastSynced = null;
  try {
    var r = await Forge.request('GET', '/api/diary/' + chatDiaryEntryId);
    if (r && r.ok && r.data && r.data.entry) {
      var meta = typeof r.data.entry.metadata === 'string' ? JSON.parse(r.data.entry.metadata) : r.data.entry.metadata;
      lastSynced = meta && meta.lastSyncedAt;
    }
  } catch(_) {}
  var syncedText = lastSynced ? ('Synced ' + formatRelativeTime(lastSynced)) : 'Never synced';
  var tabCheck = await extSendMessage({ type: 'CHECK_TAB_OPEN', conversationUrl: chatConversationUrl });
  var opensNewTab = !(tabCheck && tabCheck.isOpen);
  btn.dataset.syncedText = syncedText;
  btn.textContent = '\u{1F504} ' + syncedText + (opensNewTab ? ' \u2022 opens original conversation' : '');
}

async function performSync() {
  if (chatIsSyncing || !chatConversationUrl) return;
  var btn = document.getElementById('syncBtn');
  chatIsSyncing = true;
  var previousText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '\u{1F504} Syncing\u2026'; btn.disabled = true; }
  try {
    const result = await extSendMessage({ type: 'REQUEST_SYNC', conversationUrl: chatConversationUrl, diaryEntryId: chatDiaryEntryId });
    if (!result || !result.success) {
      Forge.showToast((result && result.error) || 'Sync failed — extension may not be installed.', 'error');
      if (btn) btn.textContent = previousText;
      return;
    }
    // Reflect what actually happened, honestly — a sync "succeeding"
    // (the mechanism ran without error) is a distinct thing from
    // whether it actually found and merged anything, per the brief's
    // own emphasis on not overclaiming here. history_mismatch in
    // particular must surface to the user, not read as a silent,
    // unremarked success — the whole reason the backend surfaces this
    // reason at all instead of just quietly skipping the merge.
    const sync = result.chatSessionSync;
    if (sync && sync.reason === 'history_mismatch') {
      Forge.showToast('Synced the entry, but couldn\u2019t merge into this Forge conversation automatically — the native and Forge histories no longer line up.', 'error');
    } else if (sync && sync.merged) {
      Forge.showToast('Synced — ' + sync.addedCount + ' new message' + (sync.addedCount === 1 ? '' : 's') + ' pulled in.', 'success');
    } else {
      Forge.showToast('Synced — nothing new to pull in.', 'success');
    }
    // Reload to reflect whatever actually changed — the simplest,
    // most reliable way to show a merged conversation without trying
    // to reconcile partial DOM state by hand. Delay raised from 900ms
    // — confirmed live as a real, concrete bug: showToast()'s own
    // default display duration is 3500ms, so the old delay reloaded
    // the whole page (wiping the toast out) while it was still
    // actively showing, before the user had any real chance to notice
    // or read it at all. 2000ms is enough time to actually see a
    // short status message without making the page feel slow to
    // refresh afterward.
    setTimeout(function() { window.location.reload(); }, 2000);
  } finally {
    chatIsSyncing = false;
    if (btn) btn.disabled = false;
    updateSyncButtonLabel();
  }
}
window.performSync = performSync;

function autoResizeChatInput(el) {

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Adapted directly from app.html's own renderWithBubbles() — see that
// function's own comments for the full reasoning on the Sources-split
// and bubble-marker logic; kept in sync deliberately rather than
// sharing via forge-api.js, since this stayed small enough that
// duplicating it here was lower-risk than modifying that shared,
// cross-page module for one page's need. Safe to call for EVERY
// message, not just seeded ones: degrades to plain Forge.renderMarkdown()
// when no bubble marker or Sources footer is present at all, which is
// always true for a freshly-generated response.
function renderWithBubbles(text) {
  var sourcesHtml = '';
  var sourcesMatch = text.match(/\n\n---\n\n\*\*Sources:\*\*\n([\s\S]*)$/);
  if (sourcesMatch) {
    text = text.slice(0, sourcesMatch.index);
    var sourceLines = sourcesMatch[1].split('\n').filter(function(l) { return l.trim(); });
    var sourcesBody = Forge.renderMarkdown(sourcesMatch[1]).replace(/<p>\s*<\/p>/g, '');
    var sid = 'src-' + Math.random().toString(36).slice(2, 10);
    sourcesHtml = '<div style="margin-top:14px;">' +
      '<button onclick="event.stopPropagation();var b=document.getElementById(\'' + sid + '\');var open=b.style.display!==\'none\';b.style.display=open?\'none\':\'block\';this.querySelector(\'.sources-chevron\').style.transform=open?\'rotate(-90deg)\':\'rotate(0deg)\';" ' +
        'style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px 0;font-size:12px;color:#6B6559;font-family:Inter,sans-serif;">' +
        '<span class="sources-chevron" style="display:inline-block;transition:transform 0.15s;transform:rotate(-90deg);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg></span>' +
        'Sources (' + sourceLines.length + ')' +
      '</button>' +
      '<div id="' + sid + '" style="display:none;padding-left:18px;font-size:13px;color:#6B6559;">' + sourcesBody + '</div>' +
    '</div>';
  }

  var TITLE_MARK = '\u2063';
  var markerRe = new RegExp(TITLE_MARK + '\\*\\*([^*]+)\\*\\*' + TITLE_MARK, 'g');
  var html = '';
  var lastIndex = 0;
  var m;
  var found = false;
  while ((m = markerRe.exec(text)) !== null) {
    found = true;
    var before = text.slice(lastIndex, m.index).replace(/^\n+|\n+$/g, '');
    if (before) html += Forge.renderMarkdown(before).replace(/<p>\s*<\/p>/g, '');
    var isLongQuestion = m[1].length > 150 || (m[1].match(/\n/g) || []).length > 1;
    html += '<div class="' + (isLongQuestion ? 'user-bubble-long' : 'user-bubble') + '">' + escHtml(m[1]) + '</div>';
    lastIndex = markerRe.lastIndex;
  }
  if (!found) return Forge.renderMarkdown(text).replace(/<p>\s*<\/p>/g, '') + sourcesHtml;
  var rest = text.slice(lastIndex).replace(/^\n+/, '');
  if (rest) html += Forge.renderMarkdown(rest).replace(/<p>\s*<\/p>/g, '');
  return html + sourcesHtml;
}

function addMessageToDOM(role, content, opts) {

  if (opts.id) div.id = opts.id;

        '<div class="chat-msg-footer"><button class="chat-icon-btn" onclick="copyMsgContent(\'' + msgId + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 7.5V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08M15.75 18H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08M15.75 18.75v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5A3.375 3.375 0 0 0 6.375 7.5H5.25m11.9-3.664A2.251 2.251 0 0 0 15 2.25h-1.5a2.251 2.251 0 0 0-2.15 1.586m5.8 0c.065.21.1.433.1.664v.75h-6V4.5c0-.231.035-.454.1-.664M6.75 7.5H4.875c-.621 0-1.125.504-1.125 1.125v12c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V16.5a9 9 0 0 0-9-9Z"/></svg> Copy</button><button class="chat-icon-btn" onclick="printMsgContent(\'' + msgId + '\')" style="margin-left:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z"/></svg> Print / PDF</button></div>';
    }
  } else {
    var previewUrls = opts.imagePreviewURLs || (opts.imagePreviewURL ? [opts.imagePreviewURL] : []);
    var imgHtml = previewUrls.map(function(u) {
      return '<img src="' + u + '" onclick="event.stopPropagation();openImageZoom(\'' + u.replace(/'/g, "\\'") + '\')" style="max-width:200px;max-height:200px;border-radius:8px;display:block;margin-bottom:6px;cursor:zoom-in;"/>';
    }).join('');
    // PDF chips — clickable, opening the reader modal above. Distinct
    // from the pre-send preview chip (which disappears once sent): this
    // is the persistent, in-message representation, since a PDF has no
    // meaningful inline thumbnail the way an image does.
    var pdfChipsHtml = (opts.pdfAttachments || []).map(function(p) {
      return '<div onclick="event.stopPropagation();openAttachmentReader(\'' + p.url.replace(/'/g, "\\'") + '\',\'' + (p.filename || 'document.pdf').replace(/'/g, "\\'") + '\',\'pdf\')" style="display:inline-flex;align-items:center;gap:6px;background:#F5F3EE;border:0.5px solid #D6D2C8;border-radius:8px;padding:6px 10px;margin-bottom:6px;cursor:pointer;font-size:12px;color:#6B6559;">' + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>' + escHtmlChat(p.filename || 'document.pdf') + '</div>';
    }).join('<br/>');
    // .txt chips — confirmed as a real, direct gap: since a .txt file's

    var txtChipsHtml = (opts.txtAttachments || []).map(function(t) {
      return '<div style="display:inline-flex;align-items:center;gap:6px;background:#F5F3EE;border:0.5px solid #D6D2C8;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px;color:#6B6559;">' + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-2px;margin-right:3px;"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>' + escHtmlChat(t.filename || 'document.txt') + '</div>';

  // the conversation, would be a jarring, backwards scroll hijack.
  if (opts.insertBeforeEl) {
    container.insertBefore(div, opts.insertBeforeEl);
  } else {
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }
  return div;
}

function copyMsgContent(msgId) {
  var el = document.getElementById(msgId);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(function() {

// Prints/saves-as-PDF a SINGLE message — confirmed as a real, distinct gap
// from the existing whole-thread "Print / PDF" option in the share modal
// (shareVia('print') below): that option only ever exports the entire
// conversation, with no way to capture just one specific answer, even
// though the per-message Copy button right next to this one already does
// exactly that for plain text. Reuses el.innerHTML directly rather than
// re-rendering from chatHistory's raw markdown — this is already exactly
// what's genuinely, visibly displayed for this one message on the page
// right now, so there's no risk of it drifting from what the user actually
// sees. Same window.open + write + print() mechanism as the whole-thread
// version, for a consistent experience and print stylesheet between the two.

function buildChatThreadText() {
  return chatHistory.map(function(m) {
    return (m.role === 'user' ? 'You: ' : (MODEL_LABELS[chatModel] || chatModel) + ': ') + m.content;
  }).join('\n\n');
}

function copyChatThread() {

// ── Share (same modal/behavior as app.html's own shareEntry(), ported
// rather than shared as a JS module — these two pages don't share code

// to this page: unlike a Diary entry, continue.html is private and

function shareVia(channel) {
  var nl = String.fromCharCode(10);
  var title = 'Forge conversation (' + (MODEL_LABELS[chatModel] || chatModel) + ')';
  var body = buildChatThreadText();
  // Attribution footer — confirmed intentional, applied across every
  // export channel here (not just document-style ones), since the goal is
  // brand visibility wherever content leaves the app, not just formal
  // "documents" specifically. Added AFTER encodeURIComponent's own
  // 2000-char slice below for whatsapp/email specifically, so a long
  // conversation that already fills that limit can't silently push the
  // footer itself out — it must always appear regardless of body length.
  var footerText = nl + nl + '— Generated by Forge';
  var footerHtml = '<p style="margin-top:32px;padding-top:12px;border-top:1px solid #D6D2C8;font-size:10pt;color:#9E9890;">Generated by Forge</p>';
  var encoded = encodeURIComponent(body.slice(0, 2000) + footerText);
  var encodedTitle = encodeURIComponent(title);

  if (channel === 'whatsapp') {
    window.open('https://wa.me/?text=' + encodedTitle + '%0A%0A' + encoded, '_blank');
  } else if (channel === 'email') {
    window.location.href = 'mailto:?subject=' + encodedTitle + '&body=' + encoded;
  } else if (channel === 'copy') {
    navigator.clipboard.writeText(title + nl + nl + body + footerText).then(function() {
      Forge.showToast('Copied to clipboard', 'success');
      closeShareModal();
    });
    return;
  } else if (channel === 'word') {
    var blob = new Blob(['<html><body><h2>' + title + '</h2>' + (Forge.renderMarkdown ? Forge.renderMarkdown(body) : body) + footerHtml + '</body></html>'], {type: 'application/msword'});
    var docUrl = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = docUrl; a.download = title.slice(0,50) + '.doc'; a.click();
    URL.revokeObjectURL(docUrl);
    closeShareModal();
    return;
  } else if (channel === 'print') {
    var w = window.open(' ', '_blank');
    w.document.write('<html><head><title>' + title + '</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;font-size:12pt;line-height:1.8}h2{font-size:16pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px}</style></head><body><h2>' + title + '</h2>' + (Forge.renderMarkdown ? Forge.renderMarkdown(body) : body) + footerHtml + '</body></html>');
    w.document.close();
    w.print();
    closeShareModal();
    return;
  }
  closeShareModal();
}
window.shareVia = shareVia;

// NOTE: fork-marker write-back — see app.html's own display of this
// for the visible badge. Writes BOTH the exact same field name Forge's
// own chat.html already writes (metadata.chatSessionId — confirmed
// directly in that file before building this, so an entry forked from
// either surface is recognized identically) and a new
// metadata.forkedToForgeAt timestamp, since Forge's own version never
// tracked a fork date at all — needed here to show "Forked on [date]"
// without an extra round-trip to chat_sessions just to read its
// created_at.
function linkChatSessionToDiaryEntry(sessionId, isFirstFork, nativeSeedCount) {
  if (!chatDiaryEntryId) return;
  var patch = { metadata: { chatSessionId: sessionId } };
  if (isFirstFork) {
    patch.metadata.forkedToForgeAt = new Date().toISOString();
    patch.metadata.nativeSeedMessageCount = nativeSeedCount;
  }
  Forge.request('PATCH', '/api/diary/' + chatDiaryEntryId, patch).catch(function() {});
}

function showLimitBanner(used, limit, customMessage) {
