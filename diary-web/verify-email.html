<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify email — Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body { background: #F5F3EE; color: #1B2A4A; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; overflow-x: hidden; }
    .card { background: #fff; border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #1B2A4A; text-align: center; margin-bottom: 0.5rem; }
    .logo span { color: #C17D3C; }
    h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { font-size: 13px; color: #6B6559; text-align: center; margin-bottom: 1.75rem; line-height: 1.5; }
    label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 4px; }
    input { width: 100%; border: 1px solid #D6D2C8; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; margin-bottom: 1rem; }
    input:focus { border-color: #C17D3C; }
    .btn { width: 100%; background: #1B2A4A; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; }
    .btn:hover { background: #243A63; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 1rem; display: none; }
    .success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 1rem; display: none; }
    .back { text-align: center; margin-top: 1.25rem; font-size: 13px; color: #6B6559; }
    .back a { color: #C17D3C; text-decoration: none; font-weight: 500; }
      .form-group { margin-bottom: 0; }
    .icon { font-size: 40px; text-align: center; margin-bottom: 0.75rem; }
    .cta { display: none; text-align: center; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Diary<span>.</span></div>
    <div class="icon" id="icon">⏳</div>
    <h2 id="title">Verifying your email...</h2>
    <p class="subtitle" id="sub">Please wait a moment.</p>
    <a href="/app" class="btn cta" id="cta">Open Diary →</a>
  </div>
  <script>
    (async function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var email = params.get('email');
      var icon = document.getElementById('icon');
      var title = document.getElementById('title');
      var sub = document.getElementById('sub');
      if (!token || !email) {
        icon.textContent = '❌'; title.textContent = 'Invalid link';
        sub.textContent = 'This verification link is missing required information.';
        return;
      }
      try {
        var r = await fetch('https://api.projectcoachai.com/api/auth/verify-email?token=' + encodeURIComponent(token) + '&email=' + encodeURIComponent(email));
        var data = await r.json();
        if (data.success) {
          icon.textContent = '✅'; title.textContent = 'Email verified';
          sub.textContent = 'Your Diary account is now fully activated.';
          document.getElementById('cta').style.display = 'block';
        } else {
          icon.textContent = '❌'; title.textContent = 'Verification failed';
          sub.textContent = data.error || 'This link may have expired. Please request a new one.';
        }
      } catch (e) {
        icon.textContent = '❌'; title.textContent = 'Something went wrong';
        sub.textContent = 'Please try again or contact support.';
      }
    })();
  </script>
</body>
</html>
